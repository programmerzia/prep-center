{ id:"sql-1", cat:"SQL", t:"Indexes and reading a query plan", min:9,
 bn:"ইনডেক্স হলো সাজানো একটি গাছ (B-tree) যা পুরো টেবিল না পড়ে দ্রুত খুঁজে দেয়। কিন্তু প্রতিটি ইনডেক্স লেখার গতি কমায়, তাই যা দিয়ে ফিল্টার/জয়েন/সর্ট করেন কেবল তাতেই ইনডেক্স দিন। সবচেয়ে বেশি জিজ্ঞাসিত নিয়ম: composite ইনডেক্স (a,b,c) কেবল a, বা a+b, বা a+b+c দিয়ে খুঁজলে কাজ করে — শুধু b দিয়ে খুঁজলে কাজ করে না। ইনডেক্স কাজ করে না যখন: কলামে ফাংশন লাগান (YEAR(created_at)), শুরুতে wildcard দেন (LIKE '%x'), বা কলামটির ভিন্নতা কম (boolean)। EXPLAIN পড়ে দেখুন full scan বা filesort আছে কিনা।", body:[
 {h:"How a B-tree index works"},
 {p:"A sorted tree that turns a full scan into a logarithmic lookup. Every index speeds reads and slows writes, because each insert and update must maintain every index on the table, and it consumes storage. That trade-off is the entire answer to 'should I add an index here?'"},
 {h:"The leftmost prefix rule — the most-asked index question"},
 {p:"An index on (tenant_id, status, created_at) serves queries filtering on tenant_id, or tenant_id + status, or all three. It does not serve a query filtering on status alone. So column order is a design decision, not an arbitrary list."},
 {list:["Put the column you always filter on first — usually tenant_id in a multi-tenant system.",
 "Equality conditions before range conditions: a range stops the index being usable for subsequent columns.",
 "A covering index contains every column the query needs, so the database never touches the table at all — an index-only scan."]},
 {h:"When an index doesn't help"},
 {list:["Low-cardinality columns like booleans — the index isn't selective enough to beat a scan.",
 "Leading wildcards: LIKE '%term' can't use a B-tree.",
 "A function applied to the column: WHERE YEAR(created_at) = 2026 kills the index. Use a range on created_at instead.",
 "Implicit type casts — comparing a string column to an integer silently disables the index.",
 "Very small tables, where a scan is genuinely cheaper."]},
 {h:"Reading EXPLAIN"},
 {p:"Look for: full table scans on large tables, 'Using filesort', 'Using temporary', rows examined vastly exceeding rows returned, and in Postgres a Seq Scan where you expected an Index Scan. EXPLAIN ANALYZE gives you actual execution time rather than estimates."},
 {code:"EXPLAIN ANALYZE\nSELECT o.id, o.total\nFROM orders o\nWHERE o.tenant_id = 5\n  AND o.status = 'paid'\n  AND o.created_at >= '2026-01-01'\nORDER BY o.created_at DESC\nLIMIT 20;\n\n-- Index that serves this fully:\nCREATE INDEX idx_orders_tenant_status_created\n  ON orders (tenant_id, status, created_at DESC);"},
 {tip:"The sequence to recite when asked to fix a slow query: reproduce, EXPLAIN, check indexes on WHERE/JOIN/ORDER BY columns, check composite ordering, remove functions from indexed columns, reduce selected columns, fix N+1, and only then consider caching or denormalization."}],
 docs:[{l:"PostgreSQL — Using EXPLAIN",u:"https://www.postgresql.org/docs/current/using-explain.html"},{l:"MySQL — Optimization and indexes",u:"https://dev.mysql.com/doc/refman/8.0/en/optimization.html"},{l:"Use The Index, Luke",u:"https://use-the-index-luke.com/"}],
 drill:"Create a table with 100k rows. Run a query without an index, read EXPLAIN, add the composite index, run again, compare. Do it until the plan output stops looking foreign." },

{ id:"sql-2", cat:"SQL", t:"Transactions, isolation and locking", min:8,
 bn:"ট্রানজেকশনের চারটি গুণ ACID। Isolation level জানা জরুরি: Read Committed (PostgreSQL ডিফল্ট) নোংরা পড়া ঠেকায়, Repeatable Read (MySQL ডিফল্ট) একই সারি বারবার পড়লে একই ফল দেয়, Serializable সব সমস্যা ঠেকায় কিন্তু ধীর। স্টক বা বুকিংয়ের রেস কন্ডিশন ঠেকাতে SELECT ... FOR UPDATE ব্যবহার করুন — দ্বিতীয় ট্রানজেকশন অপেক্ষা করবে। কম সংঘর্ষের ক্ষেত্রে version কলাম দিয়ে optimistic locking ভালো। Deadlock হয় যখন দুটি ট্রানজেকশন একে অপরের লকের জন্য অপেক্ষা করে — সবখানে একই ক্রমে লক নিলে এটি এড়ানো যায়, আর deadlock হলে retry করাই স্বাভাবিক।", body:[
 {h:"ACID, stated plainly"},
 {p:"Atomicity — all steps or none. Consistency — constraints hold before and after. Isolation — concurrent transactions don't corrupt each other. Durability — once committed, it survives a crash."},
 {h:"Isolation levels and what each prevents"},
 {list:["Read Uncommitted — allows dirty reads (seeing uncommitted data). Effectively never used.",
 "Read Committed — Postgres default. No dirty reads; non-repeatable reads still possible.",
 "Repeatable Read — MySQL/InnoDB default. Same row reads consistently within the transaction; phantoms theoretically possible, though InnoDB blocks most via gap locks.",
 "Serializable — prevents everything, at real concurrency cost."]},
 {p:"Define the three anomalies in one line each: dirty read is reading uncommitted data; non-repeatable read is the same row differing when re-read; phantom is the same query returning new rows."},
 {h:"Locking"},
 {code:"-- Pessimistic: the second transaction blocks here\nBEGIN;\nSELECT stock FROM products WHERE id = 10 FOR UPDATE;\nUPDATE products SET stock = stock - 1 WHERE id = 10;\nCOMMIT;\n\n-- Optimistic: no lock, detect conflict on write\nUPDATE bookings\n   SET slot = '10:00', version = version + 1\n WHERE id = 5 AND version = 3;\n-- 0 rows affected means someone else changed it — retry"},
 {p:"Pessimistic locking suits short, high-contention operations like stock decrement. Optimistic suits low-contention edits where blocking would hurt more than retrying."},
 {h:"Deadlocks"},
 {p:"Two transactions each holding a lock the other needs. Prevent by acquiring locks in a consistent order everywhere in the codebase, keeping transactions short, and touching fewer rows. Critically: retry on deadlock errors. They are a normal operating condition, not a bug to eliminate entirely — saying this marks real production experience."}],
 docs:[{l:"PostgreSQL — Transaction isolation",u:"https://www.postgresql.org/docs/current/transaction-iso.html"},{l:"MySQL — InnoDB locking",u:"https://dev.mysql.com/doc/refman/8.0/en/innodb-locking.html"}],
 drill:"Open two database sessions. Reproduce a lost update, then fix it with FOR UPDATE. Then deliberately cause a deadlock by locking two rows in opposite order in each session." },

{ id:"sql-3", cat:"SQL", t:"Window functions, modelling, and zero-downtime migrations", min:9,
 bn:"Window function জানলে তিনটি কোয়েরির কাজ একটিতে হয়ে যায়। সবচেয়ে দরকারি প্যাটার্ন: ROW_NUMBER() OVER (PARTITION BY ... ORDER BY ...) দিয়ে প্রতিটি গ্রুপের শীর্ষ N বের করা। SUM() OVER (ORDER BY ...) দিয়ে running total, LAG() দিয়ে আগের সারির সাথে তুলনা। ডাউনটাইম ছাড়া মাইগ্রেশনের নিয়ম: প্রথমে নতুন nullable কলাম যোগ করুন, তারপর দুই জায়গায় লেখা শুরু করুন, তারপর ধাপে ধাপে পুরনো ডেটা ভরুন, তারপর পড়া বদলান, সবশেষে পুরনো কলাম মুছুন। চালু অবস্থায় কলামের নাম সরাসরি বদলাবেন না।", body:[
 {h:"The window function template to memorize"},
 {code:"-- Top N per group — answers a whole family of questions\nSELECT * FROM (\n  SELECT p.*,\n         ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY sales DESC) AS rn\n  FROM products p\n) t\nWHERE rn <= 3;\n\n-- Running total\nSELECT month,\n       SUM(revenue) OVER (ORDER BY month) AS running_total\nFROM monthly_revenue;\n\n-- Month-over-month growth\nSELECT month, revenue,\n       LAG(revenue) OVER (ORDER BY month) AS prev,\n       ROUND(100.0 * (revenue - LAG(revenue) OVER (ORDER BY month))\n             / NULLIF(LAG(revenue) OVER (ORDER BY month), 0), 1) AS pct\nFROM monthly_revenue;"},
 {p:"ROW_NUMBER, RANK, DENSE_RANK, LAG, LEAD, SUM/AVG OVER PARTITION BY. Knowing these turns three-query problems into one."},
 {h:"Normalization and deliberate denormalization"},
 {p:"3NF in one line: each fact lives in one place. Denormalize deliberately for read-heavy reporting or precomputed counters. But note the distinction interviewers probe: storing the product price at time of order isn't denormalization, it's correctness — prices change and historical orders must not."},
 {h:"Keys"},
 {p:"Auto-increment integers are compact and index-friendly but leak business volume and collide across systems. UUIDv4 is random, which hurts B-tree locality and causes page splits on insert. ULID or UUIDv7 are time-sortable and fix that — usually the right answer for distributed or multi-tenant systems."},
 {h:"Zero-downtime migrations — the expand/contract pattern"},
 {list:["Add the new nullable column. Deploy. Old code is unaffected.",
 "Deploy code that writes to both old and new columns.",
 "Backfill existing rows in batches (chunkById), not one giant UPDATE.",
 "Deploy code that reads from the new column.",
 "In a later release, drop the old column."]},
 {p:"Never rename a column in place while old code is running — the old code queries a column that no longer exists. On very large tables you may need online schema-change tooling. Everything should be reversible, or forward-only with a documented rollback."}],
 docs:[{l:"PostgreSQL — Window functions tutorial",u:"https://www.postgresql.org/docs/current/tutorial-window.html"},{l:"Laravel — Migrations",u:"https://laravel.com/docs/migrations"}],
 drill:"Write the ten drill queries in the Code section by hand against a real database. Then perform an expand/contract column rename on a table with data in it." },

/* ================= ARCHITECTURE ================= */
{ id:"arch-1", cat:"Architecture", t:"Layered architecture and knowing when not to use it", min:8,
 bn:"লেয়ার্ড আর্কিটেকচারে চারটি স্তর: Domain (ব্যবসায়িক নিয়ম, কোনো ফ্রেমওয়ার্ক নেই), Application (ইউজ কেস, ট্রানজেকশন), Infrastructure (ডেটাবেজ, বাইরের API), Web (কন্ট্রোলার)। নির্ভরতা সবসময় ভেতরের দিকে যায় — Infrastructure Domain-এর উপর নির্ভর করে, উল্টোটা নয়। সুবিধা: ডেটাবেজ ছাড়াই ব্যবসায়িক লজিক টেস্ট করা যায়। অসুবিধা: বেশি ফাইল, বেশি সময়। সবচেয়ে ভালো উত্তর হলো ভারসাম্য দেখানো — সাধারণ CRUD অ্যাপে এই কাঠামো অতিরিক্ত, আর জটিল ডোমেইনে এটি মূল্যবান। যারা মনে করে একটি আর্কিটেকচার সব জায়গায় খাটে, ইন্টারভিউয়াররা তাদের সন্দেহ করেন।", body:[
 {p:"You built this at Osilion, so you can speak from experience rather than theory — which is exactly what separates a good answer from a recited one."},
 {h:"The layers"},
 {list:["Domain — entities, value objects, business rules. No framework, no database, no HTTP.",
 "Application — use cases orchestrating domain objects. Transactions start here.",
 "Infrastructure — persistence (EF Core, Eloquent), external APIs, storage, email.",
 "Web/API — controllers, request/response mapping, authentication wiring."]},
 {p:"Dependencies point inward. Infrastructure depends on domain, never the reverse, which is achieved by defining interfaces in the inner layers and implementing them in the outer ones. That's dependency inversion doing real work."},
 {h:"The honest trade-off"},
 {p:"Benefits: domain logic is testable without a database, and swapping the ORM, mail provider or storage is a local change. Costs: more files, more indirection, and slower initial development. For a CRUD-heavy product, Laravel's default MVC plus service classes is frequently the correct choice, and saying so is a strength rather than a weakness."},
 {tip:"Interviewers are suspicious of candidates who think one architecture fits everything. The best answer names the context: 'The recruitment domain had genuine rules — interview configuration, scoring, workflow state — so layering paid off. For a straightforward CRUD admin panel I wouldn't do it.'"},
 {h:"Repository and Specification"},
 {p:"Repository abstracts persistence behind a collection-like interface. Specification wraps a query rule in an object so rules compose — new ActiveCandidates()->and(new AppliedAfter($date)). The reason it was worth it at Osilion: candidate filters combined in many different ways across use cases, and without specifications the repository grows thirty near-duplicate methods that can't be tested independently."},
 {h:"CQRS-lite"},
 {p:"Separate read models from write models when the shapes genuinely diverge — denormalized tables for dashboards while writes go through the domain. Mention it only if you've actually done it; claiming CQRS you haven't built is an easy way to get caught."}],
 docs:[{l:"Microsoft — DDD/CQRS microservice architecture",u:"https://learn.microsoft.com/en-us/dotnet/architecture/microservices/microservice-ddd-cqrs-patterns/"},{l:"Martin Fowler — Patterns of Enterprise Application Architecture catalog",u:"https://martinfowler.com/eaaCatalog/"}],
 drill:"Draw the AI Recruitment Platform's layers on paper from memory. Then explain aloud, in six minutes, why each boundary exists and one place where the layering cost you time." },

{ id:"arch-2", cat:"Architecture", t:"Offline-first and sync — your standout story", min:10,
 bn:"অফলাইন-ফার্স্ট সিঙ্ক আপনার সবচেয়ে চমকপ্রদ কারিগরি গল্প — খুব কম প্রার্থী এ নিয়ে কথা বলতে পারে। মূল কাঠামো: সব লেখা প্রথমে ডিভাইসে (IndexedDB) যায় তাই UI কখনো আটকায় না, অপেক্ষমাণ কাজগুলো একটি outbox-এ জমা হয়, ইন্টারনেট এলে ব্যাকগ্রাউন্ডে সিঙ্ক হয়। সবচেয়ে গুরুত্বপূর্ণ অংশ কনফ্লিক্ট সমাধান — সবচেয়ে বুদ্ধিমান উত্তর হলো ডোমেইন এমনভাবে ডিজাইন করা যাতে কনফ্লিক্ট কমই হয় (বিক্রয় append-only, তাই দুই ডিভাইসের বিক্রয় সাংঘর্ষিক নয়)। প্রতিটি অপারেশনে ক্লায়েন্ট-জেনারেটেড আইডি দিন যাতে পুনরায় সিঙ্ক হলে ডুপ্লিকেট না হয়। ডিভাইসের ঘড়ি ভুল হতে পারে, তাই সার্ভার টাইমস্ট্যাম্প ব্যবহার করুন।", body:[
 {p:"Very few candidates can discuss this credibly. It is the most technically impressive thing you own, so it deserves more rehearsal than anything else in your prep."},
 {h:"Why offline-first"},
 {p:"Unreliable connectivity. A point-of-sale system that stops working when the internet drops is worthless to a shop owner — so the local device must be the source of truth for the duration of the outage, and the server reconciles later."},
 {h:"The architecture"},
 {list:["Local-first writes — every mutation goes to local storage (IndexedDB) immediately, so the UI never blocks on the network.",
 "An outbox — pending operations queue locally with client-generated IDs.",
 "Background sync — a process drains the outbox when connectivity returns; the server responds with authoritative state.",
 "Reconciliation — the client applies server state, resolving any divergence."]},
 {h:"Conflict resolution — the part they'll probe"},
 {p:"Options, in increasing sophistication: last-write-wins (simple, lossy); per-field server-authoritative merge; version vectors; or — the smartest answer — model the domain so conflicts are rare by construction. A sale is append-only: two devices creating sales don't conflict, they both happened. Designing away conflicts beats resolving them."},
 {h:"The details that prove you built it"},
 {list:["Idempotency — every operation carries a client-generated ID, so a replayed sync doesn't duplicate a sale.",
 "Ordering — per-device sequence numbers so operations apply in a causally sensible order.",
 "Clock skew — device clocks lie, sometimes by hours. Prefer server timestamps or logical clocks for anything authoritative.",
 "Schema migration of local data — the hard operational problem nobody warns you about.",
 "Partial sync failure — what happens when operation 3 of 10 fails."]},
 {tip:"Structure the six-minute version: problem (shops with bad internet), architecture (local-first + outbox + background sync), the hard decision (conflict strategy and why append-only modelling), a failure you hit, and what you'd do differently."}],
 docs:[{l:"MDN — IndexedDB API",u:"https://developer.mozilla.org/en-US/docs/Web/API/IndexedDB_API"},{l:"MDN — Progressive Web Apps",u:"https://developer.mozilla.org/en-US/docs/Web/Progressive_web_apps"},{l:"CRDTs explained (crdt.tech)",u:"https://crdt.tech/"}],
 drill:"Record yourself explaining CoreBari's sync for six minutes with a hand-drawn diagram. Listen back. Anywhere you hedged is a place you need to decide what you actually believe." },

{ id:"arch-3", cat:"Architecture", t:"Idempotency, webhooks, and integration reality", min:8,
 bn:"Idempotency মানে একই অনুরোধ দুবার এলেও ফল একই থাকবে — এটি এড়ানো যায় না কারণ নেটওয়ার্ক রিট্রাই করে, পেমেন্ট গেটওয়ে ওয়েবহুক বারবার পাঠায়, ইউজার দুবার ক্লিক করে। পদ্ধতি: ক্লায়েন্ট একটি Idempotency-Key পাঠায়, সার্ভার সেটি টেবিলে খোঁজে, পাওয়া গেলে আগের রেসপন্স ফেরত দেয়, না পেলে প্রসেস করে কী সংরক্ষণ করে। ওয়েবহুকে তিনটি ধাপ: আগে সিগনেচার যাচাই, তারপর event_id দিয়ে ডুপ্লিকেট চেক, তারপর দ্রুত 2xx ফেরত দিয়ে ভারী কাজ কিউতে পাঠানো। বাইরের API কলে সবসময় timeout দিন — নইলে একটি ঝুলে থাকা কল worker আটকে দেবে।", body:[
 {p:"You integrated bKash and Nagad at CoreBari and built email delivery at Osilion — so these questions land directly in your experience. Use concrete examples, not textbook ones."},
 {h:"Why idempotency is unavoidable"},
 {p:"Networks retry. Payment gateways retry webhooks, sometimes for days. Users double-click. Queue workers die after doing work but before acknowledging it. If your system can't handle the same operation arriving twice, it will eventually charge someone twice."},
 {h:"The idempotency-key pattern"},
 {list:["Client sends an Idempotency-Key header on POST.",
 "Server looks the key up in a processed_requests table.",
 "If found — return the stored original response and do nothing else.",
 "If not — process inside a transaction, store the key with the response, return."]},
 {h:"Webhook handling — the specific version"},
 {code:"public function handle(Request $request)\n{\n    // 1. Verify signature FIRST — never trust the payload\n    if (! $this->signatureValid($request)) {\n        return response()->json(['message' => 'Invalid signature'], 401);\n    }\n\n    $eventId = $request->input('event_id');\n\n    // 2. Deduplicate — providers retry aggressively\n    if (ProcessedEvent::where('event_id', $eventId)->exists()) {\n        return response()->noContent(); // already handled\n    }\n\n    // 3. Record and queue — return fast so they don't time out and retry\n    ProcessedEvent::create(['event_id' => $eventId]);\n    ProcessPaymentWebhook::dispatch($request->all())->afterCommit();\n\n    return response()->noContent();\n}"},
 {p:"The three things interviewers listen for: verify the signature before anything else, deduplicate by the provider's event ID, and return 2xx quickly while doing heavy work in a queued job."},
 {h:"Webhooks you send"},
 {p:"Exponential backoff with jitter, HMAC-signed payloads, event IDs so consumers can deduplicate, and a dead-letter queue for permanently failing endpoints."},
 {h:"Unreliable third parties generally"},
 {p:"Timeouts on every external call — a call with no timeout will eventually hang a worker. Retries with backoff. A circuit breaker so a dead provider doesn't take your app down. Graceful degradation where possible. And log the request/response pair, because integration bugs are always argued about with the vendor later."}],
 docs:[{l:"Stripe — Idempotent requests",u:"https://docs.stripe.com/api/idempotent_requests"},{l:"Stripe — Webhook best practices",u:"https://docs.stripe.com/webhooks"}],
 drill:"Write an idempotent webhook endpoint with signature verification and a processed-events table. Fire the same event five times and confirm exactly one side effect." },

{ id:"arch-4", cat:"Architecture", t:"System design questions and how to run them", min:9,
 bn:"সিস্টেম ডিজাইনে উত্তরের চেয়ে পদ্ধতি বেশি নম্বর পায়। আগে স্পষ্ট করার প্রশ্ন করুন: কত ইউজার, পড়া-লেখার অনুপাত কত, কতটা কনসিসটেন্সি দরকার, টিম কত বড়। সরাসরি বক্স আঁকা শুরু করলে নম্বর কাটা যায়। ট্রাফিক ১০ গুণ বাড়লে কী ভাঙবে — উত্তর ক্রমানুসারে: ডেটাবেজ কানেকশন ও ধীর কোয়েরি, তারপর ক্যাশ মিস, তারপর কিউ জমে যাওয়া। ছোট টিমের জন্য microservices নয়, modular monolith সঠিক উত্তর — কারণ distributed system-এর জটিলতা পাঁচজনের টিম সামলাতে পারে না। প্রোডাকশন সমস্যায় নিয়ম: আগে সমাধান (rollback), পরে কারণ খোঁজা।", body:[
 {h:"The process — worth more marks than the answer"},
 {p:"Always clarify before designing. Scale? Number of users? Read/write ratio? Consistency requirements? Team size? Budget? Candidates who start drawing boxes immediately get marked down, regardless of how good the boxes are."},
 {p:"Then: sketch the components, define the data model, walk one request end-to-end, identify bottlenecks, and state the trade-offs you accepted. Say what you're deliberately not solving — 'I'd skip sharding entirely at this scale' is a strong sentence."},
 {h:"Skeletons for the common questions"},
 {list:["Multi-tenant SaaS — tenancy model and isolation enforcement, auth/SSO, per-tenant configuration, noisy-neighbour limits, migrations across tenants, per-tenant backup/restore, subscription entitlements.",
 "Booking system — availability model, holds with expiry, preventing double-booking via locks or unique constraints, payment flow with idempotency, cancellation policy, notifications via queue.",
 "Rate limiter — token bucket in Redis, keyed by user or IP, atomic increment with TTL (Lua for atomicity), 429 with Retry-After.",
 "Bulk email system — queue and workers, provider abstraction so you can swap SES/SendGrid, retries with backoff, bounce and complaint handling, unsubscribe, throttling for deliverability, per-user preferences.",
 "URL shortener / ID generation — hashing vs counters, collision handling, cache-first reads."]},
 {h:"'Your traffic 10x's tomorrow — what breaks?'"},
 {p:"In order: database connections and slow queries, then cache misses, then queue backlog, then storage and bandwidth. Fixes in the same order: indexes and query fixes, caching, connection pooling, horizontally scale stateless app servers, read replicas (accepting replication lag — don't read your own writes from a replica), sharding last and reluctantly."},
 {h:"Monolith vs microservices"},
 {p:"For a five-person team: modular monolith. Microservices buy independent deployment and scaling in exchange for distributed transactions, network failure modes, and operational burden a small team cannot absorb. Extract a service only when one part has a genuinely different scaling or reliability profile. This answer signals judgement; 'microservices because they scale' signals the opposite."},
 {h:"Production incidents"},
 {p:"Detect via alerting, assess user impact, then mitigate before diagnosing — rollback, feature flag, or scale. Communicate status while you work. Root-cause afterwards, and write a blameless post-mortem with one concrete prevention action. 'Mitigate before diagnose' is the phrase interviewers wait for."}],
 docs:[{l:"AWS Builders' Library",u:"https://aws.amazon.com/builders-library/"},{l:"Google SRE Book",u:"https://sre.google/sre-book/table-of-contents/"}],
 drill:"Set a 30-minute timer. Design the booking system aloud with paper, starting with clarifying questions. Record it and listen for whether you jumped straight to solutions." },

/* ================= SECURITY ================= */
{ id:"sec-1", cat:"Security", t:"The OWASP issues you'll actually be asked about", min:10,
 bn:"নিরাপত্তার সবচেয়ে বড় বাস্তব সমস্যা broken access control — অর্থাৎ ইউজার কে তা যাচাই করা হয় কিন্তু এই ডেটা তার কিনা তা যাচাই করা হয় না। URL-এ আইডি বদলে অন্যের অর্ডার দেখা গেলে সেটিই এই সমস্যা, আর মাল্টি-টেন্যান্ট সিস্টেমে এটি ডেটা ফাঁস। সমাধান: প্রতিটি অবজেক্ট অ্যাক্সেসে সার্ভারে অনুমোদন যাচাই করুন এবং প্রতিটি কোয়েরি টেন্যান্ট দিয়ে স্কোপ করুন। SQL injection ঠেকাতে সবসময় parameterized query; whereRaw-এ ইউজার ইনপুট দেবেন না। XSS ঠেকাতে আউটপুট escape করুন — Blade-এ {{ }} নিরাপদ, {!! !!} নয়। SSRF আপনার স্ক্র্যাপিং কাজের সাথে সরাসরি সম্পর্কিত, তাই নিজে থেকেই এটি তুলে ধরুন।", body:[
 {h:"1. Broken access control — the real number one"},
 {p:"Authentication usually works. Authorization quietly doesn't. IDOR: /orders/123 returns someone else's order because the code checked who you are but never whether this object is yours. In a multi-tenant system this is a data breach, not a bug."},
 {p:"Fix: authorize every object access server-side (policies), scope every query by tenant or owner by default, and never trust an ID from the client. Return 404 rather than 403 for objects the user shouldn't know exist."},
 {h:"2. SQL injection"},
 {p:"Parameterized queries always. Eloquent bindings are safe; DB::raw, whereRaw and orderByRaw with interpolated user input are not. orderByRaw with a user-supplied column name is the one people forget — allowlist the column instead."},
 {h:"3. XSS"},
 {p:"Blade's {{ }} escapes; {!! !!} does not. React and Vue escape by default; dangerouslySetInnerHTML and v-html are the holes. Sanitize rich text server-side with a real library, and add a Content-Security-Policy header as defence in depth."},
 {h:"4. CSRF"},
 {p:"A third-party site triggers an authenticated request using the browser's ambient cookie. Fix: CSRF tokens for cookie-authenticated forms plus SameSite=Lax or Strict. Token-authenticated APIs aren't vulnerable the same way, because there's no ambient credential — knowing why is the interesting part of the answer."},
 {h:"5. Secrets and sensitive data"},
 {p:"TLS everywhere. Passwords hashed with bcrypt or argon2 — never MD5 or SHA. Secrets in a vault (you used Azure Key Vault — say so). Never log tokens or PII. APP_DEBUG=false in production so stack traces don't leak your file paths and queries."},
 {h:"6. SSRF — relevant to your scraping work"},
 {p:"User-supplied URLs fetched by your server can reach internal services, cloud metadata endpoints, and private IP ranges. Since you built lead-generation scraping, raise this proactively: allowlist hosts, block private ranges, disable redirects to internal addresses. Mentioning a risk in your own past work before they ask is a strong senior move."},
 {h:"7. File uploads"},
 {p:"Validate MIME type and extension, cap size, store outside the webroot or in object storage, randomize filenames, never execute uploaded content, and scan anything users share with each other."},
 {h:"8. Dependencies and logging"},
 {p:"composer audit, npm audit, Dependabot in CI. Log authentication failures, authorization denials and admin actions — and alert on anomalies. Never log secrets."}],
 docs:[{l:"OWASP Top Ten",u:"https://owasp.org/www-project-top-ten/"},{l:"OWASP Cheat Sheet Series",u:"https://cheatsheetseries.owasp.org/"},{l:"Laravel — Security best practices",u:"https://laravel.com/docs/authentication"}],
 drill:"Audit your own practice API against all eight. Try to access another user's record by changing the ID in the URL — if it works, you just found the most common vulnerability in production software." },

/* ================= TESTING ================= */
{ id:"test-1", cat:"Testing", t:"Testing that convinces an interviewer", min:8,
 bn:"টেস্টিংয়ে Laravel-এ সবচেয়ে বেশি লাভ হয় feature test থেকে — সরাসরি API এন্ডপয়েন্টে রিকোয়েস্ট পাঠিয়ে স্ট্যাটাস, JSON ও ডেটাবেজ যাচাই করা। বিশেষ করে অনুমোদনের টেস্ট লিখুন (অন্য ইউজারের ডেটা দেখা যায় কিনা), কারণ এই শ্রেণির বাগই প্রোডাকশনে সবচেয়ে বিপজ্জনক। বাইরের সার্ভিস mock করুন (Http::fake, Queue::fake), কিন্তু নিজের কোড mock করবেন না — নইলে টেস্ট পাশ করবে অথচ অ্যাপ ভাঙা থাকবে। কভারেজ নিয়ে প্রশ্ন এলে সৎ উত্তর দিন: সংখ্যার পেছনে ছুটি না, টাকা ও অনুমোদন সংক্রান্ত পথগুলো টেস্ট করি।", body:[
 {h:"The practical pyramid"},
 {p:"Many fast unit tests for pure logic, a solid layer of feature tests hitting your API endpoints (in Laravel these give the best value per line by a wide margin), and few end-to-end tests for critical flows like checkout, because they're slow and brittle."},
 {code:"it('creates an order for the authenticated user', function () {\n    $user = User::factory()->create();\n    $product = Product::factory()->create(['price' => 100]);\n\n    $response = $this->actingAs($user)->postJson('/api/orders', [\n        'items' => [['product_id' => $product->id, 'qty' => 2]],\n    ]);\n\n    $response->assertCreated()\n             ->assertJsonPath('data.total', '200.00');\n\n    $this->assertDatabaseHas('orders', ['user_id' => $user->id]);\n});\n\nit('refuses to show another user\\'s order', function () {\n    $mine = User::factory()->create();\n    $theirs = Order::factory()->create();\n\n    $this->actingAs($mine)\n         ->getJson('/api/orders/'.$theirs->id)\n         ->assertNotFound();\n});"},
 {p:"That second test is the one worth writing habitually — authorization tests catch the vulnerability class that actually breaches production."},
 {h:"Fakes"},
 {p:"Http::fake() for external APIs, Queue::fake() with assertPushed, Mail::fake(), Event::fake(), Storage::fake(), Notification::fake(), Bus::fake(). travelTo() to control time. Mock at the boundary — your own internals should be exercised, not mocked, or you get tests that pass while the application is broken."},
 {h:"The coverage question"},
 {p:"When asked about coverage, the senior answer is: 'I don't chase a number. I test the money paths, the authorization rules, and the logic that would fail silently. Coverage measures which lines executed, not whether the behaviour is correct.' That answer is more impressive than claiming 90%."},
 {h:"TDD, honestly"},
 {p:"Few people TDD everything. Say where it genuinely helps you: complex business rules, and bug fixes — write the failing test that reproduces the bug first, then fix it. That practice is universally respected and completely defensible."},
 {h:"Beyond unit tests"},
 {p:"Static analysis (PHPStan/Larastan at a stated level in CI) is a strong signal. Also worth naming: contract tests for APIs, load testing before launches, and frontend testing with Testing Library where you query by role and text rather than implementation details."}],
 docs:[{l:"Laravel — Testing",u:"https://laravel.com/docs/testing"},{l:"Pest PHP",u:"https://pestphp.com/docs/installation"},{l:"Testing Library — guiding principles",u:"https://testing-library.com/docs/guiding-principles/"}],
 drill:"Write feature tests covering the happy path, a validation failure, and an authorization failure for your API. The authorization test is the one that matters most." },

/* ================= DEVOPS ================= */
{ id:"ops-1", cat:"DevOps", t:"Docker, CI/CD and deploying without breaking things", min:9,
 bn:"Docker-এ লেয়ার ক্যাশিং বুঝুন: আগে composer.json কপি করে ইনস্টল করুন, তারপর বাকি কোড — তাহলে কোড বদলালে সব প্যাকেজ আবার ইনস্টল হবে না। ডিপ্লয়ের সঠিক ক্রম: আগে backward-compatible মাইগ্রেশন, তারপর কোড, তারপর config/route cache, তারপর queue worker রিস্টার্ট, তারপর PHP-FPM রিস্টার্ট। worker রিস্টার্ট না করলে পুরনো কোড চলতে থাকবে। পর্যবেক্ষণের সূত্র: লগ বলে কী ঘটেছে, মেট্রিক বলে কিছু ভুল হচ্ছে, ট্রেস বলে কোথায়। ব্যাকআপ পুনরুদ্ধার করে পরীক্ষা না করলে সেটি ব্যাকআপ নয়।", body:[
 {h:"Docker essentials"},
 {p:"An image is the built artifact; a container is a running instance. Layer caching is the thing to understand: copy composer.json and install dependencies before copying the rest of your code, so a code change doesn't reinstall every package. Multi-stage builds keep production images small by discarding build tooling."},
 {code:"FROM composer:2 AS vendor\nWORKDIR /app\nCOPY composer.json composer.lock ./\nRUN composer install --no-dev --no-scripts --optimize-autoloader\n\nFROM php:8.3-fpm-alpine\nWORKDIR /var/www\nCOPY --from=vendor /app/vendor ./vendor\nCOPY . .\nRUN docker-php-ext-install pdo_mysql opcache\nCMD [\"php-fpm\"]"},
 {h:"CI/CD pipeline stages"},
 {p:"Checkout, install dependencies with caching, static analysis and lint, run tests against a real database service container, build assets, deploy on main. Secrets live in repository or environment secrets, never in the repo. You used GitHub Actions at both Osilion and DevVoyage — describe your actual pipeline rather than a generic one."},
 {h:"Deploy order matters"},
 {list:["Run backward-compatible migrations first, so old code never meets a broken schema.",
 "Deploy the code.",
 "config:cache, route:cache, view:cache.",
 "Restart queue workers — otherwise they run the old code from memory.",
 "Restart PHP-FPM/Octane."]},
 {p:"Atomic releases via symlink switching (Deployer/Envoyer style) or container image tags give you a one-command rollback. Have a rollback plan before you deploy, not after."},
 {h:"Observability"},
 {p:"The line to remember: logs tell you what happened, metrics tell you something is wrong, traces tell you where. Structured JSON logs with correlation IDs, error tracking (Sentry), uptime checks, and alerts that page a human only for user-impacting problems — alert fatigue is a real failure mode."},
 {h:"Backups"},
 {p:"Automated, off-site, and — the part everyone skips — restore-tested. An untested backup is not a backup. If asked about disaster recovery, mention RPO and RTO: how much data can you lose, and how fast must you be back."}],
 docs:[{l:"Docker — Build best practices",u:"https://docs.docker.com/build/building/best-practices/"},{l:"GitHub Actions documentation",u:"https://docs.github.com/en/actions"},{l:"Laravel — Deployment",u:"https://laravel.com/docs/deployment"}],
 drill:"Dockerize your practice API with a multi-stage build. Write a GitHub Actions workflow that runs tests against a MySQL service container on every push." },

/* ================= .NET ================= */
{ id:"net-1", cat:".NET", t:"C#/.NET — keeping it alive without losing focus", min:9,
 bn:"C#/.NET সপ্তাহে দুটি ৪৫ মিনিটের সেশনেই যথেষ্ট — এটি আপনার প্রধান লক্ষ্য নয়। মূল বিষয়: LINQ-এ deferred execution (IQueryable SQL-এ রূপান্তরিত হয়, ToList() ডাকলে তখনই চলে — আগেই ToList() ডাকলে পুরো টেবিল মেমরিতে চলে আসে), async/await সবসময় শেষ পর্যন্ত async রাখা, আর DI lifetime — scoped DbContext কখনো singleton-এ ইনজেক্ট করবেন না। EF Core আসলে Doctrine-এর মতো Data Mapper, তাই আপনার কাছে পরিচিত লেগেছে। গভীরতা নিয়ে প্রশ্ন এলে সৎ উত্তর দিন: এক বছরের প্রোডাকশন অভিজ্ঞতা আছে, তবে আমার গভীরতম দক্ষতা এখনো PHP-তে — অতিরঞ্জন করবেন না, .NET ইন্টারভিউয়াররা দ্রুত ধরে ফেলেন।", body:[
 {p:"Two 45-minute sessions a week. Enough to stay interview-viable if a .NET-flavoured role appears, not enough to distract from your primary track. If a specific .NET interview lands, switch to daily focus for that week only."},
 {h:"Core C# they probe"},
 {p:"Value vs reference types. class vs struct vs record — records give value-based equality, immutability and with-expressions, which is why they're ideal for DTOs. Nullable reference types and what the compiler warnings actually mean. Pattern matching and switch expressions."},
 {h:"LINQ and deferred execution — the classic trap"},
 {code:"// IQueryable — translated to SQL, executed in the database\nvar q = db.Candidates.Where(c => c.Status == Status.Active);\n\n// Still nothing has run. This materializes it:\nvar list = await q.ToListAsync();\n\n// The bug: calling AsEnumerable() or ToList() too early pulls\n// the whole table into memory, then filters in C#.\nvar bad = db.Candidates.ToList().Where(c => c.Status == Status.Active);"},
 {h:"async/await"},
 {p:"Async all the way down. Never .Result or .Wait() — that deadlocks in some contexts and blocks a thread in all of them. Plumb CancellationToken through. Task.WhenAll for genuine parallelism. And the conceptual point: async means non-blocking, not multi-threaded."},
 {h:"ASP.NET Core DI lifetimes — and the classic bug"},
 {p:"Transient (new each resolution), Scoped (one per request), Singleton (one per application). The bug interviewers ask about: injecting a scoped DbContext into a singleton service, which captures one request's context forever and corrupts everything after. Map it to Laravel: bind ≈ transient, scoped ≈ scoped, singleton ≈ singleton — the Octane caveat you know is the same problem."},
 {h:"EF Core"},
 {p:"DbContext is a unit of work with change tracking. AsNoTracking() for read-only queries is a real performance win. Include/ThenInclude for eager loading — and the same N+1 trap as Eloquent. Migrations are generated from a model diff, unlike Laravel's hand-written migrations. DbContext is essentially Doctrine's EntityManager, which is why it felt familiar to you."},
 {h:"Your framing when asked how deep you are"},
 {p:"'I've spent the last year building production .NET services — the AI recruitment platform's backend is mine end to end, with EF Core, Azure SQL and a layered DDD structure. My deepest ecosystem is still PHP with ten years behind it, so I'd describe myself as solidly productive in .NET rather than an expert in its internals. What transferred instantly was the architecture: DI, middleware, ORMs, migrations and API design are the same problems in different syntax.'"},
 {tip:"Never inflate here. .NET interviewers probe internals fast, and an honest boundary respected is far better than a bluff exposed."}],
 docs:[{l:"Microsoft — C# documentation",u:"https://learn.microsoft.com/en-us/dotnet/csharp/"},{l:"ASP.NET Core — Dependency injection",u:"https://learn.microsoft.com/en-us/aspnet/core/fundamentals/dependency-injection"},{l:"EF Core documentation",u:"https://learn.microsoft.com/en-us/ef/core/"}],
 drill:"Build one ASP.NET Core endpoint with an EF Core model and a migration. Write it without AI — the point is to prove to yourself you can." },

/* ================= INTERVIEW CRAFT ================= */
{ id:"iv-1", cat:"Interview craft", t:"How to walk through a system in six minutes", min:7,
 bn:"সিনিয়র লেভেলে সবচেয়ে বেশি জিজ্ঞেস করা হয় — আপনার বানানো কোনো সিস্টেম বর্ণনা করুন। এখানে আপনার বড় সুবিধা, কারণ আপনার পাঁচটি বাস্তব সিস্টেম আছে যেখানে অন্যদের থাকে শুধু টিউটোরিয়াল প্রজেক্ট। প্রতিবার একই ক্রমে বলুন: সমস্যা কী ছিল (ব্যবসায়িক ভাষায়), কাঠামো কেমন (৪-৬টি বক্স এঁকে দেখান), ডেটা মডেল, একটি কঠিন সিদ্ধান্ত ও কেন, একটি ব্যর্থতা ও কীভাবে ঠিক করলেন, আর এখন হলে কী ভিন্নভাবে করতেন। ইন্টারভিউয়ার শুনতে চান আপনি সিস্টেমের মালিক ছিলেন নাকি শুধু যাত্রী — তাই প্রতিটি বাক্যে সিদ্ধান্ত ও ট্রেড-অফ থাকা চাই।", body:[
 {p:"At senior full-stack level you're rarely asked to design Twitter. You're asked 'walk me through something you built' — and this is your highest-leverage prep, because you have five real production systems while most candidates have toy projects."},
 {h:"The template — same order every time"},
 {list:["Problem — who had what pain, in one sentence. Business first, not technology.",
 "Shape — the four to six boxes: client, API, database, workers, external services. Draw it, don't just describe it.",
 "Data model — the five core tables and how they relate.",
 "One hard decision — what you chose, what you rejected, and why.",
 "One failure — what broke in production, how you found it, how you fixed it.",
 "What you'd do differently — seniors always have an answer here. Not having one signals you haven't reflected."]},
 {h:"Prepare all five"},
 {list:["AI Recruitment Platform — DDD layering, Repository/Specification, CV processing and AI interview flow, JWT auth, Azure deployment.",
 "Lead-Generation Platform — ingestion pipeline, bulk email delivery, rate limits and deliverability, why Supabase and Render.",
 "CoreBari — multi-tenancy, SSO across the suite, offline-first sync, the shared Party/Payment/SMS spine, bKash/Nagad integration.",
 "Travel/Booking (Symfony) — booking workflow, availability and pricing, payment integration, the inventory race condition.",
 "Multi-Vendor Marketplace — vendor model, commission and payout logic, payment flows."]},
 {h:"What interviewers are actually listening for"},
 {p:"Whether you sound like the owner of the system or a passenger on it. Ownership sounds like: 'I chose X because Y, and the cost was Z.' Passenger sounds like: 'We used X.' Every sentence should carry a decision, a trade-off, or a consequence."},
 {tip:"Practice each walkthrough into a recorder until it's six minutes without hesitation. This single exercise is worth more than fifty flashcards."}],
 docs:[{l:"System Design Primer (GitHub)",u:"https://github.com/donnemartin/system-design-primer"}],
 drill:"Pick one system. Draw it on paper in under two minutes, then narrate for six. Listen back and count how many sentences contained a decision rather than a description." },

{ id:"iv-2", cat:"Interview craft", t:"The rules that win interviews", min:6,
 bn:"কিছু নিয়ম যা ইন্টারভিউ জেতায়। এক: কখনো ভান করবেন না — না জানা জিনিস নিয়ে বানিয়ে বললে ধরা পড়লে সব সত্যি উত্তরও সন্দেহের মধ্যে পড়ে যায়। বলুন: এটি ব্যবহার করিনি, তবে এর কাছাকাছি X ব্যবহার করেছি, সেই অভিজ্ঞতা থেকে মনে হয় এভাবে কাজ করবে। দুই: ৯০ সেকেন্ডের মধ্যে উত্তর শেষ করুন — লম্বা উত্তর দুর্বলতা মনে হয়। তিন: প্রতিটি উত্তরে নিজের বানানো সিস্টেমের উদাহরণ যোগ করুন। চার: কোড লেখার সময় জোরে চিন্তা করুন, চুপ থাকলে মনে হয় আটকে গেছেন। পাঁচ: তাদের জন্য তিনটি প্রশ্ন প্রস্তুত রাখুন।", body:[
 {h:"Never bluff — the only unrecoverable mistake"},
 {p:"Interviewers are testing reasoning, not recall. 'I haven't used that. Based on [closest thing you have used] I'd expect it to work like [reasoning], and here's how I'd verify' is a genuinely strong answer. A bluff that gets caught poisons everything else you said, including the true parts."},
 {h:"Answer in under 90 seconds"},
 {p:"Long answers dilute good content and read as uncertainty. Answer the question, give one concrete example, stop. If they want more they'll ask — and them asking a follow-up is a good sign, not a failure."},
 {h:"Always bring it back to something you built"},
 {p:"Abstract answers are forgettable. 'At CoreBari I hit exactly this with offline sync' is memorable and simultaneously proves the experience. Every technical answer should have a real system attached where possible."},
 {h:"Think out loud during coding"},
 {p:"Silence reads as stuck. Narrate: 'I'll start with the data shape, then the happy path, then edge cases.' Restate the problem, ask about inputs and constraints, write the simple version first, test it aloud with an example, then discuss complexity. If you're stuck, say what you're stuck on and what you'd try — how you get unstuck is part of the evaluation."},
 {h:"Correct yourself out loud"},
 {p:"Realizing mid-answer that you said something wrong and saying so is a senior signal, not a weakness. 'Actually, let me correct that —' scores better than hoping nobody noticed."},
 {h:"Have three questions ready"},
 {p:"'No, I'm good' reads as disinterest. Ask how technical decisions get made, where the biggest technical debt is, and what success looks like in the first 90 days. Never open with salary or holidays."},
 {tip:"After every real interview, write down every question you were asked within the hour. Real questions from your actual market are better study material than any question bank, including this one."}],
 docs:[{l:"Anthropic Claude docs (for API-based practice)",u:"https://docs.claude.com/"}],
 drill:"Run a mock in the Mock tab. Type 'score me' at the end and act on all three of its recommendations before the next one." },
/* ================= WEB FUNDAMENTALS ================= */
{ id:"web-1", cat:"Web fundamentals", t:"HTTP, CORS, cookies and caching headers", min:9,
 bn:"HTTP হলো সব ওয়েব ইন্টারভিউয়ের ভিত্তি, আর বেশিরভাগ ডেভেলপার এখানেই আটকে যায় কারণ প্রতিদিন ব্যবহার করলেও কখনো ভালোভাবে পড়া হয় না। মূল বিষয়গুলো হলো: কোন স্ট্যাটাস কোড কখন ব্যবহার করবেন (৪০১ মানে আপনি কে জানি না, ৪০৩ মানে জানি কিন্তু অনুমতি নেই), CORS আসলে ব্রাউজারের নিরাপত্তা ব্যবস্থা — সার্ভারের নয়, তাই CORS এরর মানে আপনার API নিরাপদ নয় এমন নয়। কুকির ক্ষেত্রে httpOnly, secure এবং sameSite — এই তিনটি ফ্ল্যাগ জানা বাধ্যতামূলক, কারণ localStorage-এ টোকেন রাখলে XSS দিয়ে সহজেই চুরি হয়। ক্যাশিং হেডার (ETag, Cache-Control) দিয়ে ব্যান্ডউইথ ও রেসপন্স টাইম দুটোই বাঁচানো যায়।",
 body:[
 {p:"You use HTTP every day but probably never studied it properly — most developers haven't, which is exactly why interviewers ask. These questions separate people who understand the web from people who call fetch()."},
 {h:"Status codes that matter"},
 {list:["200 OK, 201 Created (return the resource), 204 No Content (successful delete).",
 "400 vs 422 — malformed request vs well-formed but failed validation. Laravel returns 422 for validation.",
 "401 vs 403 — 'I don't know who you are' vs 'I know who you are and you may not'. Mixing these up is a classic tell.",
 "404 — also correct for objects the user isn't allowed to know exist (avoids leaking existence).",
 "409 Conflict — concurrent edit or duplicate. 429 Too Many Requests with Retry-After.",
 "500 vs 502 vs 504 — your code failed, upstream gave a bad response, upstream timed out."]},
 {h:"CORS — what it actually is"},
 {p:"CORS is a browser restriction, not a server security feature. The browser blocks a page on origin A from reading a response from origin B unless B says it's allowed. It does not protect your API — anyone can call it with curl. So a CORS error never means your API is secure; it means your browser refused to hand the response to your JavaScript."},
 {p:"Preflight: for non-simple requests the browser first sends OPTIONS. If your API rejects OPTIONS, everything breaks. And Access-Control-Allow-Origin: * cannot be combined with credentials — a very common misconfiguration."},
 {h:"Cookies — the three flags"},
 {list:["httpOnly — JavaScript cannot read it, so XSS can't steal the session. This is why cookies beat localStorage for tokens.",
 "secure — only sent over HTTPS.",
 "sameSite — Lax/Strict blocks the cross-site request that makes CSRF possible; None requires secure."]},
 {h:"Caching headers"},
 {p:"Cache-Control (max-age, no-store, private vs public), ETag with If-None-Match returning 304 Not Modified, and Last-Modified. For a dashboard: no-store. For hashed asset files: max-age=31536000, immutable. Being able to say which and why is a small answer that reads as very senior."},
 {tip:"If asked 'is your API secure because of CORS?' — the correct answer is no, and explaining why in one sentence will impress more than most of your other answers."}],
 docs:[{l:"MDN — HTTP overview",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP"},{l:"MDN — CORS",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/CORS"},{l:"MDN — HTTP caching",u:"https://developer.mozilla.org/en-US/docs/Web/HTTP/Caching"}],
 drill:"Open devtools on your own app. Read the request and response headers for one API call and one asset. Explain every header you see out loud." },

{ id:"web-2", cat:"Web fundamentals", t:"Frontend performance and Core Web Vitals", min:7,
 bn:"পারফরম্যান্স প্রশ্ন প্রায় প্রতিটি ফ্রন্টএন্ড ইন্টারভিউতে আসে। তিনটি Core Web Vitals মনে রাখুন: LCP (সবচেয়ে বড় কনটেন্ট কত দ্রুত দেখা যায়), INP (ক্লিকের পর কত দ্রুত সাড়া দেয়), আর CLS (লেআউট কতটা লাফায়)। বাস্তব সমাধানগুলো হলো — ছবি অপটিমাইজ করা ও width/height দেওয়া, JavaScript বান্ডেল ছোট রাখা ও কোড স্প্লিটিং, ফন্ট প্রিলোড করা, আর সার্ভার-সাইড রেন্ডারিং। সবচেয়ে গুরুত্বপূর্ণ উত্তর: আগে মাপুন, তারপর ঠিক করুন — অনুমান করে অপটিমাইজ করা শুরু করবেন না।",
 body:[
 {h:"The three vitals"},
 {list:["LCP (Largest Contentful Paint) — how fast the main content appears. Target under 2.5s. Usually fixed by image optimization, server response time, and removing render-blocking resources.",
 "INP (Interaction to Next Paint) — how fast the page responds to a click. Replaced FID. Usually fixed by breaking up long JavaScript tasks.",
 "CLS (Cumulative Layout Shift) — how much the layout jumps. Fixed by setting width/height on images, reserving space for ads and dynamic content."]},
 {h:"The fixes that actually move numbers"},
 {list:["Images: modern formats (WebP/AVIF), correct sizing, lazy loading below the fold, explicit dimensions.",
 "JavaScript: code splitting, dynamic imports, tree shaking, and shipping less of it — server components exist for exactly this.",
 "Fonts: preload, font-display: swap, subset to the characters you need.",
 "Rendering: SSR or static generation so the user sees content before hydration finishes.",
 "Network: CDN, HTTP/2 or 3, compression (brotli), and caching headers."]},
 {h:"The answer structure"},
 {p:"Measure first — Lighthouse, WebPageTest, or real-user monitoring. Identify which vital is failing. Fix the biggest contributor. Re-measure. Saying 'I'd start by measuring rather than guessing' is worth as much as the technical detail that follows it."},
 {tip:"Have one real example: at CoreBari, offline-first PWA and local-first writes mean the UI responds instantly regardless of network — that's a performance architecture decision, not a micro-optimization, and it's a strong thing to say."}],
 docs:[{l:"web.dev — Core Web Vitals",u:"https://web.dev/articles/vitals"},{l:"Lighthouse documentation",u:"https://developer.chrome.com/docs/lighthouse/overview"}],
 drill:"Run Lighthouse on corebari.com. Pick the worst-scoring metric, fix one thing, re-run, and note the delta. That before/after is an interview story." },

{ id:"web-3", cat:"Web fundamentals", t:"CSS, responsive design and accessibility basics", min:7,
 bn:"সিনিয়র ফুলস্ট্যাক রোলে CSS নিয়ে গভীর প্রশ্ন কম আসে, কিন্তু একেবারে না জানলে সমস্যা। Flexbox এক-মাত্রিক লেআউটের জন্য, Grid দ্বি-মাত্রিক লেআউটের জন্য — এই পার্থক্যটা জানুন। মোবাইল-ফার্স্ট মানে ছোট স্ক্রিন দিয়ে শুরু করে min-width মিডিয়া কোয়েরি দিয়ে বড় করা। অ্যাক্সেসিবিলিটি (a11y) এখন অনেক কোম্পানির বাধ্যতামূলক শর্ত: সঠিক HTML ট্যাগ ব্যবহার, সব ইনপুটে লেবেল, কীবোর্ড দিয়ে নেভিগেট করা যায় কিনা, পর্যাপ্ত কালার কনট্রাস্ট, আর ছবিতে alt টেক্সট। এগুলো ছোট বিষয় মনে হলেও ইন্টারভিউতে পেশাদারিত্বের সংকেত দেয়।",
 body:[
 {h:"Layout"},
 {p:"Flexbox for one-dimensional layouts (a row or a column). Grid for two-dimensional layouts (rows and columns together). Knowing when to reach for each is the entire question. Also know: box-sizing: border-box, the stacking context (why z-index sometimes 'doesn't work'), and position: sticky."},
 {h:"Responsive"},
 {p:"Mobile-first: write the small-screen styles, then add min-width media queries. Use relative units (rem, %, vw) over fixed pixels. Container queries are the modern addition — components respond to their container rather than the viewport."},
 {h:"Accessibility — increasingly a hiring requirement"},
 {list:["Semantic HTML first: button for buttons, not a div with onClick. This alone fixes most keyboard and screen-reader problems.",
 "Every input needs a label. Every image needs alt text (empty alt for decorative images).",
 "Keyboard navigation must work: tab order, visible focus states, escape closes modals, focus trapped inside them.",
 "Colour contrast at least 4.5:1 for body text.",
 "ARIA only when semantic HTML can't express it — bad ARIA is worse than none."]},
 {h:"Tailwind, since you use it"},
 {p:"Be ready for 'why utility classes?' The answer: styles co-located with markup, no naming overhead, no dead CSS, and a constrained design system by default. The trade-off: verbose markup, and you extract components rather than classes when patterns repeat."},
 {tip:"If a frontend interviewer asks about accessibility and you can name semantic HTML, labels, keyboard traps and contrast, you'll be ahead of most backend-leaning candidates."}],
 docs:[{l:"MDN — CSS layout",u:"https://developer.mozilla.org/en-US/docs/Learn/CSS/CSS_layout"},{l:"WAI — Accessibility fundamentals",u:"https://www.w3.org/WAI/fundamentals/"},{l:"Tailwind CSS docs",u:"https://tailwindcss.com/docs/utility-first"}],
 drill:"Take one page of CoreBari and navigate it entirely with the keyboard. Every place you get stuck is an accessibility bug and a fixable interview talking point." },

/* ================= CS FUNDAMENTALS ================= */
{ id:"cs-1", cat:"CS fundamentals", t:"Big-O and the data structures you actually need", min:9,
 bn:"সিনিয়র ফুলস্ট্যাক ইন্টারভিউতে খুব কঠিন অ্যালগরিদম সাধারণত আসে না, কিন্তু কমপ্লেক্সিটি বোঝা লাগে। Big-O মানে ইনপুট বড় হলে সময় বা মেমরি কীভাবে বাড়ে। হ্যাশ ম্যাপে লুকআপ O(1), অ্যারেতে খোঁজা O(n), সর্টেড ডেটায় বাইনারি সার্চ O(log n), নেস্টেড লুপ O(n²)। বাস্তব কাজে সবচেয়ে বেশি দরকার হয় হ্যাশ ম্যাপ — কারণ বেশিরভাগ ইন্টারভিউ প্রশ্নের সমাধান হলো নেস্টেড লুপকে হ্যাশ ম্যাপ দিয়ে O(n)-এ নামিয়ে আনা। মনে রাখবেন: ডেটা ডেটাবেজে থাকলে সঠিক উত্তর প্রায়ই SQL — এটা বলাটাই সিনিয়র সিগন্যাল।",
 body:[
 {h:"Big-O, practically"},
 {p:"It describes how time or memory grows as input grows — not actual speed. The ones you need: O(1) hash lookup, O(log n) binary search on sorted data, O(n) single pass, O(n log n) sorting, O(n²) nested loops. If you can say 'this is O(n²) because of the nested loop, and a hash map makes it O(n)', you've answered most complexity questions in interviews at your level."},
 {h:"The structures that actually come up"},
 {list:["Hash map / associative array — O(1) average lookup. The answer to most interview problems: replace a nested loop with a map.",
 "Array / list — O(1) index access, O(n) search, O(n) insert at the front.",
 "Set — deduplication and membership tests in O(1).",
 "Stack — LIFO. Bracket matching, undo, DFS.",
 "Queue — FIFO. Job processing, BFS.",
 "Tree — hierarchical data, and the structure behind database indexes (B-tree).",
 "Graph — relationships and dependencies; BFS/DFS traversal."]},
 {h:"The senior move"},
 {p:"When given a data-shaped problem, say what you'd actually do in production: 'In an interview I'd write this in PHP with a hash map, but if this data lives in the database I'd do it in SQL with a GROUP BY, because moving 100k rows into application memory to aggregate them is the real performance bug.' That answer beats a clever algorithm."},
 {h:"How much to practice"},
 {p:"Thirty minutes a day, easy to medium only. Senior full-stack loops rarely go beyond this level — they care more about whether you can build a maintainable API than whether you can solve a dynamic programming puzzle."}],
 docs:[{l:"Big-O cheat sheet",u:"https://www.bigocheatsheet.com/"},{l:"MDN — Map and Set",u:"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Reference/Global_Objects/Map"}],
 drill:"Take the Code tab problems. For each one, say the time and space complexity out loud before you look at the answer." },

{ id:"cs-2", cat:"CS fundamentals", t:"The five algorithm patterns that cover most questions", min:8,
 bn:"বেশিরভাগ ইন্টারভিউ প্রশ্ন আসলে পাঁচটি প্যাটার্নের ভেতরেই পড়ে, তাই প্রতিটি প্রশ্ন আলাদা করে মুখস্থ করার দরকার নেই। এক: হ্যাশ ম্যাপ দিয়ে লুকআপ (two-sum, ডুপ্লিকেট খোঁজা)। দুই: টু-পয়েন্টার (সর্টেড অ্যারে, প্যালিনড্রোম)। তিন: স্লাইডিং উইন্ডো (সাবস্ট্রিং বা সাবঅ্যারের সমস্যা)। চার: সর্ট করে তারপর প্রসেস (ইন্টারভাল মার্জ করা)। পাঁচ: রিকার্শন বা স্ট্যাক (নেস্টেড স্ট্রাকচার, ট্রি)। কোনো প্রশ্ন পেলে প্রথমে ভাবুন এটা কোন প্যাটার্নের — তাহলে সমাধান অনেক সহজ হয়ে যায়।",
 body:[
 {p:"You don't need to memorize hundreds of problems. Almost everything at your level reduces to five patterns. Learn to recognize which one applies and the solution follows."},
 {h:"1. Hash map lookup"},
 {p:"Signal: 'find a pair', 'have I seen this before', 'count occurrences'. Turns O(n²) into O(n). Covers two-sum, duplicate detection, anagram grouping, first non-repeating character, frequency counts."},
 {h:"2. Two pointers"},
 {p:"Signal: sorted array, palindrome, 'pair that sums to X', removing duplicates in place. One pointer from each end, or fast/slow pointers for cycle detection in linked lists."},
 {h:"3. Sliding window"},
 {p:"Signal: 'longest/shortest substring or subarray with some property'. Expand the right edge, shrink the left edge when the constraint breaks. Covers longest substring without repeats, max sum subarray of size k."},
 {code:"// Sliding window skeleton — learn this shape\nlet start = 0, best = 0;\nconst seen = new Map();\nfor (let end = 0; end < s.length; end++) {\n  const ch = s[end];\n  if (seen.has(ch) && seen.get(ch) >= start) {\n    start = seen.get(ch) + 1;   // shrink\n  }\n  seen.set(ch, end);\n  best = Math.max(best, end - start + 1);\n}"},
 {h:"4. Sort, then scan"},
 {p:"Signal: intervals, scheduling, 'merge overlapping', 'minimum rooms needed'. Sorting first usually makes the problem linear afterwards. This is the booking-conflict problem in disguise — mention that connection, it's real experience."},
 {h:"5. Recursion or an explicit stack"},
 {p:"Signal: nested structures, trees, flatten, deep clone, directory traversal. Always define the base case first, then the recursive step. If recursion depth is a concern, convert to an explicit stack."},
 {tip:"In the interview, say the pattern out loud before coding: 'This looks like a sliding window problem because we need the longest substring satisfying a constraint.' That sentence alone often earns most of the marks."}],
 docs:[{l:"System Design Primer — algorithms section",u:"https://github.com/donnemartin/system-design-primer"},{l:"MDN — Recursion",u:"https://developer.mozilla.org/en-US/docs/Glossary/Recursion"}],
 drill:"Take the 18 problems in the Code tab. Before solving each, name which of the five patterns applies. You'll find every one fits." },

/* ================= TOOLING & PROCESS ================= */
{ id:"proc-1", cat:"Process & tools", t:"Git, branching and code review", min:7,
 bn:"Git নিয়ে প্রশ্ন প্রায় সব ইন্টারভিউতে আসে, বিশেষ করে টিমে কাজ করার প্রসঙ্গে। merge vs rebase পার্থক্য জানুন: merge ইতিহাস অক্ষত রাখে, rebase ইতিহাস সোজা করে কিন্তু শেয়ার করা ব্রাঞ্চে কখনো rebase করবেন না। কাজে লাগে এমন কমান্ড: git stash, git cherry-pick, git revert (পাবলিক ব্রাঞ্চে reset নয়), আর git bisect দিয়ে কোন কমিটে বাগ ঢুকেছে তা খুঁজে বের করা। কোড রিভিউতে ভালো আচরণ হলো — ছোট PR পাঠানো, কেন পরিবর্তন করলেন তা লেখা, আর রিভিউয়ার হিসেবে ব্যক্তিকে নয় কোডকে মন্তব্য করা।",
 body:[
 {h:"The commands beyond add/commit/push"},
 {list:["git stash — park uncommitted work to switch context fast.",
 "git rebase -i — squash and clean up commits before opening a PR.",
 "git cherry-pick — take one commit to another branch (hotfix backports).",
 "git revert — undo a commit safely on a shared branch. Never git reset --hard on anything pushed.",
 "git bisect — binary search through history to find which commit introduced a bug. Mentioning this marks you as experienced.",
 "git blame / log -S — find when and why a line changed."]},
 {h:"Merge vs rebase"},
 {p:"Merge preserves true history and creates a merge commit. Rebase rewrites your commits on top of the target branch for a linear history. The rule: rebase your own local branch, never rebase a branch others have pulled — you'd rewrite history they already have."},
 {h:"Branching strategies"},
 {p:"Trunk-based with short-lived feature branches and feature flags is the modern default and pairs well with CI/CD. GitFlow is heavier and suits versioned releases. Know both and, more importantly, know the trade-off: long-lived branches mean painful merges."},
 {h:"Code review — they will ask"},
 {p:"As an author: small PRs, a description explaining why not just what, self-review before requesting, and tests included. As a reviewer: comment on the code not the person, distinguish blocking issues from suggestions (prefix nits as nits), and approve when it's better than what's there rather than perfect. You mentored juniors at DevVoyage and L2N — this is your story material."},
 {tip:"A good answer to 'how do you handle a disagreement in code review': escalate to a synchronous conversation quickly, because a long comment thread means the disagreement is bigger than the code."}],
 docs:[{l:"Pro Git book (free)",u:"https://git-scm.com/book/en/v2"},{l:"GitHub — About pull requests",u:"https://docs.github.com/en/pull-requests"}],
 drill:"Practice git bisect on a repo: introduce a bug in an old commit, then find it with bisect. Also rebase-squash a messy branch into three clean commits." },

{ id:"proc-2", cat:"Process & tools", t:"Linux, the CLI, and running things on servers", min:7,
 bn:"রিমোট ব্যাকএন্ড রোলে Linux জানা ধরে নেওয়া হয়। যেসব কমান্ড আসলেই লাগে: লগ দেখার জন্য tail -f ও grep, প্রসেস দেখার জন্য ps ও top, ডিস্ক দেখার জন্য df -h ও du, পোর্ট দেখার জন্য ss বা netstat, আর ফাইল পারমিশনের জন্য chmod ও chown। সার্ভিস চালু রাখার জন্য systemd বা supervisor ব্যবহার করা হয় — Laravel queue worker সাধারণত supervisor দিয়ে চালানো হয়। ইন্টারভিউতে সবচেয়ে বেশি জিজ্ঞেস করা হয়: সার্ভার ধীর হয়ে গেলে আপনি কীভাবে খুঁজে বের করবেন সমস্যা কোথায় — উত্তর হলো ধাপে ধাপে: CPU, মেমরি, ডিস্ক, নেটওয়ার্ক, তারপর অ্যাপ্লিকেশন লগ।",
 body:[
 {h:"The commands you'll actually be asked about"},
 {list:["tail -f /var/log/... and grep — reading logs live. Combine: tail -f app.log | grep ERROR",
 "ps aux, top/htop — what's running and what's eating CPU.",
 "df -h and du -sh * — disk space. 'Disk full' is a shockingly common production incident.",
 "ss -tlnp / netstat — what's listening on which port.",
 "chmod / chown — permissions. In PHP deployments, storage and cache directories being unwritable is the classic bug.",
 "systemctl status/restart — managing services.",
 "curl -I and dig — debugging connectivity and DNS from the server itself."]},
 {h:"Keeping processes alive"},
 {p:"Queue workers and long-running processes need supervision: supervisor or systemd restarts them if they die and starts them on boot. This is the missing piece when someone says 'my queue stopped working overnight'."},
 {h:"'The server is slow — what do you check?'"},
 {p:"Work outward in layers: CPU (top), memory and swap (free -h — swapping is a silent killer), disk space and I/O, network, then database (slow query log, connection count), then application logs. Say the order out loud; the structure is the answer."},
 {h:"Environments and secrets"},
 {p:"Environment variables rather than committed config, secrets in a manager (Azure Key Vault in your case), file permissions locked down, SSH keys not passwords, and no root logins. Basic, but interviewers do check."}],
 docs:[{l:"Linux Journey (free course)",u:"https://linuxjourney.com/"},{l:"Laravel — Queue supervisor configuration",u:"https://laravel.com/docs/queues#supervisor-configuration"}],
 drill:"SSH into any server (or a local Docker container). Find the largest files on disk, watch a log live, check what's listening on port 80, and restart a service." },

{ id:"proc-3", cat:"Process & tools", t:"Debugging methodology — the skill they test hardest", min:8,
 bn:"ডিবাগিং হলো সেই দক্ষতা যা দিয়ে সিনিয়র আর জুনিয়র আলাদা হয়। এলোমেলোভাবে চেষ্টা না করে একটি পদ্ধতি অনুসরণ করুন: প্রথমে বাগটি নির্ভরযোগ্যভাবে পুনরায় ঘটান, তারপর সমস্যাটি ছোট করে আনুন, একটি অনুমান দাঁড় করান, সেই অনুমান পরীক্ষা করার জন্য একটি জিনিস পরিবর্তন করুন, তারপর ঠিক করুন এবং একটি টেস্ট লিখুন যাতে বাগটি আর ফিরে না আসে। ইন্টারভিউতে যখন জিজ্ঞেস করে সবচেয়ে কঠিন বাগ কোনটি ছিল, তারা আসলে দেখতে চায় আপনার চিন্তার পদ্ধতি — সমাধানটা নয়। তাই গল্পটা এভাবে বলুন: লক্ষণ, সন্দেহ, কীভাবে সংকুচিত করলেন, আসল কারণ, সমাধান, এবং প্রতিরোধ।",
 body:[
 {p:"'Tell me about the hardest bug you debugged' is asked in almost every senior interview. They are not testing the bug — they're testing whether you have a method or just try things."},
 {h:"The method"},
 {list:["Reproduce reliably. A bug you can't reproduce, you can't verify you fixed. This step is where most time should go.",
 "Minimize. Strip away everything until you have the smallest case that still fails.",
 "Hypothesize. State what you think is wrong, specifically enough to be provable false.",
 "Instrument. Add logging, use a debugger (Xdebug), check the actual query with EXPLAIN, inspect the network tab. Look at data, don't guess.",
 "Change one thing. Changing three things means you learn nothing from the result.",
 "Fix, then write a regression test that fails without the fix.",
 "Ask why it wasn't caught. That answer usually improves the system more than the fix does."]},
 {h:"Tools by layer"},
 {p:"Backend: Xdebug step debugging, Telescope/Debugbar, query logs, dd/dump, structured logging with correlation IDs. Frontend: devtools breakpoints, network tab, React/Vue devtools for component state. Production: error tracking (Sentry), APM traces, log aggregation."},
 {h:"The bugs that are genuinely hard"},
 {p:"Race conditions and concurrency, timezone and daylight-saving issues, floating-point money arithmetic, character encoding, cache staleness, and 'works on my machine' environment differences. Having a story from any of these categories is better than a simple null-pointer story."},
 {tip:"Structure your answer as: symptom → what I suspected and why → how I narrowed it → root cause → fix → what I added so it can't recur. That last part is what makes you sound senior."}],
 docs:[{l:"Xdebug documentation",u:"https://xdebug.org/docs/"},{l:"Chrome DevTools documentation",u:"https://developer.chrome.com/docs/devtools/"}],
 drill:"Write your hardest-bug story in full, following the six-step structure. Read it aloud. If any step is vague, that's the part an interviewer will push on." },

{ id:"proc-4", cat:"Process & tools", t:"Legacy code, refactoring and technical debt", min:7,
 bn:"আপনার L2N ও DevVoyage-এর অভিজ্ঞতায় প্রচুর লিগ্যাসি কোড আধুনিকীকরণের কাজ আছে — এটি একটি শক্তিশালী দিক, কারণ বেশিরভাগ কোম্পানির কোডবেসই পুরনো। মূল নীতি: টেস্ট ছাড়া রিফ্যাক্টর করবেন না, তাই আগে ক্যারেক্টারাইজেশন টেস্ট লিখুন যা বর্তমান আচরণ ধরে রাখে। বড় পুনর্লিখনের বদলে ধাপে ধাপে পরিবর্তন করুন (স্ট্র্যাংলার প্যাটার্ন) — পুরনো কোডের পাশে নতুন কোড লিখে ধীরে ধীরে ট্রাফিক সরান। টেকনিক্যাল ডেট নিয়ে কথা বলার সময় ব্যবসায়িক ভাষায় বলুন: এই ঋণের কারণে ফিচার ডেলিভারি কত ধীর হচ্ছে।",
 body:[
 {p:"Most companies are hiring you to work on existing code, not greenfield. Your L2N and DevVoyage legacy modernization work is directly relevant — make sure you can talk about it."},
 {h:"The rules of safe refactoring"},
 {list:["Never refactor without tests. If there are none, write characterization tests first — tests that capture current behaviour, bugs included, so you know when you change it.",
 "Change behaviour or change structure — never both in the same commit.",
 "Small steps, always green. A refactor that leaves the app broken for three days isn't a refactor, it's a rewrite with extra steps.",
 "Strangler pattern — build the new path alongside the old, route a slice of traffic to it, expand gradually, then delete the old. This is how you replace a system without a big-bang cutover."]},
 {h:"Where to start in an unfamiliar codebase"},
 {p:"Follow one real request end to end — route, controller, service, database, response. Read the migrations to learn the data model, which tells you more about the domain than the code does. Find the tests. Then make one tiny change and deploy it, to learn the deployment pipeline before you need it urgently."},
 {h:"Talking about technical debt"},
 {p:"Frame it in business terms: 'this coupling means every pricing change takes three days instead of three hours'. Engineers who can translate debt into delivery cost get their refactors approved; engineers who say 'the code is ugly' don't. This is a genuinely senior distinction and worth saying explicitly in an interview."},
 {tip:"Great answer to 'what would you do in your first month?': read the code, ship something small early, and don't propose a rewrite until I understand why it's the way it is."}],
 docs:[{l:"Martin Fowler — Refactoring catalog",u:"https://refactoring.com/catalog/"},{l:"Martin Fowler — Strangler Fig application",u:"https://martinfowler.com/bliki/StranglerFigApplication.html"}],
 drill:"Take an old project. Pick the worst file. Write characterization tests for it, then refactor in small green steps. Time-box it to 90 minutes." },

/* ================= AI ENGINEERING ================= */
{ id:"ai-1", cat:"AI engineering", t:"Building with LLMs — your Osilion differentiator", min:10,
 bn:"আপনি একটি AI রিক্রুটমেন্ট প্ল্যাটফর্ম বানিয়েছেন, তাই এই বিষয়ে প্রশ্ন আসবেই — এবং এটি ২০২৬ সালে একটি বড় সুবিধা কারণ বেশিরভাগ প্রার্থীর এই অভিজ্ঞতা নেই। মূল ধারণাগুলো: প্রম্পট ইঞ্জিনিয়ারিং (স্পষ্ট নির্দেশনা, উদাহরণ, স্ট্রাকচার্ড আউটপুট), RAG (নিজের ডেটা এম্বেডিং করে ভেক্টর ডেটাবেজে রেখে প্রাসঙ্গিক অংশ প্রম্পটে যোগ করা), টোকেন ও কনটেক্সট উইন্ডোর সীমা, খরচ নিয়ন্ত্রণ, এবং সবচেয়ে গুরুত্বপূর্ণ — নির্ভরযোগ্যতা। LLM অনির্ভরযোগ্য, তাই আউটপুট যাচাই করা, রিট্রাই করা, এবং ব্যর্থ হলে কী হবে তা ঠিক করাই আসল ইঞ্জিনিয়ারিং কাজ।",
 body:[
 {p:"You built an AI recruitment platform with CV processing, AI interviews and candidate scoring. In 2026 this is a genuine differentiator — most senior full-stack candidates have never shipped an LLM feature. Be ready to go deep."},
 {h:"The core concepts"},
 {list:["Tokens and context windows — text is chunked into tokens; both cost and limits are measured in them. Long documents must be chunked or summarized.",
 "Prompt engineering — clear instructions, examples (few-shot), explicit output format, and a system prompt that sets the role and constraints.",
 "Structured output — ask for JSON and validate it, or use the provider's structured output/tool-calling feature. Never trust free text you have to parse with regex.",
 "Embeddings and vector search — text converted to vectors so you can find semantically similar content. This is how CV matching works.",
 "RAG (retrieval-augmented generation) — retrieve relevant context from your own data, put it in the prompt, so the model answers from your documents rather than its training.",
 "Temperature — higher for creative, near zero for extraction and classification tasks like scoring."]},
 {h:"The engineering problems, which is what interviewers actually want"},
 {list:["Non-determinism — the same input can produce different output. Test with tolerance, not exact matching.",
 "Hallucination — models state false things confidently. Ground responses in retrieved data, and validate anything factual.",
 "Latency — LLM calls take seconds. Queue them, stream responses, and never block a request on one.",
 "Cost control — token accounting per request, caching identical prompts, using smaller models where they suffice.",
 "Rate limits and failures — retries with backoff, and a defined fallback when the provider is down.",
 "Prompt injection — user content in a prompt can hijack instructions. Never let model output trigger privileged actions without validation.",
 "Evaluation — how do you know a prompt change made things better? A test set with expected outcomes."]},
 {h:"How to talk about your platform"},
 {p:"Structure it: the recruitment problem, the pipeline (CV upload → parse → chunk → embed → store → retrieve at interview time), the AI interview flow with its prompt and scoring rubric, and the engineering safeguards — queuing, validation, retries, cost. Emphasize that the hard part wasn't calling the API; it was making an unreliable component behave predictably inside a production system. That sentence is the whole interview."},
 {tip:"This also gives you the strongest possible version of the 'how do you use AI' answer: you don't just use AI tools, you've built AI products and understand their failure modes."}],
 docs:[{l:"Anthropic — Prompt engineering guide",u:"https://docs.claude.com/en/docs/build-with-claude/prompt-engineering/overview"},{l:"Anthropic — Tool use",u:"https://docs.claude.com/en/docs/agents-and-tools/tool-use/overview"},{l:"OpenAI — Embeddings guide",u:"https://platform.openai.com/docs/guides/embeddings"}],
 drill:"Write out your AI recruitment platform's full pipeline on paper, including what happens when the model returns malformed JSON, times out, or hallucinates a score. Those failure paths are the interview." },

{ id:"ai-2", cat:"AI engineering", t:"Python essentials for the parts you own", min:6,
 bn:"আপনি Osilion-এ Python ব্যবহার করেছেন লিড জেনারেশন প্ল্যাটফর্মে, তাই মৌলিক প্রশ্ন আসতে পারে। জানা দরকার: list/dict comprehension, ভার্চুয়াল এনভায়রনমেন্ট ও requirements.txt, টাইপ হিন্ট, ব্যতিক্রম হ্যান্ডলিং, আর requests লাইব্রেরি দিয়ে API কল। স্ক্র্যাপিং ও ডেটা প্রসেসিংয়ের জন্য BeautifulSoup ও pandas সাধারণ। FastAPI দিয়ে দ্রুত API বানানো যায় এবং এটি টাইপ হিন্ট থেকে ভ্যালিডেশন করে। মনে রাখবেন — Python আপনার প্রধান ভাষা নয়, তাই সৎভাবে বলুন: কাজ চালানোর মতো জানি, বিশেষজ্ঞ নই।",
 body:[
 {p:"You used Python for the lead-generation platform at Osilion. Expect light questions — enough to confirm you actually wrote it. Don't oversell; a confident 'working proficiency' is the right claim."},
 {h:"The essentials"},
 {list:["Comprehensions: [x.name for x in leads if x.active] — idiomatic Python, and interviewers notice if you write Java-style loops instead.",
 "Virtual environments and requirements.txt / pyproject.toml — dependency isolation.",
 "Type hints: def score(cv: str) -> float. Optional at runtime, but expected in professional code.",
 "Exception handling with specific exception types, and context managers (with open(...)) for cleanup.",
 "Generators with yield for large datasets — the same idea as PHP generators.",
 "Dataclasses for structured data — Python's answer to DTOs."]},
 {h:"The libraries in your actual work"},
 {p:"requests or httpx for API calls, BeautifulSoup for HTML parsing, pandas for tabular data, and FastAPI if you build endpoints — it derives validation and OpenAPI docs from type hints, which makes it the natural choice for a small service."},
 {h:"Scraping realities worth mentioning"},
 {p:"Rate limiting and politeness, respecting robots.txt, handling pagination and structure changes, retries with backoff, and the SSRF risk when fetching user-supplied URLs. Raising the legal/ethical dimension unprompted — checking terms of service, avoiding personal data misuse — reads as maturity."},
 {tip:"If they push deeper than your comfort: 'Python was a supporting language for the data pipeline; my primary backend depth is PHP and C#.' Honest boundaries beat exposed bluffs, every time."}],
 docs:[{l:"Python official tutorial",u:"https://docs.python.org/3/tutorial/"},{l:"FastAPI documentation",u:"https://fastapi.tiangolo.com/"},{l:"Requests library",u:"https://requests.readthedocs.io/"}],
 drill:"Rewrite one small script from your lead-gen work from memory, with type hints and proper exception handling. No AI." },

{ id:"dom-1", cat:"Domain knowledge", t:"Payments, money and financial correctness", min:8,
 bn:"পেমেন্ট নিয়ে কাজ করলে ইন্টারভিউয়ে গভীর প্রশ্ন আসে, কারণ এখানে ভুল হলে সরাসরি টাকার ক্ষতি হয়। সবচেয়ে গুরুত্বপূর্ণ নিয়ম: টাকা কখনো float-এ রাখবেন না — সবসময় integer (পয়সা/সেন্ট) বা decimal ব্যবহার করুন, কারণ float-এ 0.1 + 0.2 সমান 0.3 হয় না। প্রতিটি পেমেন্ট অপারেশন idempotent হতে হবে যাতে একই রিকোয়েস্ট দুবার এলে দুবার চার্জ না হয়। ওয়েবহুক অবশ্যই সিগনেচার যাচাই করে তারপর ইভেন্ট আইডি দিয়ে ডুপ্লিকেট চেক করতে হবে। আর সব লেনদেনের একটি অপরিবর্তনীয় লগ (audit trail) রাখুন — কখনো রেকর্ড মুছবেন না, বাতিল করুন।",
 body:[
 {p:"You integrated bKash and Nagad at CoreBari and payment gateways at DevVoyage. Payment questions go deep because mistakes cost real money, and interviewers use them to test rigor."},
 {h:"Never use floats for money"},
 {code:"// Wrong — floating point can't represent 0.1 exactly\n$total = 0.1 + 0.2;        // 0.30000000000000004\n\n// Right — store minor units as integers\n$totalPaisa = 1050;         // 10.50 BDT\n\n// Or use a decimal column and a Money value object\n// DB: DECIMAL(12,2) — never FLOAT or DOUBLE"},
 {h:"The non-negotiables"},
 {list:["Idempotency on every payment operation — a retried request must not charge twice. Idempotency key plus a processed-requests table.",
 "Webhook signature verification before processing anything, then deduplication by the provider's event ID.",
 "An immutable audit trail — never delete or overwrite a transaction record; append a reversal instead. You must be able to reconstruct any balance from history.",
 "Store the price at time of order, not a reference to the current price. Prices change; historical orders must not.",
 "Currency stored explicitly with every amount. Never assume.",
 "Reconciliation — a scheduled job comparing your records against the provider's, because they will diverge eventually."]},
 {h:"State machines"},
 {p:"Model payment status explicitly: pending → authorized → captured → settled, with refunded and failed as terminal states. Define which transitions are legal and reject the rest. This prevents the classic bug where a delayed webhook moves a refunded order back to paid."},
 {h:"The failure cases to mention"},
 {p:"What happens if the gateway confirms but your database write fails? If the webhook arrives before your redirect handler? If the user closes the tab mid-payment? Good answers: the gateway is the source of truth, reconcile asynchronously, and never mark an order paid from a client-side redirect alone — only from a verified webhook or a server-side status check."},
 {tip:"'Never trust the client redirect for payment confirmation' is a sentence that instantly signals you've shipped payments in production."}],
 docs:[{l:"Stripe — Payment Intents lifecycle",u:"https://docs.stripe.com/payments/paymentintents/lifecycle"},{l:"Stripe — Idempotent requests",u:"https://docs.stripe.com/api/idempotent_requests"}],
 drill:"Draw the payment state machine for CoreBari, including every failure path. Then write down what happens when a webhook arrives twice, out of order, and after a refund." },

{ id:"dom-2", cat:"Domain knowledge", t:"Message queues and event-driven thinking", min:7,
 bn:"কিউ ও ইভেন্ট-ড্রিভেন আর্কিটেকচার নিয়ে সিস্টেম ডিজাইন প্রশ্নে প্রায়ই আলোচনা হয়। মূল ধারণা: সিনক্রোনাস কল মানে অপেক্ষা করা ও সরাসরি নির্ভরতা, আর অ্যাসিনক্রোনাস মেসেজ মানে ঢিলেঢালা সংযোগ ও ভালো স্থিতিস্থাপকতা — কিন্তু বিনিময়ে জটিলতা বাড়ে ও ডেটা সাময়িকভাবে অসামঞ্জস্যপূর্ণ থাকে। মনে রাখার মতো তিনটি বিষয়: at-least-once ডেলিভারি মানে মেসেজ দুবার আসতে পারে তাই idempotency লাগবে, ডেড-লেটার কিউ দিয়ে বারবার ব্যর্থ মেসেজ আলাদা করতে হবে, আর মেসেজের ক্রম সবসময় নিশ্চিত নয়।",
 body:[
 {p:"Even if you don't run Kafka, system design conversations go here quickly. Understanding the model matters more than knowing a specific broker."},
 {h:"Sync vs async"},
 {p:"A synchronous call means waiting and a direct dependency — if the other service is down, you're down. An asynchronous message means loose coupling and resilience, at the cost of complexity and eventual consistency. Choose sync when the caller needs the result to proceed; async when the work can happen slightly later."},
 {h:"Delivery guarantees"},
 {list:["At-most-once — may lose messages. Rarely acceptable.",
 "At-least-once — the practical default. Messages can arrive twice, so consumers must be idempotent. This is why idempotency keeps appearing in every lesson.",
 "Exactly-once — mostly a marketing claim; achieved in practice as at-least-once plus idempotent consumers."]},
 {h:"The operational realities"},
 {list:["Dead-letter queues — after N failures, park the message somewhere a human can inspect it rather than retrying forever.",
 "Ordering is not guaranteed unless you design for it (partition keys, sequence numbers).",
 "Backpressure — what happens when producers outpace consumers? Queue depth monitoring and alerting.",
 "Poison messages — one malformed message that crashes every worker that touches it.",
 "Visibility timeout — if a worker dies mid-processing, when does the message become available again?"]},
 {h:"Event-driven patterns"},
 {p:"Event notification (something happened, go look it up) versus event-carried state transfer (the event contains the data, so consumers don't need to call back). Outbox pattern: write the event to a database table in the same transaction as the state change, then a separate process publishes it — this solves the dual-write problem where your database commits but the message publish fails."},
 {tip:"The outbox pattern is a strong thing to know by name. It's the correct answer to 'how do you guarantee the event is published if the database commit succeeds?'"}],
 docs:[{l:"AWS — SQS best practices",u:"https://docs.aws.amazon.com/AWSSimpleQueueService/latest/SQSDeveloperGuide/sqs-best-practices.html"},{l:"microservices.io — Transactional outbox",u:"https://microservices.io/patterns/data/transactional-outbox.html"}],
 drill:"Design the notification flow for CoreBari: a sale happens offline, syncs later, and must trigger an SMS exactly once. Write down every place it could double-send." },
