{ id:"iv-3", cat:"Interview craft", t:"The recruiter screen and the take-home assignment", min:8,
 bn:"প্রথম কল সাধারণত রিক্রুটারের সাথে হয় এবং এটি টেকনিক্যাল নয় — এখানে তারা যাচাই করে যোগাযোগ দক্ষতা, বেতনের প্রত্যাশা, নোটিশ পিরিয়ড, আর টাইমজোন। তাই সংক্ষিপ্ত ও পরিষ্কার উত্তর দিন, নিজের গল্প ৯০ সেকেন্ডে বলুন। টেক-হোম অ্যাসাইনমেন্টে সবচেয়ে বড় ভুল হলো অতিরিক্ত ইঞ্জিনিয়ারিং — তারা দেখতে চায় পরিষ্কার কোড, টেস্ট, আর একটি README যেখানে আপনি আপনার সিদ্ধান্ত ও ট্রেড-অফ ব্যাখ্যা করেছেন। সময়সীমা মেনে চলুন, আর যা বাদ দিয়েছেন তা README-তে লিখে দিন — এটাই সিনিয়র আচরণ।",
 body:[
 {h:"The recruiter screen (20–30 min)"},
 {p:"Usually non-technical. They're checking communication, salary expectation, notice period, timezone overlap, and whether your CV is真. Keep answers short and clear. Have ready: your 90-second story, why you're looking, your salary range, your availability, and your timezone overlap in their working hours."},
 {p:"Timezone is a real screening criterion for remote roles. Say it proactively: 'Bangladesh time, and I typically overlap with European hours from X to Y.' Removing their doubt before they raise it is worth a lot."},
 {h:"The take-home — where good candidates lose"},
 {list:["Respect the time-box. If they say four hours, don't spend twenty — and say in the README what you'd have added with more time.",
 "Don't over-engineer. A CRUD task doesn't need hexagonal architecture with CQRS. Matching the solution to the problem is what's being tested.",
 "Include tests. Even a handful. A submission with no tests is often auto-rejected at senior level.",
 "Write a README: how to run it, what decisions you made, what trade-offs you accepted, what you left out deliberately.",
 "Handle errors and edge cases — empty states, validation, failure paths. This is what separates senior submissions.",
 "Clean git history with meaningful commits, not one 'final' commit."]},
 {h:"The AI question on take-homes"},
 {p:"Many companies now allow AI but ask you to disclose usage and defend the code in a follow-up call. Your position is straightforward and honest: use it, disclose it if asked, and be certain you can explain and modify every line live. The follow-up call is where the real evaluation happens."},
 {h:"Pair-programming interviews"},
 {p:"Increasingly common instead of take-homes. They want to see how you work: asking clarifying questions, thinking aloud, using documentation naturally, accepting hints without defensiveness. Being pleasant to work with is explicitly being tested."},
 {tip:"For any take-home, the README is your highest-leverage artifact. Most candidates submit code with no explanation; a clear trade-off discussion makes you memorable."}],
 docs:[{l:"Keep a Changelog (README/commit hygiene)",u:"https://keepachangelog.com/en/1.1.0/"}],
 drill:"Do one timed take-home practice: build a small API in four hours with tests and a README explaining three decisions. Then reread the README as if you were the reviewer." },

{ id:"iv-4", cat:"Interview craft", t:"Working remotely across timezones — the trust question", min:6,
 bn:"রিমোট রোলে নিয়োগকর্তার আসল দুশ্চিন্তা হলো: এই মানুষটি কি নিজে নিজে কাজ চালিয়ে নিতে পারবে, নাকি প্রতিদিন তদারকি লাগবে? আপনার শক্তি হলো Osilion-এ এক বছরের প্রমাণিত রিমোট অভিজ্ঞতা — এটি সরাসরি বলুন। ভালো উত্তরে যা থাকা উচিত: লিখিত যোগাযোগে দক্ষতা, নিয়মিত আপডেট দেওয়া, ব্লক হলে দ্রুত জানানো (চুপ করে বসে না থাকা), আর প্রশ্ন এমনভাবে করা যাতে অন্যপক্ষ ঘুম থেকে উঠে সম্পূর্ণ প্রসঙ্গ পায়। ওভারল্যাপ আওয়ার আগেই স্পষ্ট করে বলুন — এটি তাদের সন্দেহ দূর করে।",
 body:[
 {p:"For a remote hire, the employer's real anxiety is not your coding — it's whether you'll disappear, need constant supervision, or block for two days waiting for an answer. You have a full year of evidence against those fears. Use it."},
 {h:"What good remote work looks like, said out loud"},
 {list:["Written communication as the default — decisions in writing, in a place others can find them later.",
 "Proactive status updates before being asked, so nobody wonders what you're doing.",
 "Asking questions with full context attached, so the answer can come while you sleep and still be useful.",
 "Flagging blockers within hours, not days. Silence is the failure mode remote managers fear most.",
 "Unblocking yourself where reasonable — making a documented reasonable assumption and continuing, rather than stopping.",
 "Reliable overlap hours, stated clearly and honoured."]},
 {h:"Your evidence"},
 {p:"A year of contract work for a Norwegian startup, delivering four products across a five-hour timezone gap, with two founders willing to vouch for you. That's not a claim, it's a track record — and it's exactly the reassurance a remote employer needs. Say the overlap explicitly: Bangladesh time gives you solid overlap with European mornings and afternoons."},
 {h:"Async collaboration specifics"},
 {p:"Pull request descriptions that explain why. Recording a short screen capture instead of scheduling a call. Keeping decisions in issues rather than DMs. Documenting as you go, because your teammates are asleep when you have the context fresh."},
 {tip:"If they ask 'have you worked remotely before?' don't just say yes — say what you did to make it work. The behaviours are the answer, not the fact."}],
 docs:[{l:"GitLab remote work handbook",u:"https://handbook.gitlab.com/handbook/company/culture/all-remote/"}],
 drill:"Write your remote-work story as a STAR: a specific time async communication prevented a problem, or a time you unblocked yourself instead of waiting." },

{ id:"iv-5", cat:"Interview craft", t:"Agile, teamwork and the questions about people", min:6,
 bn:"টেকনিক্যাল প্রশ্নের পাশাপাশি টিমওয়ার্ক নিয়ে প্রশ্ন আসবেই, আর অনেক ডেভেলপার এখানে দুর্বল থাকে। Scrum-এর মূল অংশগুলো জানুন: স্প্রিন্ট, ডেইলি স্ট্যান্ডআপ, প্ল্যানিং, রিভিউ, রেট্রোস্পেকটিভ — এবং সৎভাবে বলুন আপনার টিমে বাস্তবে কীভাবে চলত, কারণ কোনো কোম্পানিই বইয়ের মতো Scrum করে না। এস্টিমেশন নিয়ে প্রশ্ন এলে বলুন: অনিশ্চয়তা স্বীকার করি, বড় কাজ ভেঙে ছোট করি, আর দেরি হলে আগেভাগে জানাই। মেন্টরিং ও কোড রিভিউর অভিজ্ঞতা আপনার আছে — সেগুলো নির্দিষ্ট উদাহরণ দিয়ে বলুন।",
 body:[
 {h:"Agile without the buzzwords"},
 {p:"Know the ceremonies — sprint planning, daily standup, review, retrospective, backlog refinement — and the artifacts: backlog, sprint backlog, increment. But the strongest answer describes how it actually worked on your team, including where it didn't. Nobody runs textbook Scrum, and pretending otherwise sounds naive."},
 {h:"Estimation"},
 {p:"Story points as relative complexity rather than hours; velocity as a planning input, not a performance metric. The honest senior answer: 'I estimate by breaking work down until the pieces are understandable, I flag uncertainty explicitly, and I communicate as soon as an estimate looks wrong rather than at the deadline.' That last clause is what they're listening for."},
 {h:"The people questions and how to answer them"},
 {list:["Disagreeing with a technical decision — show you can argue your case, then commit either way. 'We went the other way and it worked out' is a great ending; it shows humility.",
 "Mentoring — you did this at DevVoyage and L2N. Be specific: what they couldn't do, what you changed in your approach, what they could do afterwards.",
 "A difficult teammate — focus on what you did, never on their character. Assume good intent, seek the underlying constraint, escalate only when necessary.",
 "Receiving critical feedback — a real example where you changed something. Defensiveness here is disqualifying.",
 "Missing a deadline — communicate early, propose options (cut scope, extend, add help), and don't hide it."]},
 {h:"What they're really assessing"},
 {p:"Whether you'll be a net positive on a team of five people who have to work with you every day. Technical brilliance with poor collaboration loses to solid engineering with good communication in most hiring decisions — and interviewers know it."},
 {tip:"Never criticise a former employer or colleague, even when justified. The interviewer can't verify the story, but they can observe that you speak badly about people who aren't in the room."}],
 docs:[{l:"Scrum Guide (official, free)",u:"https://scrumguides.org/scrum-guide.html"}],
 drill:"Write three STAR stories: a disagreement, a mentoring case, and a time you received hard feedback. Read them aloud and cut anything that blames someone else." },
];

const GEMINI_MODELS = [
  "gemini-3.5-flash-lite",
  "gemini-3.1-flash-lite",
  "gemini-2.5-flash-lite",
  "gemini-2.5-flash",
];

function speechRecognitionCtor() {
  return window.SpeechRecognition || window.webkitSpeechRecognition || null;
}

function speakText(text, onDone) {
  if (!window.speechSynthesis || !text) {
    if (onDone) onDone();
    return Promise.resolve();
  }
  return new Promise((resolve) => {
    window.speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "en-US";
    u.rate = 1.02;
    const voices = window.speechSynthesis.getVoices();
    const en = voices.find(v => v.lang.startsWith("en") && /google|natural|premium/i.test(v.name))
      || voices.find(v => v.lang.startsWith("en"));
    if (en) u.voice = en;
    const done = () => { if (onDone) onDone(); resolve(); };
    u.onend = done;
    u.onerror = done;
    window.speechSynthesis.speak(u);
    setTimeout(() => {
      if (window.speechSynthesis.speaking || window.speechSynthesis.pending) return;
      done();
    }, Math.min(120000, text.length * 55 + 800));
  });
}

function stopSpeaking() {
  if (window.speechSynthesis) window.speechSynthesis.cancel();
}

if (typeof window !== "undefined" && window.speechSynthesis) {
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function toGeminiContents(messages) {
  return messages.filter(m => m.content).map(m => ({
    role: m.role === "assistant" ? "model" : "user",
    parts: [{ text: m.content }],
  }));
}

function extractGeminiText(data) {
  const parts = (((data.candidates || [])[0] || {}).content || {}).parts || [];
  return parts.map(p => p.text || "").join("\n").trim();
}

function friendlyLlmError(status, message) {
  if (status === 429 || /quota|rate limit/i.test(message || "")) {
    return "Free quota hit. Wait a minute, or try again later today.";
  }
  if (status === 401 || status === 403 || /api key|rejected/i.test(message || "")) {
    return "Gemini key rejected. Check Settings (or config.php on the host).";
  }
  return message || "The model did not respond. Check your connection and try again.";
}

function parseGeminiKeys(raw) {
  if (!raw) return [];
  const seen = new Set();
  const keys = [];
  String(raw).split(/[\n,]+/).forEach(part => {
    const k = part.trim();
    if (k && k.startsWith("AIza") && !seen.has(k)) {
      seen.add(k);
      keys.push(k);
    }
  });
  return keys;
}

function loadGeminiKeysRaw() {
  try {
    return localStorage.getItem("prep-gemini-keys")
      || localStorage.getItem("prep-gemini-key")
      || "";
  } catch (e) {
    return "";
  }
}

function saveGeminiKeysRaw(raw) {
  try {
    localStorage.setItem("prep-gemini-keys", raw);
    localStorage.removeItem("prep-gemini-key");
  } catch (e) {}
}

function readKeyIndex(count) {
  if (count <= 0) return 0;
  try {
    const idx = parseInt(localStorage.getItem("prep-gemini-key-idx") || "0", 10);
    return ((idx % count) + count) % count;
  } catch (e) {
    return 0;
  }
}

function writeKeyIndex(index) {
  try { localStorage.setItem("prep-gemini-key-idx", String(index)); } catch (e) {}
}

async function askGeminiDirect(apiKeys, system, messages) {
  const keys = Array.isArray(apiKeys) ? apiKeys : parseGeminiKeys(apiKeys);
  if (!keys.length) throw new Error("No Gemini keys configured.");

  const start = readKeyIndex(keys.length);
  let last = "Gemini did not respond.";
  let rotated = false;

  for (let i = 0; i < keys.length; i++) {
    const idx = (start + i) % keys.length;
    const key = keys[idx];
    try {
      const text = await askGeminiOneKey(key, system, messages);
      writeKeyIndex(idx);
      return text;
    } catch (e) {
      last = e.message || last;
      if (/quota|rate limit|429|rejected|401|403/i.test(last)) {
        rotated = true;
        continue;
      }
      throw e;
    }
  }

  throw new Error(rotated
    ? "All Gemini keys hit the free limit. Wait and try again, or add another key in Settings."
    : last);
}

async function askGeminiOneKey(apiKey, system, messages) {
  let last = "Gemini did not respond.";
  for (const model of GEMINI_MODELS) {
    const res = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/" + model + ":generateContent?key=" + encodeURIComponent(apiKey),
      {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
          system_instruction: { parts: [{ text: system }] },
          contents: toGeminiContents(messages),
          generationConfig: { maxOutputTokens: 1024, temperature: 0.7 },
        }),
      }
    );
    const data = await res.json().catch(() => ({}));
    if (res.ok) {
      const text = extractGeminiText(data);
      if (text) return text;
    }
    const msg = (data.error && data.error.message) || ("HTTP " + res.status);
    last = friendlyLlmError(res.status, msg);
    if (res.status === 429) continue;
    if (res.status === 401 || res.status === 403) throw new Error(last);
    if (res.status === 404 || /not found|not supported/i.test(msg)) continue;
    throw new Error(last);
  }
  if (/quota|rate limit|429/i.test(last)) throw new Error(last);
  throw new Error(last);
}

let proxyState = "unknown";

async function askLlm({ system, messages, apiKey }) {
  if (proxyState !== "no") {
    try {
      const res = await fetch("chat.php", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ system, messages }),
      });
      if (res.status !== 404) {
        const data = await res.json().catch(() => ({}));
        if (data.text) {
          proxyState = "yes";
          return data.text;
        }
        // 503 = proxy present but no server key — fall through to browser key
        if (res.status !== 503 || !parseGeminiKeys(apiKey).length) {
          throw new Error(friendlyLlmError(res.status, data.error));
        }
      }
    } catch (e) {
      if (proxyState === "yes" || !parseGeminiKeys(apiKey).length) throw e;
    }
    if (proxyState !== "yes") proxyState = "no";
  }
  if (!apiKey || !parseGeminiKeys(apiKey).length) {
    throw new Error("Add one or more free Gemini keys in Settings, or upload chat.php and config.php on the host.");
  }
  return askGeminiDirect(apiKey, system, messages);
}

const TRACKS = {
  sprint: { id: "sprint", label: "30-day sprint", horizon: 30, weeks: CURRICULUM_30 },
  depth: { id: "depth", label: "60-day depth", horizon: 60, weeks: CURRICULUM },
};

function activeTrack(state) {
  return TRACKS[state.track] || TRACKS.sprint;
}

function dayMeta(state, dayNum) {
  const track = activeTrack(state);
  const all = track.weeks.flatMap(w => w.days.map(d => ({ ...d, w: w.w, wt: w.t })));
  const today = all.find(d => d.d === dayNum) || all[all.length - 1];
  const extra = track.id === "depth" ? (DAY_LINKS_60[today.d] || {}) : {};
  return {
    ...today,
    lessons: today.lessons || extra.lessons || [],
    cats: today.cats || extra.cats || [],
    system: today.system || extra.system || null,
  };
}

function suggestedDsaIdx(dayNum) {
  return Math.max(0, (dayNum - 1) % DSA.length);
}

function mockModeForDay(today) {
  if (!today.cats || !today.cats.length) return "full";
  const c = today.cats[0];
  if (c === "PHP" || c === "Laravel") return "laravel";
  if (c === "Frontend") return "frontend";
  if (c === "SQL") return "sql";
  if (c === "Architecture") return "system";
  if (c === ".NET") return "dotnet";
  if (c === "AI") return "ai";
  if (c === "Behavioral") return "behavioral";
  return "full";
}

function parseRouteFromHash() {
  const raw = (location.hash || "").replace(/^#/, "");
  if (!raw) return { tab: "today", focus: null };
  const parts = raw.split("/");
  const tab = parts[0] || "today";
  const focus = {};
  if (parts[1] === "lesson" && parts[2]) focus.lessonId = decodeURIComponent(parts[2]);
  else if (parts[1] === "cat" && parts[2]) focus.cat = decodeURIComponent(parts[2]);
  else if (parts[1] === "system" && parts[2]) focus.systemId = decodeURIComponent(parts[2]);
  else if (parts[1] === "code" && parts[2]) focus.problemIdx = parseInt(parts[2], 10);
  else if (parts[1] === "live" && parts[2]) focus.live = decodeURIComponent(parts[2]);
  else if (parts[1] === "offline" && parts[2]) focus.offline = decodeURIComponent(parts[2]);
  else if (parts[1] === "topic" && parts[2]) { focus.live = "topic"; focus.lessonId = decodeURIComponent(parts[2]); }
  else if (parts[1] === "pane" && parts[2]) focus.pane = decodeURIComponent(parts[2]);
  return { tab, focus: Object.keys(focus).length ? focus : null };
}

function buildHash(tab, focus) {
  if (!focus) return tab;
  if (focus.lessonId) return tab + "/lesson/" + focus.lessonId;
  if (focus.cat) return tab + "/cat/" + encodeURIComponent(focus.cat);
  if (focus.systemId) return tab + "/system/" + focus.systemId;
  if (focus.problemIdx != null) return tab + "/code/" + focus.problemIdx;
  if (focus.live) {
    if (focus.lessonId) return tab + "/topic/" + focus.lessonId;
    return tab + "/live/" + focus.live;
  }
  if (focus.offline) return tab + "/offline/" + focus.offline;
  if (focus.pane) return tab + "/pane/" + focus.pane;
  return tab;
}

function Drill({ state, persist, focus }) {
  const cats = ["All", "Fumbled", ...Array.from(new Set(QUESTIONS.map(q => q.c)))];
  const [cat, setCat] = useState(focus?.cat && cats.includes(focus.cat) ? focus.cat : "All");
  const [i, setI] = useState(0);
  const [shown, setShown] = useState(false);

  useEffect(() => {
    if (focus?.cat && cats.includes(focus.cat)) {
      setCat(focus.cat); setI(0); setShown(false);
    }
  }, [focus]);

  const pool = QUESTIONS.filter((q, idx) => {
    if (cat === "All") return true;
    if (cat === "Fumbled") return state.q[idx] === "fumbled";
    return q.c === cat;
  });
  const idxOf = (q) => QUESTIONS.indexOf(q);
  const current = pool[i % Math.max(1, pool.length)];

  const mark = (val) => {
    if (!current) return;
    persist({ ...state, q: { ...state.q, [idxOf(current)]: val } });
    setShown(false); setI(i + 1);
  };

  return (
    <div className="space-y-4">
      <div className="flex gap-1.5 flex-wrap">
        {cats.map(c => (
          <button key={c} onClick={() => { setCat(c); setI(0); setShown(false); }}
            className={`px-2.5 py-1 rounded text-xs font-medium transition-colors ${
              cat === c ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700"}`}>
            {c}{c === "Fumbled" && ` (${Object.values(state.q).filter(v => v === "fumbled").length})`}
          </button>
        ))}
      </div>

      {!current ? (
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-8 text-center">
          <Trophy className="w-6 h-6 text-emerald-400 mx-auto mb-2" />
          <p className="text-sm text-slate-300">Nothing in this pile. Pick another category.</p>
        </div>
      ) : (
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-5">
          <div className="flex items-center justify-between mb-4">
            <span className="font-mono text-[10px] uppercase tracking-widest text-amber-400">{current.c}</span>
            <span className="font-mono text-xs text-slate-600 tabular-nums">{(i % pool.length) + 1}/{pool.length}</span>
          </div>

          <p className="text-base text-slate-100 leading-relaxed mb-5">{current.q}</p>

          {!shown ? (
            <div className="space-y-3">
              <p className="text-xs text-slate-500 italic">Say your answer out loud first. Then reveal.</p>
              <button onClick={() => setShown(true)}
                className="w-full py-2.5 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm font-medium rounded transition-colors">
                Reveal answer
              </button>
            </div>
          ) : (
            <div className="space-y-4">
              <div className="bg-slate-950 border-l-2 border-emerald-500 rounded-r px-4 py-3 space-y-2">
                <div className="font-mono text-[10px] uppercase tracking-widest text-emerald-400">Efficient answer</div>
                <p className="text-sm text-slate-300 leading-relaxed">{current.a}</p>
              </div>
              {current.x && (
                <div className="bg-slate-950 border-l-2 border-amber-500 rounded-r px-4 py-3 space-y-2">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-amber-400">Why / how to think</div>
                  <p className="text-sm text-slate-400 leading-relaxed">{current.x}</p>
                </div>
              )}
              <div className="flex gap-2">
                <button onClick={() => mark("fumbled")}
                  className="flex-1 py-2.5 bg-rose-950 border border-rose-900 hover:bg-rose-900 text-rose-200 text-sm font-medium rounded flex items-center justify-center gap-2 transition-colors">
                  <X className="w-3.5 h-3.5" /> Fumbled it
                </button>
                <button onClick={() => mark("got")}
                  className="flex-1 py-2.5 bg-emerald-950 border border-emerald-800 hover:bg-emerald-900 text-emerald-200 text-sm font-medium rounded flex items-center justify-center gap-2 transition-colors">
                  <Check className="w-3.5 h-3.5" /> Nailed it
                </button>
              </div>
            </div>
          )}
        </div>
      )}

      <div className="flex items-center justify-between text-xs text-slate-600 px-1">
        <span className="font-mono">
          {Object.values(state.q).filter(v => v === "got").length} solid ·{" "}
          {Object.values(state.q).filter(v => v === "fumbled").length} to redo
        </span>
        <button onClick={() => persist({ ...state, q: {} })} className="flex items-center gap-1 hover:text-slate-400">
          <RotateCcw className="w-3 h-3" /> Reset marks
        </button>
      </div>
    </div>
  );
}

function topicSystem(state, dayNum, lessonId) {
  const today = dayMeta(state, dayNum);
  const focusLesson = lessonId ? LESSONS.find(l => l.id === lessonId) : null;
  const lessons = focusLesson
    ? [focusLesson]
    : (today.lessons || []).map(id => LESSONS.find(l => l.id === id)).filter(Boolean);
  const lessonBlock = lessons.length
    ? lessons.map(l => "- " + l.t + (l.drill ? "\n  Drill: " + l.drill : "")).join("\n")
    : "- " + today.s;
  return `You are a senior coach helping this engineer own today's material well enough to teach it in an interview.

${PROFILE}

Today's study: ${today.s}
Build (they should do this with AI off): ${today.b}
Lessons:
${lessonBlock}

Rules:
- Stay on today's topic. Do not wander into a general lecture.
- Be Socratic. Ask one question at a time. Wait.
- If they are vague, demand a concrete example from CoreBari, the AI recruitment platform, L2N, or DevVoyage.
- Correct mistakes briefly, then make them restate the idea in their own words.
- After they can explain the idea cleanly, give one interview-shaped follow-up.
- Keep replies short: 3–6 sentences. No essays.
- If they type "score me", say what they now own, what is still fuzzy, and the one drill for tomorrow.

Start by asking what they think today's topic is actually testing in an interview.`;
}

function commsSystem() {

${PROFILE}

The goal is not native-speaker theater. The goal is answers a hiring manager can follow on a bad Zoom call.

For every answer they give:
1. Score 1–5 on: structure (STAR when it is a story), specificity (names of systems, not "we"), filler/ramble, and whether a remote interviewer would follow it.
2. Name the single weakest move.
3. Rewrite the answer in THEIR voice — short, concrete, first person. Do not make it posh.

Rules:

- If they ramble, cut. If they are too short, ask for the missing fact.

Start by asking them to answer, out loud: "Tell me about yourself" in 90 seconds.`;
}

function LiveChat({ apiKey, system, startUser, title, youLabel, botLabel, placeholder, onEnd }) {
  const [msgs, setMsgs] = useState([]);
  const [input, setInput] = useState("");
  const [busy, setBusy] = useState(false);
  const [err, setErr] = useState("");
  const [listening, setListening] = useState(false);
  const [speaking, setSpeaking] = useState(false);
  const [speakOn, setSpeakOn] = useState(() => {
    try { return localStorage.getItem("prep-speak-replies") !== "0"; } catch (e) { return true; }
  });
  const [convoOn, setConvoOn] = useState(() => {
    try { return localStorage.getItem("prep-conversation") !== "0"; } catch (e) { return true; }
  });
  const endRef = useRef(null);
  const recRef = useRef(null);
  const busyRef = useRef(false);
  const speakOnRef = useRef(speakOn);
  const convoOnRef = useRef(convoOn);
  const canHear = !!speechRecognitionCtor();

  useEffect(() => { speakOnRef.current = speakOn; }, [speakOn]);
  useEffect(() => { convoOnRef.current = convoOn; }, [convoOn]);
  useEffect(() => { busyRef.current = busy; }, [busy]);
  useEffect(() => { endRef.current && endRef.current.scrollIntoView({ behavior: "smooth" }); }, [msgs, busy, speaking]);
  useEffect(() => () => { stopSpeaking(); if (recRef.current) recRef.current.stop(); }, []);

  const toggleSpeak = () => {
    const next = !speakOn;
    setSpeakOn(next);
    speakOnRef.current = next;
    try { localStorage.setItem("prep-speak-replies", next ? "1" : "0"); } catch (e) {}
    if (!next) stopSpeaking();
  };

  const toggleConvo = () => {
    const next = !convoOn;
    setConvoOn(next);
    convoOnRef.current = next;
    try { localStorage.setItem("prep-conversation", next ? "1" : "0"); } catch (e) {}
  };

  const startListening = () => {
    if (!convoOnRef.current || !canHear || busyRef.current || listening) return;
    const Ctor = speechRecognitionCtor();
    if (!Ctor) return;
    if (recRef.current) {
      try { recRef.current.stop(); } catch (e) {}
    }
    const rec = new Ctor();
    rec.lang = "en-US";
    rec.interimResults = true;
    rec.continuous = false;
    rec.onresult = (e) => {
      let said = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        if (e.results[i].isFinal) said += e.results[i][0].transcript;
      }
      if (said.trim()) {
        setInput(said.trim());
        submit(said.trim());
      }
    };
    rec.onerror = (ev) => {
      setListening(false);
      if (ev.error === "not-allowed") {
        setErr("Mic blocked. Allow microphone for this site in Chrome settings.");
      }
    };
    rec.onend = () => { setListening(false); recRef.current = null; };
    recRef.current = rec;
    setListening(true);
    setErr("");
    try { rec.start(); } catch (e) { setListening(false); }
  };

  const playReply = async (reply) => {
    if (!speakOnRef.current || !reply) {
      if (convoOnRef.current && canHear) startListening();
      return;
    }
    setSpeaking(true);
    await speakText(reply);
    setSpeaking(false);
    if (convoOnRef.current && canHear && !busyRef.current) startListening();
  };

  const pushReply = (history, userText, reply) => {
    setMsgs([...history, ...(userText ? [{ role: "user", content: userText }] : []), { role: "assistant", content: reply }]);
    playReply(reply);
  };

  const send = async (text, existing) => {
    const history = existing || msgs;
    const outgoing = [...history, ...(text ? [{ role: "user", content: text }] : [])];
    setBusy(true); setErr("");
    if (recRef.current) {
      try { recRef.current.stop(); } catch (e) {}
      setListening(false);
    }
    stopSpeaking();
    setSpeaking(false);
    try {
      const reply = await askLlm({ system, messages: outgoing, apiKey });
      if (!reply) throw new Error("empty");
      pushReply(history, text, reply);
    } catch (e) {
      setErr(e.message || "The model did not respond.");
    } finally { setBusy(false); }
  };

  useEffect(() => {
    let cancelled = false;
    (async () => {
      setBusy(true); setErr("");
      try {
        const seed = [{ role: "user", content: startUser }];
        const reply = await askLlm({ system, messages: seed, apiKey });
        if (cancelled) return;
        setMsgs([...seed, { role: "assistant", content: reply }]);
        await playReply(reply);
      } catch (e) {
        if (!cancelled) setErr(e.message || "Couldn't start. Check Settings and try again.");
      } finally { if (!cancelled) setBusy(false); }
    })();
    return () => { cancelled = true; };
  }, []);

  const submit = (override) => {
    const t = (override !== undefined ? override : input).trim();
    if (!t || busy) return;
    setInput("");
    send(t);
  };

  const toggleMic = () => {
    if (listening && recRef.current) {
      recRef.current.stop();
      return;
    }
    startListening();
  };

  return (
    <div className="space-y-3">
      <div className="flex items-center justify-between gap-2 flex-wrap min-w-0">
        <span className="font-mono text-[10px] uppercase tracking-widest text-amber-400 min-w-0 break-words">{title}</span>
        <div className="flex items-center gap-3 flex-wrap shrink-0">
          <button onClick={toggleConvo} disabled={!canHear}
            className={`text-xs flex items-center gap-1 ${convoOn ? "text-emerald-400" : "text-slate-500 hover:text-slate-300"} disabled:text-slate-700`}>
            <Mic className="w-3.5 h-3.5" /> {convoOn ? "Conversation on" : "Conversation off"}
          </button>
          <button onClick={toggleSpeak} className={`text-xs flex items-center gap-1 ${speakOn ? "text-amber-400" : "text-slate-500 hover:text-slate-300"}`}>
            <Volume2 className="w-3.5 h-3.5" /> {speakOn ? "AI voice on" : "AI voice off"}
          </button>
          <button onClick={onEnd} className="text-xs text-slate-500 hover:text-slate-300">End</button>
        </div>
      </div>

      {(convoOn && canHear) && (
        <div className="text-xs text-slate-400 bg-slate-900 border border-slate-800 rounded px-3 py-2 leading-relaxed">
          Conversation mode: the AI speaks, then your mic opens. Answer out loud — it sends when you pause.
          Chrome will ask for mic permission once.
        </div>
      )}

      {(speaking || listening || busy) && (
        <div className="font-mono text-[10px] uppercase tracking-widest text-center py-1">
          {busy ? <span className="text-slate-500">Thinking…</span>
               : speaking ? <span className="text-amber-400">AI speaking…</span>
               : <span className="text-emerald-400">Listening — speak now</span>}
        </div>
      )}

      <div className="space-y-3">
        {msgs.filter(m => m.role === "assistant" || (m.role === "user" && m.content !== startUser)).map((m, i) => (
          <div key={i} className={`rounded-lg p-3.5 text-sm leading-relaxed min-w-0 max-w-full ${
            m.role === "assistant"
              ? "bg-slate-900 border border-slate-800 text-slate-200"
              : "bg-slate-800 border border-slate-700 text-slate-300 sm:ml-6"}`}>
            <div className="font-mono text-[10px] uppercase tracking-wider text-slate-500 mb-1.5">
              {m.role === "assistant" ? botLabel : youLabel}
            </div>
            <div className="whitespace-pre-wrap break-words">{m.content}</div>
          </div>
        ))}
        {busy && (
          <div className="bg-slate-900 border border-slate-800 rounded-lg p-3.5 flex items-center gap-2 text-sm text-slate-500">
            <Loader2 className="w-3.5 h-3.5 animate-spin" /> Thinking…
          </div>
        )}
        {err && (
          <div className="text-xs text-rose-300 bg-rose-950 border border-rose-900 rounded px-3 py-2">{err}</div>
        )}
        <div ref={endRef} />
      </div>

      <div className="sticky bottom-3 flex flex-col sm:flex-row gap-2 bg-slate-950/95 sm:bg-transparent p-2 sm:p-0 rounded-t-lg sm:rounded-none border-t border-slate-800 sm:border-0 w-full max-w-full">
        <textarea value={input} onChange={e => setInput(e.target.value)} rows={2}
          onKeyDown={e => { if (e.key === "Enter" && (e.metaKey || e.ctrlKey)) submit(); }}
          placeholder={convoOn && canHear ? "Or type here… conversation mode uses the mic" : placeholder}
          className="flex-1 min-w-0 w-full bg-slate-900 border border-slate-700 rounded px-3 py-2.5 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-600 min-h-[3rem]" />
        <div className="flex gap-2 shrink-0 justify-end">
        <button type="button" onClick={toggleMic} disabled={busy || speaking || !canHear}
          title={canHear ? "Speak now" : "Voice input needs Chrome or Edge"}
          className={`px-3 rounded border transition-colors ${
            listening ? "bg-emerald-900 border-emerald-600 text-emerald-100 animate-pulse"
                      : "bg-slate-900 border-slate-700 text-slate-200 hover:border-amber-600 disabled:text-slate-600"}`}>
          {listening ? <MicOff className="w-4 h-4" /> : <Mic className="w-4 h-4" />}
        </button>
        <button onClick={() => submit()} disabled={busy || !input.trim()}
          className="px-4 bg-amber-500 hover:bg-amber-400 disabled:bg-slate-800 disabled:text-slate-600 text-slate-950 rounded transition-colors">
          <Send className="w-4 h-4" />
        </button>
        </div>
      </div>
      {!canHear && <p className="text-[11px] text-slate-600">Mic needs Chrome or Edge on desktop. Turn on AI voice to hear replies.</p>}
    </div>
  );
}

function Mock({ apiKey, setTab, state, persist, dayNum, focus, journal, persistJournal, go }) {
  const [engine, setEngine] = useState(() => {
    if (!focus) return null;
    if (focus.live === "topic") return "topic";
    if (focus.live === "comms") return "comms";
    if (focus.live === "interview") return "pick-live";
    if (focus.offline) return "offline";
    return null;
  });
  const [mode, setMode] = useState(() => focus?.offline || null);
  const [offPool, setOffPool] = useState(() => {
    if (!focus?.offline) return [];
    const spec = MOCK_MODES.find(x => x.id === focus.offline);
    if (!spec) return [];
    const pool = QUESTIONS.filter(q => !spec.cats || spec.cats.includes(q.c));
    return [...pool].sort(() => Math.random() - 0.5).slice(0, 8);
  });
  const [offI, setOffI] = useState(0);
  const [offShown, setOffShown] = useState(false);
  const [offMarks, setOffMarks] = useState([]);
  const hasLive = parseGeminiKeys(apiKey).length > 0 || proxyState === "yes" || proxyState === "unknown";

  const saveMockResult = (label, score, total) => {
    if (!persistJournal || !journal) return;
    const entry = {
      date: new Date().toISOString().slice(0, 10),
      note: "Mock " + label + ": " + score + "/" + total,
      apps: journal.apps.filter(a => a.date === new Date().toISOString().slice(0, 10)).length,
      ts: Date.now(),
    };
    persistJournal({ ...journal, logs: [entry, ...journal.logs] });
  };

  const needKey = () => setTab("settings");

  const startOffline = (m) => {
    const spec = MOCK_MODES.find(x => x.id === m);
    const pool = QUESTIONS.filter(q => !spec.cats || spec.cats.includes(q.c));
    const shuffled = [...pool].sort(() => Math.random() - 0.5).slice(0, 8);
    setEngine("offline"); setMode(m); setOffPool(shuffled); setOffI(0); setOffShown(false); setOffMarks([]);
  };

  const markOff = (val) => {
    const q = offPool[offI];
    const idx = QUESTIONS.indexOf(q);
    if (idx >= 0 && persist && state) {
      persist({ ...state, q: { ...state.q, [idx]: val } });
    }
    setOffMarks([...offMarks, val]);
    setOffShown(false);
    setOffI(offI + 1);
  };

  const reset = () => { setEngine(null); setMode(null); };

  if (engine === "topic") {
    return (
      <LiveChat apiKey={apiKey} system={topicSystem(state, dayNum, focus?.lessonId)}
        startUser="Let's work today's topic until I can teach it."
        title={"Topic coach · Day " + dayNum} youLabel="You" botLabel="Coach"
        placeholder="Explain it in your words… (Ctrl+Enter)"
        onEnd={reset} />
    );
  }

  if (engine === "comms") {
    return (
      <LiveChat apiKey={apiKey} system={commsSystem()}
        startUser="I want to tighten how I speak in interviews."
        title="Communication coach" youLabel="You" botLabel="Coach"
        placeholder="Type, or tap the mic and answer aloud…"
        onEnd={reset} />
    );
  }

  if (engine === "live" && mode) {
    return (
      <LiveChat apiKey={apiKey} system={interviewerSystem(mode)}
        startUser="I'm ready to begin the interview."
        title={MOCK_MODES.find(m => m.id === mode).label}
        youLabel="You" botLabel="Interviewer"
        placeholder={'Your answer… (or type "score me")'}
        onEnd={reset} />
    );
  }

  if (!engine) {
    return (
      <div className="space-y-3">
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-4">
          <h2 className="text-sm font-semibold text-slate-100 mb-1">Mock · coach · voice</h2>
          <p className="text-xs text-slate-400 leading-relaxed">
            Offline grill needs no key. Live modes use Gemini (free) with conversation mode: AI speaks, mic opens, you answer out loud.
            Chrome desktop — allow mic when asked.
          </p>
        </div>
        <button onClick={() => setEngine("pick-offline")}
          className="w-full bg-slate-900 border border-amber-800 hover:border-amber-600 rounded-lg p-4 text-left">
          <div className="text-sm font-medium text-slate-200">Self-grill (offline)</div>
          <div className="text-xs text-slate-500 mt-0.5">8 questions, reveal, mark. Daily default.</div>
        </button>
        <button onClick={() => hasLive ? setEngine("pick-live") : needKey()}
          className="w-full bg-slate-900 border border-slate-800 hover:border-amber-700 rounded-lg p-4 text-left">
          <div className="text-sm font-medium text-slate-200">Live interviewer {hasLive ? "" : "(needs Gemini key)"}</div>
          <div className="text-xs text-slate-500 mt-0.5">Knows your systems. Type "score me" when done.</div>
        </button>
        <button onClick={() => hasLive ? setEngine("topic") : needKey()}
          className="w-full bg-slate-900 border border-sky-900 hover:border-sky-600 rounded-lg p-4 text-left">
          <div className="text-sm font-medium text-slate-200">Topic coach</div>
          <div className="text-xs text-slate-500 mt-0.5">Today's study, until you can teach it.</div>
        </button>
        <button onClick={() => hasLive ? setEngine("comms") : needKey()}
          className="w-full bg-slate-900 border border-slate-800 hover:border-amber-700 rounded-lg p-4 text-left">
          <div className="text-sm font-medium text-slate-200">Communication coach</div>
          <div className="text-xs text-slate-500 mt-0.5">STAR, filler, 90-second answers. Use the mic.</div>
        </button>
      </div>
    );
  }

  if (engine === "pick-offline" || engine === "pick-live") {
    const live = engine === "pick-live";
    return (
      <div className="space-y-3">
        <button onClick={() => setEngine(null)} className="text-xs text-slate-500 hover:text-slate-300">← Back</button>
        {MOCK_MODES.map(m => (
          <button key={m.id} onClick={() => { if (live) { setMode(m.id); setEngine("live"); } else startOffline(m.id); }}
            className="w-full bg-slate-900 border border-slate-800 hover:border-amber-700 rounded-lg p-4 text-left transition-colors">
            <div className="text-sm font-medium text-slate-200">{m.label}</div>
            <div className="text-xs text-slate-500 mt-0.5">{m.desc}</div>
          </button>
        ))}
      </div>
    );
  }

  if (engine === "offline") {
    const done = offI >= offPool.length;
    const q = offPool[offI];
    const got = offMarks.filter(v => v === "got").length;
    if (done) {
      saveMockResult(MOCK_MODES.find(m => m.id === mode).label, got, offPool.length);
      return (
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-5 space-y-3">
          <h2 className="text-sm font-semibold text-slate-100">Score: {got}/{offPool.length}</h2>
          <p className="text-xs text-slate-400">
            {got >= 6 ? "Solid. Redo the fumbles tomorrow." : "Not interview-ready on this track. Those red cards are tomorrow's only drill."}
          </p>
          {got < offPool.length && go && (
            <button onClick={() => go("drill", { cat: "Fumbled" })}
              className="px-3 py-2 bg-rose-950 border border-rose-900 text-rose-200 text-sm rounded">
              Drill fumbles now
            </button>
          )}
          <button onClick={reset} className="px-4 py-2 bg-amber-500 text-slate-950 text-sm font-medium rounded">Done</button>
        </div>
      );
    }
    return (
      <div className="space-y-3">
        <div className="flex items-center justify-between">
          <span className="font-mono text-[10px] uppercase tracking-widest text-amber-400">
            Offline · {MOCK_MODES.find(m => m.id === mode).label}
          </span>
          <button onClick={reset} className="text-xs text-slate-500">End</button>
        </div>
        <div className="bg-slate-900 border border-slate-800 rounded-lg p-5">
          <div className="font-mono text-[10px] text-slate-600 mb-2">{offI + 1}/{offPool.length} · {q.c}</div>
          <p className="text-base text-slate-100 leading-relaxed mb-4">{q.q}</p>
          {!offShown ? (
            <button onClick={() => setOffShown(true)}
              className="w-full py-2.5 bg-slate-800 text-slate-200 text-sm rounded">Reveal after you speak</button>
          ) : (
            <div className="space-y-3">
              <p className="text-sm text-slate-300 leading-relaxed border-l-2 border-amber-500 pl-3">{q.a}</p>
              <div className="flex gap-2">
                <button onClick={() => markOff("fumbled")}
                  className="flex-1 py-2 bg-rose-950 border border-rose-900 text-rose-200 text-sm rounded">Fumbled</button>
                <button onClick={() => markOff("got")}
                  className="flex-1 py-2 bg-emerald-950 border border-emerald-800 text-emerald-200 text-sm rounded">Nailed</button>
              </div>
            </div>
          )}
        </div>
      </div>
    );
  }

  return null;
}

function Log({ journal, persist, state, persistCore }) {
  const [co, setCo] = useState(""); const [role, setRole] = useState(""); const [variant, setVariant] = useState("PHP/Laravel");

    if (!co.trim()) return;
    persist({ ...journal, apps: [{ co: co.trim(), role: role.trim(), variant, status: "applied", date: new Date().toISOString().slice(0, 10) }, ...journal.apps] });
    setCo(""); setRole("");
  };
  const cycle = (i) => {
    const order = ["applied", "screening", "interview", "final", "offer", "rejected"];
    const next = [...journal.apps];
    next[i] = { ...next[i], status: order[(order.indexOf(next[i].status) + 1) % order.length] };
    persist({ ...journal, apps: next });
  };
  const removeApp = (i) => persist({ ...journal, apps: journal.apps.filter((_, x) => x !== i) });
  const colorFor = (s) => ({
    applied: "text-slate-400", screening: "text-sky-400", interview: "text-amber-400",
    final: "text-violet-400", offer: "text-emerald-400", rejected: "text-slate-600",

    <div className="space-y-5">

/* ---------- OWN IT — systems, claims, STAR (the AI-coding gap) ---------- */
function OwnIt({ state, persist, journal, persistJournal, focus, go }) {
  const [pane, setPane] = useState(focus?.pane || (focus?.systemId ? "systems" : "claims"));
  const [openSys, setOpenSys] = useState(focus?.systemId || null);
  const [openClaim, setOpenClaim] = useState(null);
  const [shown, setShown] = useState(false);
  const sysState = state.systems || {};
  const claimState = state.claims || {};
  const stars = journal.stars || {};

  useEffect(() => {
    if (focus?.systemId) { setPane("systems"); setOpenSys(focus.systemId); }
    if (focus?.pane) setPane(focus.pane);
  }, [focus]);

  const patchSys = (id, patch) =>
    persist({ ...state, systems: { ...sysState, [id]: { ...(sysState[id] || {}), ...patch } } });
  const markClaim = (id, val) =>
    persist({ ...state, claims: { ...claimState, [id]: val } });
  const saveStar = (id, text) =>
    persistJournal({ ...journal, stars: { ...stars, [id]: text } });

  const sysDone = SYSTEMS.filter(s => sysState[s.id]?.recorded).length;
  const claimGot = CLAIMS.filter(c => claimState[c.id] === "got").length;
  const starDone = STARS.filter(s => (stars[s.id] || "").trim().length > 40).length;

  return (
    <div className="space-y-4">
      <div className="bg-slate-900 border border-slate-800 rounded-lg p-4">
        <p className="text-xs text-slate-300 leading-relaxed">
          This tab closes the gap that can fail you: 10 years on the CV, AI-assisted year, rusty PHP.
          If you cannot walk a system or defend a bullet without looking at the repo, that bullet is a liability. Say it aloud.
        </p>
        <div className="mt-3 flex flex-wrap gap-x-3 gap-y-1 font-mono text-[10px] text-slate-500">
          <span>{sysDone}/{SYSTEMS.length} systems recorded</span>
          <span>{claimGot}/{CLAIMS.length} claims owned</span>
          <span>{starDone}/{STARS.length} STAR drafts</span>
        </div>
        <div className="mt-3 pt-3 border-t border-slate-800 space-y-3">
          <InterviewQaLinks compact />
          <PlaybookLinks compact />
        </div>
      </div>

      <div className="flex gap-1.5">
        {[["claims", "Resume claims"], ["systems", "Systems"], ["stars", "STAR stories"]].map(([id, label]) => (
          <button key={id} onClick={() => setPane(id)}
            className={`px-2.5 py-1 rounded text-xs font-medium ${
              pane === id ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800"}`}>
            {label}
          </button>
        ))}
      </div>

      {pane === "claims" && CLAIMS.map(c => {
        const mark = claimState[c.id];
        const open = openClaim === c.id;
        return (
          <div key={c.id} className="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
            <button onClick={() => { setOpenClaim(open ? null : c.id); setShown(false); }}
              className="w-full flex items-center gap-3 px-4 py-3 text-left">
              <span className={`w-2 h-2 rounded-full shrink-0 ${
                mark === "got" ? "bg-emerald-400" : mark === "fumbled" ? "bg-rose-400" : "bg-slate-600"}`} />
              <span className="flex-1 text-sm text-slate-200">{c.claim}</span>
              <span className="font-mono text-[10px] text-slate-600">{c.stack}</span>
            </button>
            {open && (
              <div className="border-t border-slate-800 px-4 py-4 space-y-3">
                <p className="text-sm text-amber-100 leading-relaxed">{c.probe}</p>
                <p className="text-xs text-slate-500 italic">Close the laptop. Answer out loud for 90 seconds. Then reveal.</p>
                {!shown ? (
                  <button onClick={() => setShown(true)}
                    className="w-full py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded">
                    I said it — reveal model answer
                  </button>
                ) : (
                  <div className="space-y-3">
                    <div className="bg-slate-950 border-l-2 border-emerald-500 rounded-r px-4 py-3 space-y-2">
                      <div className="font-mono text-[10px] uppercase tracking-widest text-emerald-400">Model answer</div>
                      <p className="text-sm text-slate-300 leading-relaxed">{c.a}</p>
                    </div>
                    <div className="bg-slate-950 border-l-2 border-amber-500 rounded-r px-4 py-3 space-y-2">

                      <p className="text-sm text-slate-400 leading-relaxed">{c.x}</p>
                    </div>
                    <div className="flex gap-2">
                      <button onClick={() => { markClaim(c.id, "fumbled"); setOpenClaim(null); setShown(false); }}
                        className="flex-1 py-2 bg-rose-950 border border-rose-900 text-rose-200 text-sm rounded">Fumbled</button>
                      <button onClick={() => { markClaim(c.id, "got"); setOpenClaim(null); setShown(false); }}
                        className="flex-1 py-2 bg-emerald-950 border border-emerald-800 text-emerald-200 text-sm rounded">I own this</button>
                    </div>

      {pane === "systems" && SYSTEMS.map(s => {
        const st = sysState[s.id] || {};
        const open = openSys === s.id;
        return (
          <div key={s.id} className="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
            <button onClick={() => setOpenSys(open ? null : s.id)}
              className="w-full flex items-center justify-between px-4 py-3 text-left">
              <div>
                <div className="text-sm text-slate-200">{s.t}</div>
                <div className="font-mono text-[10px] text-slate-600">{s.stack} · {s.mins} min</div>
              </div>
              <span className="font-mono text-[10px] text-slate-500">
                {[st.drawn && "drawn", st.recorded && "recorded"].filter(Boolean).join(" · ") || "unrehearsed"}

            {open && (
              <div className="border-t border-slate-800 px-4 py-4 space-y-3 text-sm text-slate-300">
                <div>

                  <div className="font-mono text-[10px] uppercase tracking-widest text-slate-500 mb-1">Draw these boxes</div>
                  <p className="leading-relaxed">{s.boxes.join(" → ")}</p>
                </div>
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-widest text-slate-500 mb-1">Core tables</div>
                  <p className="leading-relaxed">{s.tables.join(" · ")}</p>
                </div>
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-widest text-slate-500 mb-1">Hard decision</div>
                  <p className="leading-relaxed">{s.decision}</p>
                </div>
                <div className="bg-amber-950 border-l-2 border-amber-500 rounded-r px-3 py-2.5">
                  <p className="text-xs text-amber-100 leading-relaxed">{s.probe}</p>
                </div>
                <p className="text-xs text-slate-500">Template: problem → boxes → data model → one decision → one failure → what you'd change.</p>
                <div className="flex gap-2">
                  <button onClick={() => patchSys(s.id, { drawn: !st.drawn })}
                    className={`flex-1 py-2 text-xs rounded border ${st.drawn ? "border-emerald-700 text-emerald-300" : "border-slate-700 text-slate-400"}`}>
                    Drew it
                  </button>
                  <button onClick={() => patchSys(s.id, { recorded: !st.recorded })}
                    className={`flex-1 py-2 text-xs rounded border ${st.recorded ? "border-emerald-700 text-emerald-300" : "border-slate-700 text-slate-400"}`}>
                    Recorded 6 min
                  </button>
                </div>
              </div>
            )}
          </div>
        );
      })}

      {pane === "stars" && STARS.map(s => (
        <div key={s.id} className="bg-slate-900 border border-slate-800 rounded-lg p-4 space-y-2">
          <div className="text-sm font-medium text-slate-200">{s.t}</div>
          <p className="text-xs text-amber-300 leading-relaxed">{s.hint}</p>
          <textarea
            value={stars[s.id] || ""}
            onChange={e => saveStar(s.id, e.target.value)}
            rows={4}
            placeholder="S — T — A — R. Write it in your words. Recited answers sound recited."
            className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-700" />
        </div>
      ))}
    </div>
  );
}

/* ---------- LEARN ---------- */
function Learn({ state, persist, focus, go }) {
  const cats = Array.from(new Set(LESSONS.map(l => l.cat)));
  const start = focus?.lessonId ? LESSONS.find(l => l.id === focus.lessonId) : null;
  const [cat, setCat] = useState(start ? start.cat : cats[0]);
  const [openId, setOpenId] = useState(start ? start.id : null);
  const [showBn, setShowBn] = useState(true);
  const read = state.lessons || {};

  useEffect(() => {
    if (!focus?.lessonId) return;
    const l = LESSONS.find(x => x.id === focus.lessonId);
    if (l) { setCat(l.cat); setOpenId(l.id); }
  }, [focus]);

  const toggleRead = (id) =>
    persist({ ...state, lessons: { ...read, [id]: !read[id] } });

  const pool = LESSONS.filter(l => l.cat === cat);

  return (
    <div className="space-y-4">
      <div className="flex gap-1.5 flex-wrap">
        {cats.map(c => {
          const done = LESSONS.filter(l => l.cat === c && read[l.id]).length;
          const total = LESSONS.filter(l => l.cat === c).length;
          return (
            <button key={c} onClick={() => { setCat(c); setOpenId(null); }}
              className={`px-2.5 py-1 rounded text-xs font-medium transition-colors ${
                cat === c ? "bg-amber-500 text-slate-950" : "bg-slate-900 text-slate-400 border border-slate-800 hover:border-slate-700"}`}>
              {c} <span className="font-mono opacity-70">{done}/{total}</span>
            </button>
          );
        })}
      </div>

      {pool.map(l => (
        <div key={l.id} className="bg-slate-900 border border-slate-800 rounded-lg overflow-hidden">
          <div className="flex items-center gap-3 px-4 py-3">
            <button onClick={() => toggleRead(l.id)}
              className={`w-5 h-5 rounded border flex items-center justify-center shrink-0 ${
                read[l.id] ? "bg-emerald-500 border-emerald-500" : "border-slate-600 hover:border-slate-500"}`}
              aria-label="Mark as read">
              {read[l.id] && <Check className="w-3 h-3 text-slate-950" />}
            </button>
            <button onClick={() => setOpenId(openId === l.id ? null : l.id)}
              className="flex-1 flex items-center justify-between text-left min-w-0 gap-2">
              <span className="text-sm text-slate-200">{l.t}</span>
              <span className="font-mono text-[10px] text-slate-600 shrink-0">{l.min} min</span>
            </button>
          </div>

          {openId === l.id && (
            <div className="border-t border-slate-800 px-4 py-4 space-y-3.5">
              <div className="flex items-center justify-between">
                <span className="font-mono text-[10px] uppercase tracking-widest text-slate-600">{l.cat}</span>
                <button onClick={() => setShowBn(!showBn)}
                  className={`px-2 py-0.5 rounded text-[11px] font-medium transition-colors ${
                    showBn ? "bg-emerald-900 text-emerald-200 border border-emerald-800"
                           : "bg-slate-800 text-slate-400 border border-slate-700"}`}>
                  {showBn ? "বাংলা চালু" : "বাংলা বন্ধ"}
                </button>
              </div>

              {showBn && l.bn && (
                <div className="bg-slate-950 border border-emerald-900 rounded p-3.5">
                  <div className="font-mono text-[10px] uppercase tracking-widest text-emerald-500 mb-2">
                    ধারণাটি সংক্ষেপে
                  </div>
                  <p className="text-sm text-slate-200 leading-loose">{l.bn}</p>
                </div>
              )}

              {l.body.map((b, i) => {
                if (b.h) return <h4 key={i} className="text-sm font-semibold text-amber-400 pt-1">{b.h}</h4>;
                if (b.p) return <p key={i} className="text-sm text-slate-300 leading-relaxed">{b.p}</p>;
                if (b.list) return (
                  <ul key={i} className="space-y-1.5">
                    {b.list.map((x, j) => (
                      <li key={j} className="text-sm text-slate-300 leading-relaxed flex gap-2">
                        <span className="text-slate-600 shrink-0">·</span><span>{x}</span>
                      </li>
                    ))}
                  </ul>
                );
                if (b.code) return (
                  <pre key={i} className="bg-slate-950 border border-slate-800 rounded p-3 overflow-x-auto">
                    <code className="font-mono text-xs text-slate-300 whitespace-pre">{b.code}</code>
                  </pre>
                );
                if (b.tip) return (
                  <div key={i} className="bg-amber-950 border-l-2 border-amber-500 rounded-r px-3 py-2.5 flex gap-2">
                    <Target className="w-3.5 h-3.5 text-amber-400 mt-0.5 shrink-0" />
                    <p className="text-xs text-amber-100 leading-relaxed">{b.tip}</p>
                  </div>
                );
                return null;
              })}

              <div className="pt-2 border-t border-slate-800 space-y-2.5">
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-widest text-slate-500 mb-1.5">Do this</div>
                  <p className="text-sm text-emerald-200 leading-relaxed">{l.drill}</p>
                </div>
                {go && (
                  <button onClick={() => go("mock", { live: "topic", lessonId: l.id })}
                    className="w-full py-2 bg-sky-950 border border-sky-800 hover:border-sky-600 text-sky-200 text-sm rounded">
                    Coach me on this topic (live)
                  </button>
                )}
                <div>
                  <div className="font-mono text-[10px] uppercase tracking-widest text-slate-500 mb-1.5">Reference (optional)</div>
                  <div className="space-y-1">
                    {l.docs.map((d, i) => (
                      <a key={i} href={d.u} target="_blank" rel="noopener noreferrer"
                        className="text-xs text-sky-400 hover:text-sky-300 flex items-center gap-1.5">
                        <ExternalLink className="w-3 h-3 shrink-0" />{d.l}
                      </a>
                    ))}
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      ))}
    </div>
  );
}


/* ---------- SETTINGS ---------- */
function SettingsView({ apiKey, setApiKey, state, journal, persistCore, persistJournal }) {
  const [draft, setDraft] = useState(apiKey);
  const [saved, setSaved] = useState(false);
  const keyCount = parseGeminiKeys(draft).length;

  const save = () => {
    const v = draft.trim();
    saveGeminiKeysRaw(v);
    setApiKey(v);
    setSaved(true);
    setTimeout(() => setSaved(false), 2000);
  };

  const exportData = () => {
    const blob = new Blob([JSON.stringify({ core: state, journal }, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = "prep-backup-" + new Date().toISOString().slice(0, 10) + ".json";
    a.click();
    URL.revokeObjectURL(url);
  };

  const importData = (e) => {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if (parsed.core) persistCore(parsed.core);
        if (parsed.journal) persistJournal(parsed.journal);
      } catch (err) { alert("That file isn't a valid backup."); }
    };
    reader.readAsText(file);
  };

  return (
    <div className="space-y-4">
      <section className="bg-slate-900 border border-slate-800 rounded-lg p-5">
        <h3 className="text-sm font-semibold text-slate-100 mb-2">Track</h3>
        <p className="text-xs text-slate-400 leading-relaxed mb-3">
          30-day sprint is the default — apply from day 1, own your systems, cut Vue/Nuxt/.NET depth unless an interview lands.
          Switch to 60-day only if you have the extra month. Day numbers mean different syllabi; progress checkboxes stay.
        </p>
        <div className="flex gap-2">
          {Object.values(TRACKS).map(t => (
            <button key={t.id} onClick={() => persistCore({ ...state, track: t.id })}
              className={`px-3 py-2 text-sm rounded border ${
                (state.track || "sprint") === t.id
                  ? "bg-amber-500 text-slate-950 border-amber-500"
                  : "bg-slate-950 text-slate-400 border-slate-800"}`}>
              {t.label}
            </button>
          ))}
        </div>
      </section>

      <section className="bg-slate-900 border border-slate-800 rounded-lg p-5">
        <h3 className="text-sm font-semibold text-slate-100 mb-2">Gemini API keys (free)</h3>
        <p className="text-xs text-slate-400 leading-relaxed mb-3">
          One key per line (different Google accounts). When one hits the free limit, the next is tried automatically.
          Get keys at aistudio.google.com/apikey. On shared hosting, put them in config.php as gemini_keys instead.
        </p>
        <textarea value={draft} onChange={e => setDraft(e.target.value)} rows={4}
          placeholder={"AIza...account-one\nAIza...account-two\nAIza...account-three"}
          className="w-full bg-slate-950 border border-slate-800 rounded px-3 py-2 text-sm font-mono text-slate-200 placeholder-slate-600 focus:outline-none focus:border-amber-700" />
        <div className="flex items-center justify-between gap-2 mt-2">
          <span className="text-xs text-slate-600">{keyCount ? keyCount + " key(s) — rotates on limit" : "No keys saved yet"}</span>
          <button onClick={save} className="px-4 py-2 bg-amber-500 hover:bg-amber-400 text-slate-950 text-sm font-medium rounded transition-colors">
            {saved ? "Saved" : "Save"}
          </button>
        </div>
        <p className="text-xs text-slate-600 mt-2">Stored in this browser only. Password-protect the subdomain.</p>
      </section>

      <section className="bg-slate-900 border border-slate-800 rounded-lg p-5">
        <h3 className="text-sm font-semibold text-slate-100 mb-2">Backup your progress</h3>
        <p className="text-xs text-slate-400 leading-relaxed mb-3">
          Progress lives in this browser. Clearing site data wipes it. Export weekly, and import to move between phone and laptop.
        </p>
        <div className="flex gap-2 flex-wrap">
          <button onClick={exportData} className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded transition-colors">Export backup</button>
          <label className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded cursor-pointer transition-colors">
            Import backup
            <input type="file" accept="application/json" onChange={importData} className="hidden" />
          </label>
        </div>
      </section>

      <section className="bg-slate-900 border border-slate-800 rounded-lg p-5">
        <h3 className="text-sm font-semibold text-slate-100 mb-2">Install on your phone</h3>
        <ol className="text-xs text-slate-400 space-y-1.5 leading-relaxed list-decimal list-inside">
          <li>Open this page in Chrome or Safari on your phone.</li>
          <li>Chrome: menu, then Add to Home screen. Safari: Share, then Add to Home Screen.</li>
          <li>It opens full-screen like an app, and progress stays on that device.</li>
          <li>After an update: remove the old home-screen icon, tap Force refresh below, then add again.</li>
        </ol>
      </section>

      <section className="bg-slate-900 border border-slate-800 rounded-lg p-5">
        <h3 className="text-sm font-semibold text-slate-100 mb-2">App version</h3>
        <p className="text-xs text-slate-400 leading-relaxed mb-3">
          Build <span className="font-mono text-slate-300">{APP_BUILD}</span>. If phone/PWA still looks old, force a fresh download.
        </p>
        <button
          type="button"
          onClick={async () => {
            try {
              if ("serviceWorker" in navigator) {
                const regs = await navigator.serviceWorker.getRegistrations();
                await Promise.all(regs.map(r => r.unregister()));
              }
              if ("caches" in window) {
                const keys = await caches.keys();
                await Promise.all(keys.map(k => caches.delete(k)));
              }
            } catch (err) { /* ignore */ }
            try { localStorage.removeItem("prep-app-version"); } catch (err) { /* ignore */ }
            window.location.href = window.location.pathname + "?v=" + Date.now();
          }}
          className="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded transition-colors">
          Force refresh app
        </button>
      </section>
    </div>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
<script>
(function () {
  var BUILD = "2026.08.24.2";
  if ("serviceWorker" in navigator) {
    navigator.serviceWorker.register("./sw.js?v=" + BUILD).then(function (reg) {
      reg.update();
    }).catch(function () {});
  }
})();
</script>
</body>
</html>
