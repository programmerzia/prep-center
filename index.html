{ id:"php-1", cat:"PHP", t:"Modern PHP 8.x — what changed while you were away", min:8,
 bn:"PHP ৮-এ যেসব পরিবর্তন এসেছে সেগুলো কঠিন কিছু নয়, কিন্তু ইন্টারভিউয়ার এগুলো দিয়ে যাচাই করেন আপনি বর্তমান কিনা। সবচেয়ে গুরুত্বপূর্ণ হলো enum — এটি স্ট্যাটাস বা ফিক্সড ভ্যালুর জন্য constant-এর চেয়ে অনেক নিরাপদ, কারণ এটি একটি আসল টাইপ এবং এর ভেতরে মেথডও রাখা যায়। readonly প্রপার্টি দিয়ে DTO সত্যিকারের immutable বানানো যায়। constructor promotion দিয়ে অনেক কোড কমে যায়। আর match হলো switch-এর উন্নত রূপ — এটি strict, ভ্যালু রিটার্ন করে, এবং কোনো কেস না মিললে এরর দেয়। ইন্টারভিউতে ফিচারের তালিকা না দিয়ে বলুন এগুলো আপনার কাজে কীভাবে ব্যবহার করেছেন।", body:[
 {p:"You wrote PHP for eight years, then spent a year in C#. The language moved in that time, and interviewers use these features as a proxy for 'is this person current'. None of it is hard — it's mostly ergonomics you'll adopt in an afternoon."},
 {h:"Constructor property promotion"},
 {p:"Declare and assign dependencies in the signature. This alone removes roughly a third of the boilerplate from every service class you write."},
 {code:"class OrderService {\n    public function __construct(\n        private OrderRepository $orders,\n        private PaymentGateway $payments,\n    ) {}\n}"},
 {h:"Enums (8.1) — the big one"},
 {p:"Enums replace the old 'class with constants' pattern, and unlike constants they're a real type the compiler checks. A backed enum has a scalar value; a pure enum has none. They can hold methods and implement interfaces, which means behaviour lives next to the value instead of scattered in if-statements."},
 {code:"enum OrderStatus: string {\n    case Pending = 'pending';\n    case Paid = 'paid';\n    case Cancelled = 'cancelled';\n\n    public function canRefund(): bool {\n        return $this === self::Paid;\n    }\n}\n\n// from() throws on unknown, tryFrom() returns null\n$status = OrderStatus::tryFrom($input) ?? OrderStatus::Pending;"},
 {p:"Laravel casts to enums natively: protected $casts = ['status' => OrderStatus::class]. Once you do this, an invalid status can't physically reach your domain logic."},
 {h:"match, readonly, nullsafe, named arguments"},
 {code:"// match: strict (===), returns a value, no fallthrough, throws if unmatched\n$fee = match($status) {\n    OrderStatus::Pending => 0,\n    OrderStatus::Paid => 250,\n    default => throw new InvalidArgumentException(),\n};\n\n// readonly: assign once, immutable after — perfect for DTOs\nfinal class Money {\n    public function __construct(\n        public readonly int $amount,\n        public readonly string $currency,\n    ) {}\n}\n\n$name = $order?->customer?->name;        // nullsafe\ncreateUser(name: 'Zia', isAdmin: true);  // named arguments"},
 {tip:"When asked 'what's new in PHP 8?', don't list features — tie them to your work: 'Enums replaced my status constants and now carry behaviour; readonly made DTOs genuinely immutable; match replaced most switches because it's strict and returns a value.' That's a senior answer."}],
 docs:[{l:"PHP 8.0/8.1/8.2/8.3 release notes",u:"https://www.php.net/releases/"},{l:"Enumerations manual",u:"https://www.php.net/manual/en/language.enumerations.php"}],
 drill:"Write a small script that models an order with an enum status, a readonly Money value object, and a match expression for fees. No AI." },

{ id:"php-2", cat:"PHP", t:"SOLID, composition, and design that survives interviews", min:9,
 bn:"SOLID মুখস্থ বলার দরকার নেই — বরং নিজের কাজ থেকে উদাহরণ দিয়ে বোঝান। যেমন Open/Closed মানে নতুন পেমেন্ট প্রোভাইডার যোগ করতে হলে পুরনো কোড বদলাতে হবে না, শুধু একটি নতুন ক্লাস লিখলেই হবে — এটি interface দিয়ে সম্ভব। Inheritance-এর চেয়ে composition ভালো, কারণ inheritance আপনাকে প্যারেন্ট ক্লাসের সাথে চিরতরে বেঁধে ফেলে। Value object (যেমন Money) immutable হওয়া উচিত, আর entity-র নিজস্ব পরিচয় থাকে যা সময়ের সাথে টিকে থাকে। Specification প্যাটার্ন আপনি Osilion-এ ব্যবহার করেছেন — কারণ ক্যান্ডিডেট ফিল্টারগুলো নানাভাবে মিলিয়ে ব্যবহার করতে হতো।", body:[
 {p:"Nobody wants you to recite the acronym. They want to hear you describe a decision you made using the underlying idea. So learn each principle attached to a concrete example from your own work."},
 {h:"The five, stated usefully"},
 {list:["Single Responsibility — one reason to change. Test: can you describe the class without saying 'and'? A ReportGenerator that also emails reports has two reasons to change.",
 "Open/Closed — extend without editing. In practice: payment providers behind an interface, so adding Nagad was a new class, not an edited switch statement.",
 "Liskov Substitution — a subclass must work anywhere the parent does. Smell: an overridden method that throws 'not supported'.",
 "Interface Segregation — many small interfaces beat one fat one; don't force implementers to stub methods they don't need.",
 "Dependency Inversion — depend on abstractions. High-level policy shouldn't import low-level detail. This is exactly what a DI container exists to enable."]},
 {h:"Composition over inheritance"},
 {p:"Inheritance couples you to a parent's implementation permanently — change the parent, break every child. Composition (injecting collaborators) stays flexible. PHP traits sit awkwardly between the two: convenient, but they hide dependencies (a trait calling $this->something it doesn't own) and cause collision confusion. Use them for genuinely small cross-cutting behaviour, not as a substitute for design."},
 {h:"Value objects, entities, DTOs"},
 {p:"An entity has identity that persists — Customer #42 remains that customer after every field changes. A value object is defined entirely by its values and should be immutable: Money, DateRange, EmailAddress. Modelling Money as a value object with a currency prevents an entire class of bug, because you can no longer accidentally add BDT to NOK. A DTO is a plain data carrier between layers; with readonly classes they're now trivial to write."},
 {h:"Patterns worth one sentence each"},
 {list:["Strategy — swap an algorithm behind an interface (payment providers, shipping calculators).",
 "Repository — abstract data access behind a collection-like interface.",
 "Factory — encapsulate complex construction.",
 "Observer — publish/subscribe; Laravel events are this.",
 "Decorator — wrap an object to add behaviour (a caching decorator over a repository).",
 "Adapter — make an incompatible third-party SDK fit your interface.",
 "Specification — encapsulate a query rule as a composable object. You used this at Osilion; know why."]},
 {tip:"Your Specification answer: 'Candidate filters combined in many different ways across use cases. Specifications kept that logic composable and testable, and stopped the repository growing thirty near-duplicate methods.'"}],
 docs:[{l:"PHP-FIG PSR index",u:"https://www.php-fig.org/psr/"},{l:"Refactoring Guru — design patterns in PHP",u:"https://refactoring.guru/design-patterns/php"}],
 drill:"Take a class from an old project with a switch statement choosing behaviour. Refactor it to a strategy interface. Time it — should take 20 minutes." },

{ id:"php-3", cat:"PHP", t:"Memory, generators, and processing real data volumes", min:6,
 bn:"বড় ডেটা প্রসেস করার অভিজ্ঞতা আছে কিনা তা যাচাই করতে এই প্রশ্নগুলো আসে। Generator (yield) ব্যবহার করলে পুরো ডেটাসেট মেমরিতে না রেখে একটি একটি করে প্রসেস করা যায় — বড় CSV ইমপোর্টে এটি অপরিহার্য। Laravel-এ chunk() OFFSET ব্যবহার করে, তাই লুপের ভেতরে ডেটা পরিবর্তন করলে কিছু রেকর্ড বাদ পড়ে যায়; সেজন্য chunkById() নিরাপদ। cursor() ও lazy() সবচেয়ে কম মেমরি ব্যবহার করে। এই পার্থক্যটা বলতে পারা মানে আপনি বাস্তবে বড় ডেটা নিয়ে কাজ করেছেন।", body:[
 {p:"This topic separates people who've handled production data from people who've only handled tutorials. It comes up whenever an interviewer asks about imports, exports, or reports."},
 {h:"Generators"},
 {p:"A function using yield produces values lazily — you never hold the full dataset in memory. Laravel's cursor() and lazy() are built on this."},
 {code:"function readLines(string $path): Generator {\n    $h = fopen($path, 'r');\n    try {\n        while (($line = fgets($h)) !== false) {\n            yield $line;\n        }\n    } finally {\n        fclose($h);\n    }\n}\n\nforeach (readLines('big.csv') as $line) {\n    // memory stays flat regardless of file size\n}"},
 {h:"chunk vs chunkById vs cursor vs lazy"},
 {list:["chunk() — paginates with OFFSET. Dangerous if you modify rows while iterating, because rows shift and you silently skip records.",
 "chunkById() — uses the last id as a cursor. Safe while modifying. Use this for batch updates.",
 "cursor() — streams one model at a time from a single query. Lowest memory, but holds the DB connection open.",
 "lazy() / lazyById() — generator-backed chunking, the modern default for large reads."]},
 {p:"Knowing this distinction is a genuine signal. Most candidates say 'I'd use chunk' and can't explain the modification trap."},
 {h:"Error handling hierarchy"},
 {p:"Throwable is the root, splitting into Error (engine failures: TypeError, DivisionByZeroError) and Exception (application problems). Catch Throwable only at the top boundary. Custom exceptions per domain concern let you map cleanly to HTTP status codes in one place instead of scattering if-statements."},
 {tip:"Interview story to have ready: 'I processed a large CSV import with a generator and chunkById so memory stayed flat and the job could resume.' Concrete beats abstract every time."}],
 docs:[{l:"PHP generators manual",u:"https://www.php.net/manual/en/language.generators.php"},{l:"Laravel — chunking results",u:"https://laravel.com/docs/eloquent#chunking-results"}],
 drill:"Write a generator that reads a large file and yields parsed rows. Compare memory_get_peak_usage() against loading the whole file with file()." },

/* ================= LARAVEL ================= */
{ id:"lv-1", cat:"Laravel", t:"The request lifecycle — narrate this in 45 seconds", min:7,
 bn:"Laravel ইন্টারভিউয়ের সবচেয়ে সাধারণ প্রথম প্রশ্ন এটি, আর এটি মুখস্থ পরীক্ষা নয় — তারা দেখতে চান আপনি ফ্রেমওয়ার্কটিকে একটি সিস্টেম হিসেবে বোঝেন কিনা। ধারাবাহিকতা: index.php → অটোলোডার → অ্যাপ্লিকেশন (কনটেইনার) তৈরি → কার্নেল বুটস্ট্র্যাপ (সব প্রোভাইডারের register() তারপর boot()) → গ্লোবাল মিডলওয়্যার → রাউটার → রুট মিডলওয়্যার → কন্ট্রোলার → রেসপন্স আবার একই মিডলওয়্যার দিয়ে ফিরে আসে → পাঠানো হয় → terminable মিডলওয়্যার চলে। মূল কথাটি বলুন: মিডলওয়্যার একমুখী পাইপলাইন নয়, এটি পেঁয়াজের মতো — রেসপন্স আবার ফিরে আসে।", body:[
 {p:"This is the single most common opening technical question for a senior Laravel role. It's not testing memorization; it's testing whether you understand the framework as a system rather than a set of helpers. Practice it aloud until it's smooth."},
 {h:"The sequence"},
 {list:["public/index.php receives the request — the single entry point.",
 "Composer autoloader loads.",
 "bootstrap/app.php creates the Application — which is the service container — and binds the HTTP kernel.",
 "The kernel bootstraps: environment, configuration, exception handling, then calls register() on every service provider, then boot() on every service provider.",
 "Global middleware runs (maintenance mode, request size, input trimming).",
 "The router matches the request to a route.",
 "Route and group middleware run (auth, throttle, tenant resolution).",
 "The controller is resolved from the container with its dependencies injected; route-model binding resolves models from route parameters.",
 "The response travels back outward through the same middleware — the onion — and is sent.",
 "Terminable middleware runs after the response has been sent (session writes, logging)."]},
 {h:"Why it matters practically"},
 {p:"Because the order explains real bugs. Middleware order determines whether your tenant is resolved before or after auth. register() running before all providers are loaded is why you must never resolve services there. Terminable middleware exists so analytics don't delay the user's response."},
 {tip:"Say 'the response travels back out through the same middleware — it's an onion, not a pipeline in one direction.' That single sentence tells an interviewer you actually understand it."}],
 docs:[{l:"Laravel — Request Lifecycle",u:"https://laravel.com/docs/lifecycle"},{l:"Laravel — Middleware",u:"https://laravel.com/docs/middleware"}],
 drill:"Close everything and narrate the lifecycle out loud into a voice recorder. Play it back. If you hesitated anywhere, that's the part you don't actually know." },

{ id:"lv-2", cat:"Laravel", t:"The service container and providers", min:8,
 bn:"সার্ভিস কনটেইনার হলো Laravel-এর হৃদয়। এটি constructor-এর type-hint দেখে স্বয়ংক্রিয়ভাবে নির্ভরতা তৈরি করে দেয়। bind মানে প্রতিবার নতুন ইনস্ট্যান্স, singleton মানে পুরো অ্যাপে একটি, scoped মানে প্রতি রিকোয়েস্টে একটি। সাধারণ PHP-তে singleton ও scoped একই আচরণ করে, কিন্তু Octane/Swoole-এ অ্যাপ মেমরিতে থেকে যায় — তখন singleton-এ রাখা রিকোয়েস্ট ডেটা অন্য ইউজারের কাছে ফাঁস হতে পারে। এটি একটি বাস্তব নিরাপত্তা বাগ এবং ইন্টারভিউতে বললে ভালো ছাপ পড়ে। register()-এ শুধু bind করবেন, কোনো সার্ভিস resolve করবেন না।", body:[
 {p:"The container is the heart of Laravel and the thing most mid-level developers use daily without understanding. Owning this topic is what makes you sound senior rather than experienced."},
 {h:"What it actually does"},
 {p:"It's an inversion-of-control container: it constructs objects and resolves their dependencies automatically by reflecting on constructor type-hints. When you type-hint an interface in a controller, the container looks up what that interface is bound to and builds the whole graph for you."},
 {code:"// A binding tells the container how to build something\n$this->app->bind(PaymentGateway::class, BkashGateway::class);\n\n// Lifetimes\n$this->app->bind(X::class, ...);      // new instance every resolution\n$this->app->singleton(X::class, ...); // one instance per app lifecycle\n$this->app->scoped(X::class, ...);    // one per request (matters under Octane)\n$this->app->instance(X::class, $obj); // bind an existing object\n\n// Contextual binding — different implementation per consumer\n$this->app->when(ReportController::class)\n          ->needs(Filesystem::class)\n          ->give(fn() => Storage::disk('s3'));"},
 {h:"scoped vs singleton — the Octane trap"},
 {p:"Normally PHP is shared-nothing: every request starts fresh, so singleton and scoped behave identically. Under Octane/Swoole/RoadRunner the application stays in memory between requests — and then a singleton holding request state leaks it across users. That's a genuine production security bug, and mentioning it marks you out."},
 {h:"Service providers"},
 {p:"register() only binds things. You must not resolve services there, because other providers may not have registered yet. boot() runs after every provider has registered, so it's safe to use other services: routes, view composers, policies, macros, event listeners. Deferred providers implement DeferrableProvider and only load when their binding is actually requested."},
 {h:"Facades — the trap question"},
 {p:"'Aren't facades an anti-pattern?' The balanced answer: they're syntactic sugar over container resolution and they're mockable (Cache::shouldReceive), so they avoid the classic global-state testing problem. But in domain-heavy classes, inject dependencies explicitly, because then the constructor documents what the class actually needs. Showing both sides is the point."},
 {tip:"Bridge to your .NET year if it comes up: Laravel's container is ASP.NET Core's DI container — bind ≈ transient, singleton ≈ singleton, scoped ≈ scoped. You've now used both."}],
 docs:[{l:"Laravel — Service Container",u:"https://laravel.com/docs/container"},{l:"Laravel — Service Providers",u:"https://laravel.com/docs/providers"},{l:"Laravel Octane concurrency caveats",u:"https://laravel.com/docs/octane"}],
 drill:"In a fresh Laravel app: define an interface, two implementations, bind one in a provider, inject it into a controller, then swap the binding and confirm behaviour changes with no controller edit." },

{ id:"lv-3", cat:"Laravel", t:"Eloquent — relationships, N+1, and query performance", min:12,
 bn:"Eloquent নিয়ে সবচেয়ে বেশি প্রশ্ন হয়। N+1 সমস্যা হলো — লুপের ভেতরে রিলেশন লোড করলে ১+N টি কোয়েরি চলে। ধরার সবচেয়ে ভালো উপায় preventLazyLoading() যা ডেভেলপমেন্টে সাথে সাথে এরর দেয়। সমাধান: with() দিয়ে eager load, withCount() দিয়ে গণনা, বা প্রয়োজনে join। ট্রানজেকশনের ভেতরে queue job dispatch করলে commit-এর আগেই সেটি চলে যেতে পারে — তাই afterCommit() ব্যবহার করুন। ডাবল বুকিং ঠেকাতে তিনটি উপায়: lockForUpdate, ডেটাবেজে unique constraint, অথবা version কলাম দিয়ে optimistic locking — এর মধ্যে ডেটাবেজ constraint সবচেয়ে নির্ভরযোগ্য।", body:[
 {p:"Expect to spend more interview time here than anywhere else in Laravel. Everything below is production knowledge, not trivia."},
 {h:"The N+1 problem"},
 {code:"// 1 + N queries — the classic bug\nforeach (Order::all() as $order) {\n    echo $order->customer->name;\n}\n\n// 2 queries\nforeach (Order::with('customer')->get() as $order) {\n    echo $order->customer->name;\n}"},
 {p:"Detection is the part interviewers care about. Debugbar and Telescope show query counts, but the strongest answer is preventLazyLoading — it throws an exception the moment lazy loading happens in development, so the bug can never reach production."},
 {code:"// AppServiceProvider::boot()\nModel::preventLazyLoading(! app()->isProduction());"},
 {p:"Fixes: with() to eager load, load()/loadMissing() after the fact, withCount() when you only need a count, constrained eager loads with(['orders' => fn($q) => $q->where('status','paid')]), and a join when you must filter by the related table."},
 {h:"with() vs join()"},
 {p:"with() runs a second query and hydrates related models — no row duplication, clean object graph, easy to reason about. join() produces one flat query — necessary when you must filter or sort by a related column, or aggregate across tables. Pick with() for normal reads and join() when SQL-level filtering is required."},
 {h:"Transactions and the gotchas"},
 {code:"DB::transaction(function () use ($data) {\n    $order = Order::create($data);\n    $order->items()->createMany($data['items']);\n    $product->decrement('stock', $qty);\n});"},
 {list:["A queue job dispatched inside a transaction can execute before the commit — use ->afterCommit() or set after_commit on the connection.",
 "Nested transactions use savepoints, not real nested transactions.",
 "Long transactions hold locks — keep them short.",
 "lockForUpdate() inside a transaction is the fix for the stock and double-booking race."]},
 {h:"Preventing a double booking"},
 {p:"Three legitimate answers, and the best interviews want you to compare them: pessimistic locking (SELECT ... FOR UPDATE so the second request blocks), a unique database constraint on (resource_id, slot) so the DB itself rejects duplicates, or optimistic locking with a version column and a retry. The database constraint is the one that never lies, because it holds even if a future developer forgets the application logic."},
 {h:"Model events don't always fire"},
 {p:"Model::where(...)->update() bypasses Eloquent events and observers entirely — so audit logs, cache invalidation and search indexing silently don't run. If something must always happen, enforce it in the database or route all writes through a service. Saying this out loud signals real production scars."},
 {h:"Query optimization checklist"},
 {list:["Select only the columns you need, especially with large text columns.",
 "Index the columns used in WHERE, JOIN and ORDER BY.",
 "Prefer whereRelation or a join over whereHas on very large tables.",
 "Use chunkById or lazy for batches.",
 "withCount instead of loading a relation just to count it.",
 "Cache expensive aggregations rather than optimizing them forever."]}],
 docs:[{l:"Eloquent — Relationships",u:"https://laravel.com/docs/eloquent-relationships"},{l:"Eloquent — Preventing lazy loading",u:"https://laravel.com/docs/eloquent-relationships#preventing-lazy-loading"},{l:"Laravel — Database transactions",u:"https://laravel.com/docs/database#database-transactions"}],
 drill:"Build Customers/Orders/Products with relations. Write a page that triggers an N+1. Turn on preventLazyLoading, watch it throw, fix it three different ways, and compare the query count each time." },

{ id:"lv-4", cat:"Laravel", t:"APIs: Resources, validation, pagination, versioning", min:9,
 bn:"API বানানোর সময় Resource ব্যবহার করা জরুরি, কারণ এটি ডেটাবেজের গঠন আর API-র চুক্তিকে আলাদা রাখে — নতুন কলাম যোগ করলে সেটি ভুল করে বাইরে চলে যায় না। Form Request দিয়ে ভ্যালিডেশন ও অনুমোদন কন্ট্রোলার থেকে সরিয়ে ফেলুন। পেজিনেশনে paginate() মোট সংখ্যা গুনতে গিয়ে বড় টেবিলে ধীর হয়ে যায়; cursorPaginate() অনেক দ্রুত কারণ এটি ইনডেক্স ব্যবহার করে এবং গভীর পেজেও গতি কমে না। OFFSET ধীর হয় কারণ ডেটাবেজকে বাদ দেওয়া প্রতিটি সারি পড়ে ফেলতে হয়।", body:[
 {h:"Form Requests"},
 {p:"Move validation and authorization out of the controller. authorize() answers 'may this user do this', rules() answers 'is this input valid'. For API requests Laravel returns 422 with a structured error body automatically."},
 {code:"class StoreOrderRequest extends FormRequest {\n    public function authorize(): bool {\n        return $this->user()->can('create', Order::class);\n    }\n\n    public function rules(): array {\n        return [\n            'customer_id'       => ['required', 'exists:customers,id'],\n            'items'             => ['required', 'array', 'min:1'],\n            'items.*.product_id'=> ['required', 'exists:products,id'],\n            'items.*.qty'       => ['required', 'integer', 'min:1'],\n        ];\n    }\n\n    protected function prepareForValidation(): void {\n        $this->merge(['customer_id' => (int) $this->customer_id]);\n    }\n}"},
 {h:"API Resources"},
 {p:"These are the boundary between your database shape and your public API contract. Without them you leak columns you never meant to expose, and every schema change breaks clients. whenLoaded() also stops your serializer silently triggering N+1 queries."},
 {code:"class OrderResource extends JsonResource {\n    public function toArray($request): array {\n        return [\n            'id'          => $this->id,\n            'status'      => $this->status->value,\n            'total'       => (string) $this->total,\n            'customer'    => new CustomerResource($this->whenLoaded('customer')),\n            'items_count' => $this->whenCounted('items'),\n        ];\n    }\n}"},
 {h:"Pagination — know why offset degrades"},
 {list:["paginate() runs a COUNT for total pages. Accurate, but expensive on large tables.",
 "simplePaginate() skips the count — next/previous only.",
 "cursorPaginate() is keyset-based: stable under inserts and fast at any depth, ideal for infinite scroll."]},
 {p:"Offset pagination degrades because the database must scan and discard every skipped row — page 1000 means reading 20,000 rows to return 20. Keyset pagination filters by 'id greater than cursor' and uses the index directly."},
 {h:"Status codes and error shape"},
 {p:"200/201/204, 400 vs 422 (malformed vs failed validation), 401 vs 403 (not authenticated vs not permitted), 404, 409 for conflicts, 429 rate limited, 500. Standardize one error envelope across the API and map exceptions to codes in the exception handler rather than in every controller."},
 {h:"Versioning"},
 {p:"URI versioning (/api/v1/) is the pragmatic default. What matters in the answer isn't the mechanism — it's that you version because clients break, and that you deprecate with a published timeline rather than silently."}],
 docs:[{l:"Eloquent — API Resources",u:"https://laravel.com/docs/eloquent-resources"},{l:"Laravel — Validation",u:"https://laravel.com/docs/validation"},{l:"Laravel — Pagination",u:"https://laravel.com/docs/pagination"}],
 drill:"Add Resources, Form Requests and cursor pagination to the API you built. Confirm the JSON shape doesn't change when you add a database column." },

{ id:"lv-5", cat:"Laravel", t:"Queues, jobs, events — and the two production truths", min:10,
 bn:"কিউ ব্যবহার করা হয় ধীর বা ঝুঁকিপূর্ণ কাজ রিকোয়েস্ট থেকে সরিয়ে দিতে — ইমেইল, SMS, PDF, তৃতীয় পক্ষের API কল। দুটি বাস্তব সত্য মনে রাখবেন। এক: একটি জব দুবার চলতে পারে (worker মরে গেলে), তাই প্রতিটি জব idempotent বানাতে হবে — কাজ করার আগে অবস্থা যাচাই করুন। দুই: worker আপনার কোড মেমরিতে ধরে রাখে, তাই প্রতিটি ডিপ্লয়ের পর queue:restart চালাতেই হবে, নইলে পুরনো কোড চলতে থাকবে। এই দুটি কথা বললেই বোঝা যায় আপনি প্রোডাকশনে কিউ চালিয়েছেন।", body:[
 {p:"Anything slow or failure-prone belongs off the request cycle: email, SMS, PDFs, imports, third-party API calls, image processing. Your CoreBari SMS spine and the Osilion lead-gen email delivery are both exactly this — use them as examples."},
 {h:"How it works"},
 {p:"A job is serialized and pushed to a driver (Redis, database, SQS). A separate worker process pulls and executes it. Key knobs: $tries, backoff() for exponential delay, $timeout, retryUntil(), a failed() hook plus the failed_jobs table, and ShouldBeUnique to stop concurrent duplicates."},
 {code:"class SendOrderConfirmation implements ShouldQueue {\n    public int $tries = 3;\n    public int $timeout = 30;\n\n    public function __construct(public int $orderId) {}\n\n    public function backoff(): array {\n        return [10, 60, 300]; // exponential-ish\n    }\n\n    public function handle(Mailer $mailer): void {\n        $order = Order::find($this->orderId);\n        if (! $order || $order->confirmation_sent_at) {\n            return; // idempotent: safe to run twice\n        }\n        $mailer->send(...);\n        $order->update(['confirmation_sent_at' => now()]);\n    }\n}"},
 {h:"Truth 1 — jobs can run twice"},
 {p:"A worker can die after doing the work but before acknowledging it. Therefore every job must be idempotent: check state before acting, use a unique key, and prefer setting a value over incrementing one. Never assume exactly-once delivery — it doesn't exist."},
 {h:"Truth 2 — workers hold your code in memory"},
 {p:"After every deploy you must run queue:restart, or workers keep executing yesterday's code against today's database. This one sentence convinces interviewers you've actually operated queues in production."},
 {h:"Batches, chains, scheduling"},
 {p:"Bus::batch() groups jobs with progress tracking and a completion callback; Bus::chain() runs them in sequence where each depends on the last. For scheduling, one cron entry runs schedule:run every minute; use withoutOverlapping() and onOneServer() when you have multiple servers, and have scheduled tasks dispatch jobs rather than doing work inline."},
 {h:"Events vs direct calls"},
 {p:"Events are for genuine fan-out — OrderPlaced triggers email, stock decrement and analytics, and adding a fourth reaction shouldn't modify checkout. A direct service call is right when the step is required and singular. Overusing events makes control flow untraceable; saying that shows judgement rather than enthusiasm."}],
 docs:[{l:"Laravel — Queues",u:"https://laravel.com/docs/queues"},{l:"Laravel — Events",u:"https://laravel.com/docs/events"},{l:"Laravel Horizon",u:"https://laravel.com/docs/horizon"}],
 drill:"Write a queued job that is genuinely idempotent. Run it twice manually and prove nothing duplicates. Then kill the worker mid-job and watch the retry." },

{ id:"lv-6", cat:"Laravel", t:"Auth, authorization, and multi-tenancy", min:9,
 bn:"অথেনটিকেশনের জন্য Sanctum সাধারণত সঠিক পছন্দ — SPA-র জন্য কুকি, মোবাইলের জন্য টোকেন। Passport শুধু তখন যখন তৃতীয় পক্ষ আপনার সিস্টেমে OAuth দিয়ে লগইন করবে। JWT স্টেটলেস ও স্কেলেবল, কিন্তু বাতিল করা কঠিন — তাই স্বল্পমেয়াদী access token ও ঘূর্ণায়মান refresh token ব্যবহার করুন। মাল্টি-টেন্যান্সির চারটি মডেল আছে: tenant_id কলাম (সবচেয়ে সস্তা, কিন্তু একটি ভুলে ডেটা ফাঁস), row-level security (ডেটাবেজেই সুরক্ষা, নিরাপদ), স্কিমা প্রতি টেন্যান্ট, এবং ডেটাবেজ প্রতি টেন্যান্ট। CoreBari-তে আপনি শেয়ার্ড ডেটাবেজ বেছেছেন কারণ অ্যাপগুলোর মধ্যে ডেটা শেয়ার করাই ছিল মূল উদ্দেশ্য।", body:[
 {h:"Choosing an auth mechanism"},
 {list:["Sanctum — SPA cookie auth for first-party frontends, or revocable API tokens with abilities for mobile. The default choice.",
 "Passport — a full OAuth2 server. Only when third parties authorize against you.",
 "JWT — stateless and scales across services, but revocation is the hard problem: short-lived access tokens plus rotating refresh tokens with reuse detection."]},
 {p:"You used JWT at Osilion, so be ready for the follow-up: what was your expiry strategy, where was the secret stored (Azure Key Vault), and how would you revoke a compromised token."},
 {h:"Gates vs Policies"},
 {p:"Gates are closures for one-off checks. Policies are a class per model with methods matching actions, auto-discovered by naming convention, and invoked via $this->authorize('update', $order) in controllers or inside Form Requests. Use policies for anything model-shaped."},
 {h:"Multi-tenancy — your strong ground"},
 {p:"Four models, and interviewers want the trade-offs, not a favourite:"},
 {list:["Shared database with a tenant_id column — cheapest and simplest, but one forgotten WHERE clause leaks data across customers. Mitigate with a global scope or middleware-set context.",
 "Shared database with Postgres row-level security — enforcement lives in the database, so application bugs can't leak data. Much safer, slightly more setup.",
 "Schema per tenant — stronger isolation, but migrations must run per schema and that cost grows with tenant count.",
 "Database per tenant — strongest isolation and easiest per-customer restore, heaviest operations. Suits enterprise or regulated customers."]},
 {p:"Your CoreBari answer: shared database with tenant scoping, because the suite shares a Party/Payment/SMS spine across apps and cross-app data was the whole point of the product. The risk you consciously accept is cross-tenant leakage, which is why every query is scoped by default rather than opt-in."},
 {tip:"The strongest sentence you can say here: 'I treat cross-tenant leakage as the top risk in the system, so scoping is the default and opting out has to be explicit.'"}],
 docs:[{l:"Laravel — Sanctum",u:"https://laravel.com/docs/sanctum"},{l:"Laravel — Authorization",u:"https://laravel.com/docs/authorization"},{l:"PostgreSQL row security policies",u:"https://www.postgresql.org/docs/current/ddl-rowsecurity.html"}],
 drill:"Add Sanctum plus a policy so a user can only see their own orders. Then try to access another user's order by ID and confirm you get 403, not 404 leakage." },

{ id:"lv-7", cat:"Laravel", t:"Caching, performance, and diagnosing a slow app", min:8,
 bn:"ক্যাশিংয়ে সবচেয়ে কঠিন অংশ হলো invalidation — কখন পুরনো ডেটা মুছবেন। সহজ সমাধান TTL, আর প্রয়োজন হলে ইভেন্ট-ভিত্তিক বা ভার্সনড কী। ধীর অ্যাপ ঠিক করার প্রশ্নে সবচেয়ে গুরুত্বপূর্ণ উত্তর হলো: আগে মাপুন, অনুমান করবেন না। তারপর ধাপে ধাপে — N+1 ও অনুপস্থিত ইনডেক্স ঠিক করুন (এটাই বাস্তবে ৮০% সমস্যা), তারপর ক্যাশ, তারপর ধীর কাজ কিউতে পাঠান, তারপর config:cache ও OPcache, সবশেষে সার্ভার বাড়ান। শুরুতেই সার্ভার বাড়ানোর কথা বললে খারাপ ছাপ পড়ে।", body:[
 {h:"The patterns"},
 {code:"// read-through, the workhorse\n$stats = Cache::remember('dashboard:'.$tenantId, 300, function () {\n    return $this->expensiveAggregation();\n});\n\n// atomic lock — stop two workers doing the same job\nCache::lock('payout:'.$id, 10)->get(function () {\n    $this->processPayout($id);\n});"},
 {h:"Invalidation — the hard part"},
 {list:["TTL — simplest, and correct whenever staleness is tolerable. Most caching should be this.",
 "Event-based — invalidate on model save. Accurate, more code, and misses mass updates (see the model-events trap).",
 "Versioned keys — bump a version prefix to invalidate a whole group at once.",
 "Cache tags — group invalidation, Redis/Memcached only."]},
 {h:"Diagnosing slowness — the answer they want"},
 {p:"Always start with measurement, never with a guess. Telescope, Debugbar, an APM, EXPLAIN, and browser devtools tell you whether the problem is the database, PHP, an external call, or the frontend. Then fix in this order:"},
 {list:["N+1 queries and missing indexes — this is genuinely 80% of real cases.",
 "Cache expensive reads.",
 "Move slow work to queues.",
 "config:cache, route:cache, view:cache, OPcache, composer install -o.",
 "Only then infrastructure: bigger instances, read replicas, Octane."]},
 {tip:"Never open with 'add more servers'. Opening with 'I'd measure first' is half the marks on this question."},
 {h:"The config:cache trap"},
 {p:"Once configuration is cached, env() returns null outside config files. If you call env() in a service class it works in development and silently breaks in production. Always read through config()."}],
 docs:[{l:"Laravel — Cache",u:"https://laravel.com/docs/cache"},{l:"Laravel — Deployment optimization",u:"https://laravel.com/docs/deployment#optimization"},{l:"Laravel Telescope",u:"https://laravel.com/docs/telescope"}],
 drill:"Cache one endpoint. Measure response time before and after with a real tool, not a guess. Then deliberately break invalidation and observe stale data — so you understand the cost." },

{ id:"lv-8", cat:"Laravel", t:"Symfony and Doctrine — the comparison you'll be asked", min:7,
 bn:"Symfony ও Laravel-এর মূল পার্থক্য: Symfony স্পষ্ট কনফিগারেশন ব্যবহার করে এবং কনটেইনার আগেই কম্পাইল হয়, Laravel কনভেনশন-নির্ভর ও রানটাইমে কাজ করে। আসল গুরুত্বপূর্ণ পার্থক্য ORM-এ: Doctrine হলো Data Mapper — এন্টিটি সাধারণ PHP অবজেক্ট, EntityManager সংরক্ষণ সামলায়; Eloquent হলো Active Record — মডেল নিজেই নিজেকে সেভ করে। Data Mapper জটিল ডোমেইনের জন্য ভালো কারণ ডোমেইন অবজেক্ট ডেটাবেজ সম্পর্কে কিছু জানে না; Active Record সাধারণ CRUD কাজে অনেক দ্রুত। EF Core-ও Data Mapper ঘরানার, তাই আপনার .NET অভিজ্ঞতা এখানে কাজে লাগে।", body:[
 {p:"You have real Symfony experience, so this comes up as soon as it's on your CV. The comparison is also a chance to sound architecturally literate rather than framework-loyal."},
 {h:"Configuration and container"},
 {p:"Symfony is explicit: YAML/PHP configuration, autowiring by type, and a container compiled at build time — faster at runtime and errors surface at compile rather than in production. Laravel is convention-driven with a runtime container — more flexible, faster to start, less upfront ceremony."},
 {h:"Doctrine vs Eloquent — the real distinction"},
 {p:"Doctrine is a Data Mapper: entities are plain PHP objects that know nothing about persistence, an EntityManager handles storage, and a unit of work batches changes until flush(). Eloquent is Active Record: the model knows how to save itself."},
 {p:"The trade-off, stated the way a senior would: Data Mapper keeps domain objects persistence-ignorant, which suits complex domains and genuine DDD, at the cost of ceremony. Active Record is faster to work with and reads beautifully for CRUD-heavy product work, at the cost of coupling your domain model to the database. Neither is better — they suit different problems."},
 {tip:"Tie in your .NET year: EF Core is closer to Doctrine's Data Mapper approach — DbContext is essentially an EntityManager with change tracking. Having used Eloquent, Doctrine and EF Core is a genuinely strong position, because you can talk about the pattern rather than the tool."},
 {h:"The mapping table"},
 {list:["Bundles ↔ Packages","Twig ↔ Blade","Messenger ↔ Queues","Security component ↔ Guards/Policies","Symfony Console ↔ Artisan"]},
 {p:"Worth mentioning: Laravel is built on Symfony components — HttpFoundation, Routing, Console. Knowing that shows you understand the ecosystem's shape rather than treating frameworks as magic."}],
 docs:[{l:"Symfony docs",u:"https://symfony.com/doc/current/index.html"},{l:"Doctrine ORM documentation",u:"https://www.doctrine-project.org/projects/doctrine-orm/en/current/index.html"}],
 drill:"Build one endpoint in Symfony with a Doctrine entity. Notice what you have to do explicitly that Laravel does for you — that list is your interview answer." },

{ id:"fe-1", cat:"Frontend", t:"JavaScript fundamentals they still test", min:9,
 bn:"JavaScript-এর event loop প্রায় সব ফ্রন্টএন্ড ইন্টারভিউতে আসে। নিয়ম: সিনক্রোনাস কোড আগে চলে, তারপর সব microtask (promise) শেষ হয়, তারপর macrotask (setTimeout)। তাই setTimeout 0 দিলেও promise আগে চলবে। Closure মানে ফাংশন তার তৈরি হওয়ার স্কোপ মনে রাখে — debounce ও throttle এর উপরেই দাঁড়িয়ে আছে। forEach-এর ভেতরে await কাজ করে না, for...of বা Promise.all ব্যবহার করুন। AbortController দিয়ে চলমান রিকোয়েস্ট বাতিল করা যায় — সার্চ বক্সে এটি অপরিহার্য।", body:[
 {h:"The event loop"},
 {p:"The most-asked JS question, and the one people fumble. Synchronous code runs on the call stack. Then microtasks — promise callbacks, await continuations, queueMicrotask — drain completely. Only then does the next macrotask run: setTimeout, setInterval, I/O."},
 {code:"console.log('1');\nsetTimeout(() => console.log('2'), 0);\nPromise.resolve().then(() => console.log('3'));\nconsole.log('4');\n\n// 1, 4, 3, 2\n// Microtasks always beat timers — even a 0ms timer."},
 {p:"Be ready to explain why, not just recite the order. 'A 0ms timeout is a macrotask, and the entire microtask queue drains before any macrotask runs.'"},
 {h:"Closures"},
 {p:"A function retaining access to its defining scope after that scope has returned. It's the mechanism behind private state, memoization, and every debounce or throttle implementation you'll ever write in an interview."},
 {h:"this binding"},
 {list:["Method call — the object before the dot.","Plain function call — undefined in strict mode.","Arrow function — lexical, inherited from where it was defined, cannot be rebound.","call/apply/bind — explicit.","new — the freshly constructed instance."]},
 {h:"Promise combinators"},
 {p:"Promise.all rejects as soon as any input rejects — use it when you need everything. allSettled waits for all and reports each outcome — use it when partial success is acceptable, like sending 50 emails. race resolves with the first settled. any resolves with the first fulfilled."},
 {code:"// The classic trap: forEach does NOT await\nitems.forEach(async (i) => { await save(i); });   // fires all, awaits none\n\nfor (const i of items) { await save(i); }          // sequential\nawait Promise.all(items.map(i => save(i)));        // parallel"},
 {h:"Cancellation"},
 {code:"const controller = new AbortController();\nfetch(url, { signal: controller.signal });\ncontroller.abort();   // cancels the in-flight request"},
 {p:"This is essential for search-as-you-type, and it's the fix for the stale-response race condition where a slow earlier request resolves after a newer one and overwrites correct data."}],
 docs:[{l:"MDN — Event loop",u:"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Event_loop"},{l:"MDN — Closures",u:"https://developer.mozilla.org/en-US/docs/Web/JavaScript/Closures"},{l:"MDN — AbortController",u:"https://developer.mozilla.org/en-US/docs/Web/API/AbortController"}],
 drill:"Implement debounce, throttle and deep clone from scratch with AI off. Then predict the output of five mixed setTimeout/promise snippets before running them." },

{ id:"fe-2", cat:"Frontend", t:"TypeScript that holds up under questioning", min:7,
 bn:"TypeScript-এ সবচেয়ে গুরুত্বপূর্ণ পার্থক্য any আর unknown-এর মধ্যে। any টাইপ চেকিং বন্ধ করে দেয় আর ধীরে ধীরে পুরো কোডবেসে ছড়িয়ে পড়ে; unknown সব কিছু নেয় কিন্তু ব্যবহার করার আগে টাইপ নিশ্চিত করতে বাধ্য করে — তাই API রেসপন্সের জন্য এটিই সঠিক। মনে রাখবেন, as দিয়ে cast করা মানে কম্পাইলারকে মিথ্যা বলা — রানটাইমে কোনো সুরক্ষা নেই, তাই zod দিয়ে যাচাই করুন। Discriminated union দিয়ে loading/success/error অবস্থা সুন্দরভাবে মডেল করা যায়।", body:[
 {p:"You use TypeScript at Osilion and CoreBari, so expect real questions rather than definitions."},
 {h:"unknown vs any — the one that matters"},
 {p:"any disables type checking and spreads silently through your codebase. unknown accepts anything but forces you to narrow before use, which makes it the correct type at every boundary: API responses, JSON.parse, third-party data."},
 {code:"const data: unknown = await res.json();\n\n// A cast is a lie the compiler believes:\nconst user = data as User;          // no runtime safety at all\n\n// Validate instead:\nconst user = UserSchema.parse(data); // zod — throws on mismatch"},
 {h:"Narrowing"},
 {p:"typeof, instanceof, the in operator, discriminated unions with a kind field, and type predicates (function isUser(x: unknown): x is User). Discriminated unions are the idiomatic way to model 'one of several shapes' — loading | success | error state, for example."},
 {code:"type Result<T> =\n  | { status: 'loading' }\n  | { status: 'error'; error: string }\n  | { status: 'success'; data: T };\n\nfunction render(r: Result<User>) {\n  switch (r.status) {\n    case 'loading': return spinner();\n    case 'error':   return message(r.error);   // TS knows error exists here\n    case 'success': return profile(r.data);    // and data exists here\n  }\n}"},
 {h:"Utility types worth knowing by name"},
 {p:"Partial, Required, Pick, Omit, Record, ReturnType, Awaited, NonNullable. These come up constantly in real code and occasionally as a direct question."},
 {h:"Generics"},
 {p:"Write them when a function's output type depends on its input type. Constrain with extends when you need guarantees: function byId<T extends { id: number }>(items: T[], id: number): T | undefined."}],
 docs:[{l:"TypeScript Handbook",u:"https://www.typescriptlang.org/docs/handbook/intro.html"},{l:"TS — Narrowing",u:"https://www.typescriptlang.org/docs/handbook/2/narrowing.html"},{l:"Zod",u:"https://zod.dev/"}],
 drill:"Type an API client for your Laravel API: a Result discriminated union, generic request function, and runtime validation at the boundary." },

{ id:"fe-3", cat:"Frontend", t:"Vue 3 — your deepest frontend, own it", min:10,
 bn:"Vue ৩-এ ref যেকোনো ভ্যালু ধরে রাখে (.value দিয়ে ব্যবহার), reactive শুধু অবজেক্টের জন্য এবং destructure করলে reactivity হারায়। সাধারণ নিয়ম: ref ব্যবহার করুন, এটি অনুমানযোগ্য। computed ক্যাশ হয় এবং নির্ভরতা বদলালেই কেবল পুনরায় হিসাব করে। Composable হলো Vue-র custom hook — reactive স্টেট ও ফাংশন রিটার্ন করে এমন একটি সাধারণ ফাংশন, যা একই লজিক বহু কম্পোনেন্টে পুনঃব্যবহার করতে দেয়। ইন্টারভিউতে প্রায়ই লাইভ একটি composable লিখতে বলা হয়, তাই অনুশীলন করুন। v-for-এ index কে key হিসেবে ব্যবহার করবেন না।", body:[
 {h:"Reactivity"},
 {p:"Vue 3 uses Proxies. ref() wraps any value including primitives — .value in script, auto-unwrapped in templates. reactive() proxies an object deeply but loses reactivity if you destructure it (use toRefs). Practical rule: default to ref because it's predictable."},
 {p:"computed() is cached and only recalculates when a dependency changes — it's not a function call, it's a derived value. watch() takes explicit sources and is lazy; watchEffect() auto-tracks whatever it touches and runs immediately."},
 {h:"Composables — the heart of the Composition API"},
 {code:"// composables/useCustomers.js\nexport function useCustomers() {\n  const items = ref([]);\n  const loading = ref(false);\n  const error = ref(null);\n\n  async function load() {\n    loading.value = true;\n    error.value = null;\n    try {\n      items.value = await api.get('/customers');\n    } catch (e) {\n      error.value = e;\n    } finally {\n      loading.value = false;\n    }\n  }\n\n  return { items, loading, error, load };\n}"},
 {p:"Be able to write one live — it's the most common Vue interview task. The point to articulate: Composition API groups code by feature rather than by option type, which is why large components stay readable and why logic becomes extractable instead of copy-pasted."},
 {h:"Component communication"},
 {list:["Props down, emits up — the default.","v-model on components via modelValue + update:modelValue.","provide/inject for deep trees — but it makes data flow implicit, so use sparingly.","Slots: default, named, and scoped. Scoped slots let the child pass data back into the parent's template — a favourite interview topic."]},
 {h:"Pinia vs a composable"},
 {p:"A store is for shared application state that many components need. A composable is for reusable logic that each consumer instantiates separately. Getting this distinction right in an answer shows you've built something real rather than followed a tutorial."},
 {h:"Performance"},
 {p:"Stable :key values (never the array index when a list reorders — the framework matches the wrong DOM node to the wrong data), v-once and v-memo for static subtrees, shallowRef for large objects you replace wholesale, lazy-loaded routes, and virtual scrolling for long lists."}],
 docs:[{l:"Vue 3 — Reactivity fundamentals",u:"https://vuejs.org/guide/essentials/reactivity-fundamentals.html"},{l:"Vue 3 — Composables",u:"https://vuejs.org/guide/reusability/composables.html"},{l:"Pinia",u:"https://pinia.vuejs.org/"}],
 drill:"Build a CRUD page with ref/computed/watch, then extract the API logic into a composable and reuse it in a second component." },

{ id:"fe-4", cat:"Frontend", t:"React and Next.js App Router", min:11,
 bn:"React-এ সবচেয়ে গুরুত্বপূর্ণ আধুনিক ধারণা: বেশিরভাগ useEffect আসলে দরকার নেই। derived ভ্যালু render-এর সময় হিসাব করুন, ডেটা ফেচিং ফ্রেমওয়ার্ক বা লাইব্রেরিকে দিন। useEffect শুধু বাইরের সিস্টেমের সাথে সিঙ্ক করার জন্য। Next.js-এ Server Component ডিফল্ট — এগুলো সার্ভারে চলে, কোনো JavaScript পাঠায় না, ডেটাবেজে সরাসরি যেতে পারে, কিন্তু state বা event handler ব্যবহার করতে পারে না। 'use client' যত নিচে রাখা যায় তত ভালো। Server Action আসলে একটি পাবলিক এন্ডপয়েন্ট, তাই ভেতরে অবশ্যই অনুমোদন যাচাই করতে হবে — এটি অনেকে ভুলে যায়।", body:[
 {h:"Hooks, and the modern view of useEffect"},
 {p:"The senior answer about effects is that most of them shouldn't exist. useEffect is for synchronizing with systems outside React — subscriptions, timers, non-React widgets. Derived values should be computed during render. Data fetching belongs to the framework or a query library. Every effect needs correct dependencies and a cleanup function."},
 {code:"// Wrong — derived state in an effect\nconst [total, setTotal] = useState(0);\nuseEffect(() => { setTotal(items.reduce((a,i) => a+i.price, 0)); }, [items]);\n\n// Right — just compute it\nconst total = items.reduce((a, i) => a + i.price, 0);"},
 {p:"useState for local state; useReducer when transitions are complex or several values move together (and the reducer is testable in isolation); useMemo/useCallback only after measuring; useRef for mutable values that shouldn't trigger renders."},
 {h:"The stale response race — a common live-coding task"},
 {code:"useEffect(() => {\n  const controller = new AbortController();\n  let ignore = false;\n\n  (async () => {\n    try {\n      const res = await fetch(`/api/search?q=${q}`, { signal: controller.signal });\n      const data = await res.json();\n      if (!ignore) setResults(data);\n    } catch (e) {\n      if (e.name !== 'AbortError') setError(e);\n    }\n  })();\n\n  return () => { ignore = true; controller.abort(); };\n}, [q]);"},
 {h:"Next.js: Server vs Client Components"},
 {p:"Server Components are the default. They render on the server, ship zero JavaScript for themselves, and can query the database or read secrets directly — but they cannot use state, effects, browser APIs or event handlers. Client Components ('use client') hydrate in the browser and own interactivity."},
 {p:"The rule to state: push 'use client' as far down the tree as possible, because everything a client component imports becomes client code too. The trick worth knowing: you can pass a server component as children to a client component and it stays server-rendered."},
 {h:"Rendering and caching"},
 {p:"Static by default where possible; dynamic when you use cookies, headers or no-store; ISR via revalidate; streaming with Suspense boundaries and loading.tsx. On-demand invalidation with revalidatePath and revalidateTag after mutations. Caching defaults have shifted between Next versions — the honest and correct answer in an interview is 'I check the caching behaviour for the version we're on', which beats confidently quoting stale rules."},
 {h:"Server Actions — the security point"},
 {p:"A server action compiles to a public endpoint. The fact that your UI only renders the button for admins means nothing. Validate input and check authorization inside the action body, every single time. Interviewers love this answer because most candidates miss it."},
 {h:"Auth in Next"},
 {p:"Session or JWT in an httpOnly, secure, sameSite cookie. middleware.ts gives coarse route protection — but it is a UX gate, not a security boundary. Re-verify the session and check ownership at every data access. Never store tokens in localStorage: an XSS bug reads it instantly."}],
 docs:[{l:"React — You Might Not Need an Effect",u:"https://react.dev/learn/you-might-not-need-an-effect"},{l:"Next.js — App Router docs",u:"https://nextjs.org/docs/app"},{l:"Next.js — Server Actions & security",u:"https://nextjs.org/docs/app/building-your-application/data-fetching/server-actions-and-mutations"}],
 drill:"Build a Next App Router page: server component fetching data, client component for a form, a server action for the mutation with authorization checked inside it." },
