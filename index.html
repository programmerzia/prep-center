  // PHP
  { c: "PHP", q: "What's new in PHP 8 that changed how you write code?", a: "Don't list features — tie them to your work. Enums replaced status constants and now carry behaviour; readonly properties made DTOs genuinely immutable; constructor promotion killed boilerplate; match replaced most switches because it's strict and returns a value; named arguments made optional params readable.", x: "Don't dump a feature list. Tie each feature to a decision you made. Interviewers score judgement, not changelog memory." },
  { c: "PHP", q: "Enum vs class constants — why enums?", a: "Type safety and exhaustiveness. A backed enum is a real type you can type-hint, so an invalid status can't be passed. They hold methods (canRefund()), implement interfaces, and Laravel casts to them natively. Constants are just strings the compiler can't check.", x: "The win is the type system: invalid values can't compile/pass. Mention methods on enums and Laravel casts — that's the senior layer." },
  { c: "PHP", q: "Interface vs abstract class — when each?", a: "Interface = contract, no state, a class can implement many. Abstract = shared implementation + template method, single inheritance. Rule: type-hint interfaces (that's what lets the container swap implementations and lets you test with fakes), inherit abstracts sparingly.", x: "Rule of thumb: type-hint interfaces, inherit abstracts sparingly. Connect it to DI and test doubles." },
  { c: "PHP", q: "What are traits and what's their danger?", a: "Horizontal reuse without inheritance. Danger: they hide dependencies (a trait using $this->something it doesn't own), method collisions, and they make a class's real surface hard to see. Prefer composition; use traits for small genuinely cross-cutting behaviour.", x: "Admit the danger. Prefer composition. Traits for tiny cross-cutting reuse only — shows you won't hide dependencies." },
  { c: "PHP", q: "Explain dependency injection to a junior.", a: "Pass a class what it needs instead of letting it build its own dependencies. Benefits: testable (inject a fake), flexible (swap implementations), explicit (the constructor documents requirements). Laravel's container resolves these automatically by reading type-hints — same idea as ASP.NET Core's DI.", x: "Use plain language + one benefit they feel (testing). Mapping Laravel container ↔ ASP.NET DI shows transfer, not buzzwords." },
  { c: "PHP", q: "Value object vs entity?", a: "Entity has identity that persists over time (Customer #42 is still that customer after every field changes). Value object is defined entirely by its values and should be immutable — Money, DateRange, EmailAddress. Modelling Money as a value object with currency prevents a whole class of bug.", x: "Money example is gold — concrete bug prevention beats theory. Immutability is the key property of value objects." },
  { c: "PHP", q: "What is a generator and when did you use one?", a: "A function using yield that produces values lazily, so you never hold the whole dataset in memory. Laravel's cursor()/lazy() are built on this. Real use: streaming a large CSV import so memory stayed flat instead of loading 500k rows.", x: "Memory story > definition. cursor()/lazy() proves you've touched real volume." },
  { c: "PHP", q: "chunk vs chunkById vs cursor?", a: "chunk paginates by offset — breaks if you modify rows while iterating (rows shift). chunkById uses the last id as cursor — safe while modifying. cursor/lazy streams one model at a time, lowest memory. Knowing this distinction signals real data-volume experience.", x: "Knowing offset breaks under mutation is the tell. chunkById for writes; cursor for lowest memory reads." },
  { c: "PHP", q: "Explain the Specification pattern and why you used it.", a: "It wraps a query/business rule in an object so rules compose: new ActiveCandidates()->and(new AppliedAfter($date)). At Osilion the candidate filters combined in many different ways across use cases; specifications kept that logic testable and stopped the repository growing 30 near-duplicate methods.", x: "Pattern without your Osilion why is fluff. Compose + testability + stopping repository bloat." },
  { c: "PHP", q: "Do you always use the Repository pattern?", a: "No — and say why. Eloquent is already an abstraction over the DB, so wrapping it usually adds indirection without benefit. I use repositories when I genuinely need to swap the data source, or in strict DDD where the domain must not know about persistence. Interviewers respect a reasoned 'I didn't' more than dogma.", x: "A reasoned 'no' beats cargo-cult 'yes'. Eloquent is already an abstraction — say when wrapping earns its keep." },
  // Laravel
  { c: "Laravel", q: "Walk me through the request lifecycle.", a: "index.php → autoloader → bootstrap/app.php builds the Application (container) → HTTP kernel bootstraps (env, config, providers register() then boot()) → global middleware → router matches → route/group middleware → controller resolved from container with route-model binding → response travels back out through the middleware onion → sent → terminable middleware runs after send.", x: "Order matters. Hesitation at providers/middleware/terminable = you don't actually know it. Drill aloud until smooth." },
  { c: "Laravel", q: "bind vs singleton vs scoped?", a: "bind = new instance every resolution. singleton = one instance for the app lifecycle. scoped = one per request, which matters under Octane/Swoole where the app stays in memory between requests and a singleton would leak state across users.", x: "Scoped exists for Octane. If you omit Octane leak risk, the answer is incomplete." },
  { c: "Laravel", q: "register() vs boot() in a service provider?", a: "register() only binds things into the container — you must not resolve services there because other providers may not be registered yet. boot() runs after every provider registered, so it's safe to use other services: routes, view composers, policies, macros, event listeners.", x: "register = bind only; boot = use other services. Resolving in register() is the classic bug." },
  { c: "Laravel", q: "Are facades an anti-pattern?", a: "Balanced answer: they're sugar over container resolution and they're mockable (Cache::shouldReceive), so they avoid the classic global-state testing problem. But in domain-heavy classes I inject dependencies explicitly, because then the constructor documents what the class actually needs.", x: "Balanced answer wins. Sugar + mockable, but inject in domain-heavy classes so the constructor documents needs." },
  { c: "Laravel", q: "Explain the N+1 problem, detection and three fixes.", a: "Loop over N parents, each lazily loading a relation = 1+N queries. Detect: Debugbar/Telescope, query log, or best — Model::preventLazyLoading() in dev so it throws the moment it happens. Fix: with() eager load, load()/loadMissing() after the fact, withCount() for counts, or a join when you need to filter by the related table.", x: "Detection habit (preventLazyLoading) > just naming with(). Three fixes shows range." },
  { c: "Laravel", q: "with() vs join()?", a: "with() runs a second query and hydrates related models — no row duplication, clean object graph. join() is one flat query — needed when you must filter or sort by a related column, or aggregate. Use with() for normal reads, join() when SQL-level filtering is required.", x: "Object graph vs SQL filtering. Pick by whether you need related columns in WHERE/ORDER BY." },
  { c: "Laravel", q: "Transactions — and the gotcha most people miss.", a: "DB::transaction() wraps multi-step writes atomically. Gotchas: a queue job dispatched inside a transaction can execute before the commit (use ->afterCommit()); nested transactions use savepoints; long transactions hold locks so keep them short. And lockForUpdate() for the stock/booking race.", x: "afterCommit() for queued jobs is the senior gotcha. Short transactions + lockForUpdate for races." },
  { c: "Laravel", q: "How do you prevent a double booking?", a: "Pessimistic: SELECT ... FOR UPDATE on the slot row inside a transaction so a second request blocks. Or a unique constraint on (resource_id, slot) so the DB itself rejects the duplicate. Or optimistic locking with a version column and retry. I've hit this in booking systems — the DB constraint is the one that never lies.", x: "Transaction alone is wrong. Name lock / unique constraint / optimistic and which never lies." },
  { c: "Laravel", q: "How do queues work, and what breaks on deploy?", a: "Job is serialized to a driver (Redis/DB/SQS), a worker process pulls and runs it. The deploy trap: workers hold your code in memory, so after every deploy you must run queue:restart or they keep executing yesterday's code. Also jobs can run twice — design them idempotent.", x: "queue:restart is the deploy trap. Idempotency is the second half — jobs can run twice." },
  { c: "Laravel", q: "How do you make a job idempotent?", a: "Check state before acting (has this order already been marked paid?), use a unique key stored on first processing, use ShouldBeUnique to stop concurrent duplicates, and make the operation naturally repeatable — set a value rather than increment it where possible.", x: "Check-before-act + unique keys + set-not-increment. Concrete beats 'make it idempotent'." },
  { c: "Laravel", q: "Events/listeners vs calling a service directly?", a: "Events for genuine fan-out where new reactions shouldn't modify the original code — OrderPlaced triggers email, stock, analytics. Direct service call when the step is required and singular. Overusing events makes control flow untraceable; saying that shows judgement.", x: "Fan-out vs required singular step. Saying overuse makes flow untraceable shows judgement." },
  { c: "Laravel", q: "paginate vs simplePaginate vs cursorPaginate?", a: "paginate does a COUNT for total pages — expensive on huge tables. simplePaginate skips the count, next/prev only. cursorPaginate is keyset-based — stable and fast for deep pages and infinite scroll. Offset degrades because the DB must scan and discard every skipped row.", x: "COUNT cost + OFFSET discard. cursorPaginate for deep pages / infinite scroll." },
  { c: "Laravel", q: "API Resources — what problem do they solve?", a: "They separate your DB shape from your API contract, so adding a column doesn't leak it and renaming one doesn't break clients. whenLoaded() also stops your serializer silently triggering N+1. Same role DTOs play in .NET.", x: "Contract stability + whenLoaded() preventing accidental N+1. Map to DTOs in .NET." },
  { c: "Laravel", q: "Sanctum vs Passport vs JWT — pick one for a mobile app.", a: "Sanctum. Its API token mode gives revocable per-device tokens with abilities, no OAuth ceremony. Passport only if third parties need to authorize against me. Plain JWT scales statelessly but revocation is the hard part — short access + rotating refresh tokens.", x: "Pick Sanctum and say why. Passport only for third-party OAuth. JWT revocation is the hard part." },
  { c: "Laravel", q: "How would you implement multi-tenancy?", a: "Options: tenant_id column with a global scope (cheapest, but one forgotten scope leaks data); Postgres row-level security (enforcement in the DB, much safer); schema per tenant (better isolation, migration overhead); DB per tenant (strongest, heaviest ops). At CoreBari I scope every query by tenant and treat cross-tenant leakage as the top risk.", x: "List options with trade-offs, then your CoreBari choice and the leak risk you accept and mitigate." },
  { c: "Laravel", q: "How would you diagnose a slow Laravel app?", a: "Measure first — Telescope/Debugbar/APM to find whether it's DB, PHP, external calls or frontend. Then in order: fix N+1 and missing indexes (usually 80% of it), cache expensive reads, move slow work to queues, then config/route caching and OPcache, then infrastructure. Never start with 'add servers'.", x: "Measure first. Never open with 'add servers'. Order: queries → cache → queues → infra." },
  { c: "Laravel", q: "Model events don't fire on mass updates — why does that matter?", a: "Model::where(...)->update() bypasses Eloquent events and observers entirely, so audit logs, cache invalidation and search indexing silently don't run. If logic must always happen, put it in the DB (trigger/constraint) or route all writes through a service — don't rely on model events alone.", x: "Silent missing side effects (audit/cache/search). Don't rely on observers alone for must-happen logic." },
  { c: "Laravel", q: "Laravel vs Symfony — real differences.", a: "Symfony: explicit config, container compiled at build time (faster, errors caught early), Doctrine is a Data Mapper so entities stay persistence-ignorant — suits complex domains. Laravel: convention-driven, runtime container, Eloquent is Active Record — faster for CRUD-heavy product work. Laravel is built on Symfony components anyway.", x: "Data Mapper vs Active Record + compile-time container. Laravel sits on Symfony components — say so." },
  // Frontend
  { c: "Frontend", q: "Explain the event loop. Predict: log, setTimeout 0, promise.then, log.", a: "Sync code runs first (1, 4). Then microtasks drain completely — promises (3). Then macrotasks — setTimeout (2). Output: 1, 4, 3, 2. The key point is microtasks always beat timers, even a 0ms timer.", x: "Output 1,4,3,2. Microtasks beat timers — that's the point of the prediction question." },
  { c: "Frontend", q: "Implement debounce, then throttle. Difference?", a: "debounce: clearTimeout then setTimeout on every call — fires once after the calls stop (search input). throttle: a ready flag reset on an interval — fires at most once per window during continuous calls (scroll, resize).", x: "Search = debounce; scroll = throttle. Be ready to write both from scratch." },
  { c: "Frontend", q: "ref vs reactive in Vue 3?", a: "ref wraps any value including primitives, accessed via .value in script, auto-unwrapped in template. reactive is a deep Proxy over an object but loses reactivity when destructured (use toRefs). Practical rule: default to ref, it's predictable.", x: "Default to ref. reactive + destructure loses reactivity — toRefs. Predictable > clever." },
  { c: "Frontend", q: "What is a composable? Write one.", a: "A function using Vue's reactivity APIs that returns reactive state plus methods — Vue's version of a custom hook. useCustomers() holds items/loading/error refs and a load() action, then any component consumes it. It's how Composition API turns copy-pasted logic into reusable units.", x: "Custom-hook equivalent. Show items/loading/error + load(). Reuse across components is the pitch." },
  { c: "Frontend", q: "Why is array index a bad :key or key?", a: "When the list reorders or an item is removed, indexes shift, so the framework matches the wrong DOM node to the wrong data — you get stale content and lost input state. Use a stable unique id.", x: "Wrong DOM↔data matching on reorder/delete. Stable unique id only." },
  { c: "Frontend", q: "What does useEffect actually do, and why do most effects not need to exist?", a: "It synchronizes with external systems — subscriptions, timers, non-React widgets. Most effects in real codebases are wrong: derived state should be computed during render, and data fetching belongs to the framework or a query library. Every effect needs correct deps and a cleanup function.", x: "Sync with external systems. Derived state in render; fetch in framework/query lib. Cleanup + deps." },
  { c: "Frontend", q: "Server Components vs Client Components?", a: "Server components render on the server, ship zero JS for themselves, can hit the DB and read secrets, but can't use state, effects, or event handlers. Client components ('use client') hydrate and own interactivity. Push 'use client' as far down the tree as possible — everything it imports becomes client code.", x: "Push 'use client' down. Server = zero JS, secrets OK, no hooks. Client = interactivity." },
  { c: "Frontend", q: "Server Actions — what security check must you never skip?", a: "Authorization inside the action. A server action compiles to a public endpoint — the fact that the UI only shows the button to admins means nothing. Validate input and check permissions in the action body, every time.", x: "Authz inside the action. UI hiding a button is not security. Validates + permissions every time." },
  { c: "Frontend", q: "How do you protect routes in Next.js, and why isn't middleware enough?", a: "Middleware is a UX gate — it redirects unauthenticated users early. It is not a security boundary: any data access must re-verify the session and check ownership server-side. Session in an httpOnly, secure, sameSite cookie; never localStorage.", x: "Middleware = UX gate. Real security = server-side session + ownership on every data access. httpOnly cookies." },
  { c: "Frontend", q: "How do you handle a race between two search requests?", a: "The slower earlier request can resolve after the newer one and overwrite it. Fix: AbortController to cancel the in-flight request on each new keystroke, or track a request id/ignore flag in a ref and discard stale responses. Plus debounce the input.", x: "Stale response overwrite. AbortController or ignore-stale id + debounce. Name the race explicitly." },
  { c: "Frontend", q: "unknown vs any in TypeScript?", a: "any disables checking and infects everything downstream. unknown accepts anything but forces you to narrow before use, so it's the correct type at boundaries — API responses, JSON.parse. Then narrow with a type guard or validate with zod rather than casting, because a cast is a lie the compiler believes.", x: "unknown at boundaries, narrow before use. any infects. Prefer zod over casts." },
  // SQL
  { c: "SQL", q: "How does a B-tree index work and what does it cost?", a: "A sorted tree giving logarithmic lookups instead of a full scan. Cost: every insert/update maintains every index, plus storage. That trade-off is the whole answer to 'should I index this' — index what you filter, join and sort on, not everything.", x: "Read win / write+storage cost. That trade-off answers 'should I index this?'" },
  { c: "SQL", q: "Composite index on (a,b,c) — which queries benefit?", a: "Leftmost prefix rule: queries filtering on a, or a+b, or a+b+c. Not b alone, not c alone. So column order is a design decision — most commonly filtered and most selective first, range conditions last because a range stops the index being usable for later columns.", x: "Leftmost prefix. Column order is a design decision — selective equality first, range last." },
  { c: "SQL", q: "When does an index NOT help?", a: "Low-cardinality columns (booleans), leading wildcard LIKE '%x', a function applied to the column (WHERE YEAR(created_at)=2026 — use a range instead), implicit type casts, and tiny tables where a scan is cheaper.", x: "Low cardinality, leading %, functions on column, casts, tiny tables. Shows you won't index blindly." },
  { c: "SQL", q: "Isolation levels and the anomalies each prevents.", a: "Read Uncommitted allows dirty reads. Read Committed (Postgres default) prevents dirty reads, allows non-repeatable reads. Repeatable Read (MySQL default) prevents both, phantoms theoretically possible — InnoDB blocks most with gap locks. Serializable prevents all, at concurrency cost.", x: "Know your DB default (PG Read Committed, MySQL RR). Dirty / non-repeatable / phantom." },
  { c: "SQL", q: "What causes deadlocks and how do you avoid them?", a: "Two transactions each holding a lock the other needs. Avoid by acquiring locks in a consistent order everywhere, keeping transactions short, touching fewer rows, and — importantly — retrying on deadlock errors, because they're a normal condition, not a bug to eliminate entirely.", x: "Consistent lock order + short tx + retry. Deadlocks are normal — retry is part of the design." },
  { c: "SQL", q: "Write: top 3 products per category.", a: "SELECT * FROM (SELECT p.*, ROW_NUMBER() OVER (PARTITION BY category_id ORDER BY sales DESC) rn FROM products p) t WHERE rn <= 3; — memorize this window function shape, it answers a whole family of interview questions.", x: "ROW_NUMBER() OVER (PARTITION BY …) is a shape that answers a whole family. Memorize it." },
  { c: "SQL", q: "How do you migrate a large table with zero downtime?", a: "Additive first: add a nullable column, deploy code that writes to both old and new, backfill in batches (chunkById), switch reads to the new column, then drop the old one in a later deploy. Never rename in place while old code is running. Big tables may need online schema-change tooling.", x: "Expand/contract. Never rename in place with old code live. Batch backfill with chunkById." },
  { c: "SQL", q: "UUID vs auto-increment primary keys?", a: "Auto-increment is compact and index-friendly but leaks volume and collides across systems. UUIDv4 is random, which hurts B-tree locality and causes page splits on insert. ULID/UUIDv7 are time-sortable and fix that — the usual right answer for distributed or multi-tenant systems.", x: "UUIDv4 page-split pain. ULID/UUIDv7 for distributed/multi-tenant. Trade-offs > ideology." },
  // Architecture
  { c: "Architecture", q: "Explain the layered architecture you used and why.", a: "Domain (entities, rules, no framework) → Application (use cases, transactions) → Infrastructure (EF Core, external APIs) → Web API. Dependencies point inward via interfaces. Benefit: domain logic testable without a DB, and swapping the ORM or mail provider is local. Cost: ceremony — for CRUD-heavy apps plain MVC plus services is often correct.", x: "Inward dependencies + when you'd skip ceremony. Cost honesty makes the answer senior." },
  { c: "Architecture", q: "Design an idempotent payment webhook handler.", a: "Verify the signature first. Look up the provider's event id in a processed_events table — if present, return 200 immediately and do nothing. Otherwise process inside a transaction, record the event id with the response, return 200 fast and push heavy work to a queue so the provider doesn't time out and retry.", x: "Verify → dedupe event id → process → 200 fast. Heavy work queued. Provider retries are expected." },
  { c: "Architecture", q: "How does your offline sync work? How do you resolve conflicts?", a: "Local-first: writes go to IndexedDB immediately and queue in an outbox, so the UI never blocks. A background process drains the outbox when online; every operation carries a client-generated id so replays don't duplicate. Conflicts: I model to avoid them — a sale is append-only — and fall back to server-authoritative field merge. Device clocks lie, so server timestamps win.", x: "Outbox, client ids, server time, append-only domain. Designing away conflicts beats clever merge." },
  { c: "Architecture", q: "Your traffic 10x's tomorrow — what breaks first?", a: "In order: DB connections and slow queries, then cache misses, then queue backlog, then storage/bandwidth. Fixes in the same order: indexes and query fixes, caching, connection pooling, horizontally scale stateless app servers, read replicas, sharding last. And measure before assuming.", x: "DB → cache → queue → bandwidth. Measure; don't start with more servers." },
  { c: "Architecture", q: "Monolith or microservices for a 5-person team?", a: "Monolith, modular internally. Microservices buy independent deployment and scaling at the cost of distributed transactions, network failure modes, and ops burden a 5-person team can't absorb. Split out a service only when a specific part has a genuinely different scaling or reliability profile.", x: "Modular monolith. Split only on real scale/reliability boundaries. Ops cost is the argument." },
  { c: "Architecture", q: "How do you handle a production incident?", a: "Detect via alerting, assess user impact, then mitigate before diagnosing — rollback, feature flag, or scale. Communicate status while working. Only then root-cause, and write a blameless post-mortem with one concrete prevention action. 'Mitigate before diagnose' is the line interviewers want to hear.", x: "Mitigate before diagnose. Communicate. Blameless post-mortem with one prevention action." },
  { c: "Architecture", q: "Broken access control — why is it the #1 real risk?", a: "Because authentication usually works and authorization quietly doesn't. IDOR: /orders/123 returns someone else's order because the code checked who you are but not whether this object is yours. Fix: authorize every object access server-side, scope every query by tenant/user, never trust an id from the client.", x: "IDOR: auth without ownership. Authorize every object; scope every query; never trust client ids." },
  // Behavioral
  { c: "Behavioral", q: "Tell me about yourself. (90 seconds)", a: "Full-stack engineer, 10 years, production SaaS and business systems — booking, marketplaces, CRM. Past year: contract with a Norwegian startup, led an AI recruitment platform and built a lead-gen platform, .NET backend with React/Next front, on Azure. Before that most of my career was PHP — Laravel and Symfony with Vue — for international clients. I also run a small SaaS product suite of my own, which keeps me hands-on with multi-tenancy, offline sync and payments. Looking for a senior full-stack role where I own features end to end.", x: "Shape: now → recent ownership → depth → what you want. 90 seconds max. No university start." },
  { c: "Behavioral", q: "Why are you leaving / why did the contract end?", a: "It was a fixed-term contract with a startup. Their business situation changed and they couldn't sustain the development arrangement, so it ended as scheduled at the end of September. Both founders have offered to be references. — Then STOP. No bitterness, no over-explaining.", x: "Two sentences + references + STOP. Bitterness or over-explain kills you." },
  { c: "Behavioral", q: "How do you use AI in your development work?", a: "As an accelerator, not a substitute for understanding. I design the architecture and data model myself, then use AI to move faster on implementation, and I review everything — I have to debug it at 2am and defend it in code review, so I don't ship what I can't explain. On my own product I wrote the platform standards and sync design first, then built against them. NEVER say 'vibe coded'.", x: "You own design; AI accelerates typing; you review everything. Never 'vibe coded'." },
  { c: "Behavioral", q: "You run your own product — will that distract you?", a: "It's a side product that mostly runs itself, and it's where I keep my skills sharp — multi-tenancy, offline sync, payments. My priority is a stable long-term role, and the product work makes me a better engineer for it.", x: "Side product, mostly runs itself, sharpens skills. Priority is the long-term role." },
  { c: "Behavioral", q: "How did you learn C#/.NET so quickly?", a: "The architecture transferred instantly — DI, middleware, ORMs, migrations, API design are the same problems in different syntax; Laravel's container is ASP.NET's DI, Eloquent maps to EF Core. What I had to learn was the language and ecosystem specifics: LINQ and deferred execution, async/await properly, EF Core's change tracking, and Azure. I shipped production services inside the first few months.", x: "Architecture transferred; language/ecosystem was the learn. Productive, not internals expert — honest depth." },
  { c: "Behavioral", q: "Why should we hire you over a local candidate?", a: "A year of proven remote delivery for a European client across timezones, ten years of production systems, and breadth that means I can own a feature from schema to UI without handoffs. I also ship my own product, so I understand the business side of what I build, not just the ticket.", x: "Proven remote year + end-to-end ownership + product sense. Evidence > adjectives." },
  { c: "Behavioral", q: "Tell me about a time you broke production.", a: "Structure: what broke, how fast you detected it, that you mitigated before diagnosing, how you communicated, the root cause, and the prevention you added. Never claim you've never broken anything — that reads as either inexperience or dishonesty.", x: "Detect → mitigate → communicate → root cause → prevention. Never 'I've never broken anything'." },
  // .NET
  { c: ".NET", q: "LINQ deferred execution — what's the trap?", a: "IQueryable is a query, not a result. It becomes SQL when you materialize — ToListAsync, FirstAsync. Calling ToList() too early pulls the table into memory and filters in C#. AsEnumerable() is the same trap. Say: I keep it IQueryable until the last projection.", x: "IQueryable until last projection. Early ToList()/AsEnumerable() = filter in memory." },
  { c: ".NET", q: "ASP.NET DI lifetimes — and the classic bug.", a: "Transient = new each resolve. Scoped = one per request. Singleton = one per app. The bug: injecting a scoped DbContext into a singleton — it captures one request's context forever. Same as Laravel Octane leaking a singleton. Map it: bind≈transient, scoped≈scoped, singleton≈singleton.", x: "Scoped into singleton captures a request forever. Map to Laravel bind/scoped/singleton + Octane." },
  { c: ".NET", q: "How does EF Core change tracking work?", a: "DbContext is a unit of work. Tracked entities are snapshotted; SaveChanges writes the diff. AsNoTracking() for read-only is a real win. Include/ThenInclude is eager load — same N+1 as Eloquent. Never new up a second context and expect the first to see changes.", x: "Unit of work + snapshot. AsNoTracking for reads. Include = eager load = same N+1 story." },
  { c: ".NET", q: "async/await — what do you never do?", a: "Never .Result or .Wait() — deadlock risk and it blocks a thread. Async all the way down. Plumb CancellationToken. Task.WhenAll for genuine parallelism. Async means non-blocking, not multi-threaded.", x: "Never .Result/.Wait(). Async all the way, CancellationToken, WhenAll for real parallelism." },
  { c: ".NET", q: "How deep are you in .NET after one year?", a: "Honest: production services I owned end to end — recruitment backend, EF Core, Azure SQL, layered DDD. Deepest ecosystem is still PHP. Architecture transferred (DI, middleware, ORM, migrations). I am productive, not an internals expert. Do not bluff LINQ provider or GC questions.", x: "Honest ownership sentence. Don't bluff GC/LINQ provider. Architecture transfer is your bridge." },
  { c: ".NET", q: "Why Specification at Osilion?", a: "Candidate filters combined many ways across use cases. Specifications kept rules composable and testable and stopped the repository growing thirty near-duplicate methods. I'd skip it for a simple CRUD admin.", x: "Same as DDD claim — compose filters, testability, skip for CRUD. Consistency across answers matters." },
  // AI
  { c: "AI", q: "How does your AI recruitment pipeline actually work?", a: "CV upload → parse/chunk → embed/store → retrieve at interview time → prompt + rubric → structured score → persist. Hard part is not the API call: queue the LLM, validate JSON, retry, fall back, never block the request. Emphasize failure paths.", x: "Upload → parse → embed/retrieve → score → persist. Emphasize queue + validate + failure paths." },
  { c: "AI", q: "The model returns garbage. What did you build?", a: "Structured output or tool-calling, then schema-validate. Retry once with the error. If still bad: mark the interview failed-processing, do not invent a score, alert. Temperature near zero for scoring. Never let free text drive a privileged write.", x: "Schema validate → retry → fail loudly, no fake score. Temperature near zero for scoring." },
  { c: "AI", q: "How do you use AI in your own coding?", a: "I design architecture and data model. AI accelerates implementation. I review every line because I debug it at 2am and defend it in review. On CoreBari I wrote standards first, then built against them. Never say vibe-coded. If they ask about a line you can't explain, say so and reason from first principles.", x: "Same frame as behavioral AI question — design ownership + review. Consistency under probing." },
  { c: "AI", q: "RAG vs just stuffing the CV in the prompt?", a: "Short CV can go in the prompt. Long docs need chunk + embed + retrieve or you blow the window and pay for noise. RAG grounds answers in your data so the model scores from the CV, not training-set fiction.", x: "Short → prompt; long → chunk/embed/retrieve. Grounding beats training-set fiction." },
];

const DSA = [
  { t: "Two Sum", d: "Easy", p: "Given an array of integers and a target, return indices of the two numbers that add to target.", h: "One pass with a hash map: for each number, check if target - number was already seen.", php: `function twoSum(array $nums, int $target): array {\n  $seen = [];\n  foreach ($nums as $i => $n) {\n    $need = $target - $n;\n    if (isset($seen[$need])) return [$seen[$need], $i];\n    $seen[$n] = $i;\n  }\n  return [];\n}`, js: `function twoSum(nums, target) {\n  const seen = new Map();\n  for (let i = 0; i < nums.length; i++) {\n    const need = target - nums[i];\n    if (seen.has(need)) return [seen.get(need), i];\n    seen.set(nums[i], i);\n  }\n  return [];\n}`, big: "O(n) time, O(n) space", x: "Hash map of value→index turns nested O(n²) search into one pass. Say 'complement = target − num' out loud before coding." },
  { t: "Valid Parentheses", d: "Easy", p: "Given a string of ()[]{}, determine if brackets are correctly closed in the right order.", h: "Stack. Push openers, on a closer pop and compare.", php: `function isValid(string $s): bool {\n  $pairs = [')'=>'(', ']'=>'[', '}'=>'{'];\n  $stack = [];\n  foreach (str_split($s) as $ch) {\n    if (isset($pairs[$ch])) {\n      if (array_pop($stack) !== $pairs[$ch]) return false;\n    } else { $stack[] = $ch; }\n  }\n  return empty($stack);\n}`, js: `function isValid(s) {\n  const pairs = { ')': '(', ']': '[', '}': '{' };\n  const stack = [];\n  for (const ch of s) {\n    if (pairs[ch]) { if (stack.pop() !== pairs[ch]) return false; }\n    else stack.push(ch);\n  }\n  return stack.length === 0;\n}`, big: "O(n) time, O(n) space", x: "Stack is the pattern for nested matching. Push openers; on closer, top must match. Empty stack at end = valid." },
  { t: "First Non-Repeating Character", d: "Easy", p: "Return the first character in a string that appears exactly once, or null.", h: "Count frequencies first, then scan the string in order.", php: `function firstUnique(string $s): ?string {\n  $counts = count_chars($s, 1);\n  foreach (str_split($s) as $ch) {\n    if ($counts[ord($ch)] === 1) return $ch;\n  }\n  return null;\n}`, js: `function firstUnique(s) {\n  const counts = {};\n  for (const ch of s) counts[ch] = (counts[ch] || 0) + 1;\n  for (const ch of s) if (counts[ch] === 1) return ch;\n  return null;\n}`, big: "O(n) time, O(k) space", x: "Two passes: count, then scan in original order. One-pass tricks exist; clarity beats cleverness in interviews." },
  { t: "Group Anagrams", d: "Medium", p: "Group an array of strings so anagrams are together.", h: "Key each word by its sorted letters and bucket into a map.", php: `function groupAnagrams(array $words): array {\n  $groups = [];\n  foreach ($words as $w) {\n    $key = str_split($w);\n    sort($key);\n    $groups[implode('', $key)][] = $w;\n  }\n  return array_values($groups);\n}`, js: `function groupAnagrams(words) {\n  const groups = new Map();\n  for (const w of words) {\n    const key = [...w].sort().join('');\n    if (!groups.has(key)) groups.set(key, []);\n    groups.get(key).push(w);\n  }\n  return [...groups.values()];\n}`, big: "O(n·k log k) time", x: "Sorted letters (or count signature) as map key. Same key = same anagram group. O(n·k log k) with sorting." },
  { t: "Longest Substring Without Repeating Characters", d: "Medium", p: "Return the length of the longest substring with no repeated characters.", h: "Sliding window with a map of last-seen index; move the left edge past duplicates.", php: `function lengthOfLongest(string $s): int {\n  $last = []; $start = 0; $best = 0;\n  foreach (str_split($s) as $i => $ch) {\n    if (isset($last[$ch]) && $last[$ch] >= $start) $start = $last[$ch] + 1;\n    $last[$ch] = $i;\n    $best = max($best, $i - $start + 1);\n  }\n  return $best;\n}`, js: `function lengthOfLongest(s) {\n  const last = new Map(); let start = 0, best = 0;\n  for (let i = 0; i < s.length; i++) {\n    const ch = s[i];\n    if (last.has(ch) && last.get(ch) >= start) start = last.get(ch) + 1;\n    last.set(ch, i);\n    best = Math.max(best, i - start + 1);\n  }\n  return best;\n}`, big: "O(n) time, O(k) space", x: "Sliding window: advance right, move left past duplicates via last-seen index. Classic O(n) window problem." },
  { t: "Merge Intervals", d: "Medium", p: "Given a list of intervals, merge all overlapping ones.", h: "Sort by start, then extend the last interval when the next one overlaps.", php: `function merge(array $intervals): array {\n  usort($intervals, fn($a, $b) => $a[0] <=> $b[0]);\n  $out = [];\n  foreach ($intervals as $iv) {\n    $n = count($out);\n    if ($n && $iv[0] <= $out[$n-1][1]) {\n      $out[$n-1][1] = max($out[$n-1][1], $iv[1]);\n    } else { $out[] = $iv; }\n  }\n  return $out;\n}`, js: `function merge(intervals) {\n  intervals.sort((a, b) => a[0] - b[0]);\n  const out = [];\n  for (const iv of intervals) {\n    const last = out[out.length - 1];\n    if (last && iv[0] <= last[1]) last[1] = Math.max(last[1], iv[1]);\n    else out.push([...iv]);\n  }\n  return out;\n}`, big: "O(n log n) time — this is the booking-overlap problem in disguise", x: "Sort by start, then extend when next overlaps last. Same shape as booking-overlap / calendar merge — say that." },
  { t: "Implement Debounce", d: "Medium", p: "Write debounce(fn, wait): the returned function only calls fn after calls stop for `wait` ms.", h: "Close over a timer id; clear and reset it on every call.", php: `// PHP equivalent is rare — explain the concept instead:\n// store last-call timestamp, only execute if enough time has passed`, js: `function debounce(fn, wait) {\n  let timer;\n  return function (...args) {\n    clearTimeout(timer);\n    timer = setTimeout(() => fn.apply(this, args), wait);\n  };\n}`, big: "Classic closure question — expect a follow-up asking for throttle", x: "Closure over timer; clear+reset each call. Fires once after quiet. Search boxes. Follow-up: throttle." },
  { t: "Implement Throttle", d: "Medium", p: "Write throttle(fn, limit): fn runs at most once per limit ms during continuous calls.", h: "A ready flag reset by a timer.", php: `// Concept: track last execution time, skip calls inside the window`, js: `function throttle(fn, limit) {\n  let ready = true;\n  return function (...args) {\n    if (!ready) return;\n    fn.apply(this, args);\n    ready = false;\n    setTimeout(() => { ready = true; }, limit);\n  };\n}`, big: "Know the difference from debounce cold", x: "Ready flag + interval. Fires during continuous events at most once per window. Scroll/resize. Contrast with debounce." },
  { t: "Deep Clone", d: "Medium", p: "Deep clone a nested object/array without JSON round-tripping.", h: "Recurse; handle arrays, dates, null. Mention structuredClone exists.", php: `// PHP: clone is shallow; use __clone or:\n$copy = unserialize(serialize($original));`, js: `function deepClone(value, seen = new WeakMap()) {\n  if (value === null || typeof value !== 'object') return value;\n  if (seen.has(value)) return seen.get(value);\n  if (value instanceof Date) return new Date(value);\n  const out = Array.isArray(value) ? [] : {};\n  seen.set(value, out);\n  for (const [k, v] of Object.entries(value)) out[k] = deepClone(v, seen);\n  return out;\n}`, big: "Bonus points for handling circular references with WeakMap", x: "Recurse; handle array/object/Date/null. WeakMap for cycles. Mention structuredClone exists but they want the manual version." },
  { t: "Flatten Nested Array", d: "Easy", p: "Flatten an arbitrarily nested array to one level.", h: "Recursion or a stack. Mention Array.flat(Infinity) exists but they want the manual version.", php: `function flatten(array $arr): array {\n  $out = [];\n  array_walk_recursive($arr, function ($v) use (&$out) { $out[] = $v; });\n  return $out;\n}`, js: `function flatten(arr) {\n  return arr.reduce((acc, v) =>\n    acc.concat(Array.isArray(v) ? flatten(v) : v), []);\n}`, big: "O(n) time", x: "Recurse or stack. Array.flat(Infinity) is fine to mention after you show the manual reduce." },
  { t: "LRU Cache", d: "Medium", p: "Design a cache with get/put in O(1) that evicts the least recently used item at capacity.", h: "In JS a Map preserves insertion order — delete and re-set on access. Classically: hash map + doubly linked list.", php: `class LRUCache {\n  private array $map = [];\n  public function __construct(private int $cap) {}\n  public function get(string $k) {\n    if (!isset($this->map[$k])) return null;\n    $v = $this->map[$k];\n    unset($this->map[$k]);\n    $this->map[$k] = $v;\n    return $v;\n  }\n  public function put(string $k, $v): void {\n    unset($this->map[$k]);\n    $this->map[$k] = $v;\n    if (count($this->map) > $this->cap) {\n      array_shift($this->map);\n    }\n  }\n}`, js: `class LRUCache {\n  constructor(cap) { this.cap = cap; this.map = new Map(); }\n  get(k) {\n    if (!this.map.has(k)) return -1;\n    const v = this.map.get(k);\n    this.map.delete(k); this.map.set(k, v);\n    return v;\n  }\n  put(k, v) {\n    if (this.map.has(k)) this.map.delete(k);\n    this.map.set(k, v);\n    if (this.map.size > this.cap) this.map.delete(this.map.keys().next().value);\n  }\n}`, big: "O(1) both operations — very common senior question", x: "Map insertion order: delete+re-set on access = most recent. Evict first key when over capacity. O(1) get/put." },
  { t: "Debounced Search with Cancellation", d: "Medium", p: "Build a search function that debounces input and cancels in-flight requests.", h: "AbortController + debounce. This is the most realistic frontend interview task you'll get.", php: `// Backend side: rate-limit the endpoint and index the searched column`, js: `function createSearch(onResults) {\n  let controller = null;\n  let timer = null;\n  return function search(term) {\n    clearTimeout(timer);\n    timer = setTimeout(async () => {\n      if (controller) controller.abort();\n      controller = new AbortController();\n      try {\n        const res = await fetch('/api/search?q=' + encodeURIComponent(term),\n          { signal: controller.signal });\n        onResults(await res.json());\n      } catch (e) {\n        if (e.name !== 'AbortError') throw e;\n      }\n    }, 300);\n  };\n}`, big: "Mention the stale-response race explicitly — that's what they're testing", x: "AbortController cancels in-flight fetch; debounce limits calls. Stale-response race is what they're testing." },
  { t: "Anagram Check", d: "Easy", p: "Determine whether two strings are anagrams.", h: "Compare sorted strings, or count frequencies in one pass.", php: `function isAnagram(string $a, string $b): bool {\n  if (strlen($a) !== strlen($b)) return false;\n  return count_chars($a, 1) == count_chars($b, 1);\n}`, js: `function isAnagram(a, b) {\n  if (a.length !== b.length) return false;\n  const counts = {};\n  for (const c of a) counts[c] = (counts[c] || 0) + 1;\n  for (const c of b) {\n    if (!counts[c]) return false;\n    counts[c]--;\n  }\n  return true;\n}`, big: "O(n) with counting, O(n log n) with sorting", x: "Same length + same frequencies. Counting is O(n); sorting is fine for short strings. Early length exit." },
  { t: "Max Subarray Sum (Kadane)", d: "Medium", p: "Find the contiguous subarray with the largest sum.", h: "Track current running sum; reset it when it goes negative.", php: `function maxSubArray(array $nums): int {\n  $best = $cur = $nums[0];\n  for ($i = 1; $i < count($nums); $i++) {\n    $cur = max($nums[$i], $cur + $nums[$i]);\n    $best = max($best, $cur);\n  }\n  return $best;\n}`, js: `function maxSubArray(nums) {\n  let best = nums[0], cur = nums[0];\n  for (let i = 1; i < nums.length; i++) {\n    cur = Math.max(nums[i], cur + nums[i]);\n    best = Math.max(best, cur);\n  }\n  return best;\n}`, big: "O(n) time, O(1) space", x: "Running sum; reset when negative. Best so far is the answer. O(n)/O(1) — know the name Kadane." },
  { t: "Binary Search", d: "Easy", p: "Find a target index in a sorted array.", h: "Two pointers; guard against overflow with low + (high-low)/2.", php: `function binarySearch(array $a, int $target): int {\n  $lo = 0; $hi = count($a) - 1;\n  while ($lo <= $hi) {\n    $mid = intdiv($lo + $hi, 2);\n    if ($a[$mid] === $target) return $mid;\n    if ($a[$mid] < $target) $lo = $mid + 1;\n    else $hi = $mid - 1;\n  }\n  return -1;\n}`, js: `function binarySearch(a, target) {\n  let lo = 0, hi = a.length - 1;\n  while (lo <= hi) {\n    const mid = (lo + hi) >> 1;\n    if (a[mid] === target) return mid;\n    if (a[mid] < target) lo = mid + 1;\n    else hi = mid - 1;\n  }\n  return -1;\n}`, big: "O(log n) — know the off-by-one traps", x: "Sorted input only. Mid = lo+((hi-lo)>>1) avoids overflow. Off-by-one on lo/hi is the usual bug." },
  { t: "Group By / Aggregate Records", d: "Easy", p: "Given an array of order records, total revenue per customer, sorted descending.", h: "This is the most job-realistic 'algorithm' question you'll get. Reduce into a map, then sort.", php: `function revenueByCustomer(array $orders): array {\n  $totals = [];\n  foreach ($orders as $o) {\n    $totals[$o['customer_id']] = ($totals[$o['customer_id']] ?? 0) + $o['total'];\n  }\n  arsort($totals);\n  return $totals;\n}`, js: `function revenueByCustomer(orders) {\n  const totals = orders.reduce((acc, o) => {\n    acc[o.customerId] = (acc[o.customerId] || 0) + o.total;\n    return acc;\n  }, {});\n  return Object.entries(totals).sort((a, b) => b[1] - a[1]);\n}`, big: "Mention you'd do this in SQL with GROUP BY if the data is in the DB — that answer impresses", x: "Reduce to map, then sort. In real jobs you'd GROUP BY in SQL — saying that impresses." },
  { t: "Paginate an Array (Keyset)", d: "Medium", p: "Implement cursor-based pagination over a sorted dataset.", h: "Filter by 'id greater than cursor', take limit+1 to know if there's a next page.", php: `function page(array $rows, ?int $afterId, int $limit): array {\n  $filtered = $afterId === null ? $rows\n    : array_values(array_filter($rows, fn($r) => $r['id'] > $afterId));\n  $slice = array_slice($filtered, 0, $limit + 1);\n  $hasMore = count($slice) > $limit;\n  return ['data' => array_slice($slice, 0, $limit), 'hasMore' => $hasMore];\n}`, js: `function page(rows, afterId, limit) {\n  const filtered = afterId == null ? rows : rows.filter(r => r.id > afterId);\n  const slice = filtered.slice(0, limit + 1);\n  return { data: slice.slice(0, limit), hasMore: slice.length > limit };\n}`, big: "Tie it back to why OFFSET degrades on deep pages", x: "Filter id > cursor, take limit+1 for hasMore. Ties to why OFFSET dies on deep pages." },
  { t: "Retry with Exponential Backoff", d: "Medium", p: "Call a flaky async function, retrying with exponential backoff up to n times.", h: "Loop with await sleep(2^attempt * base). Mention jitter to avoid thundering herd.", php: `function retry(callable $fn, int $tries = 3) {\n  for ($i = 0; $i < $tries; $i++) {\n    try { return $fn(); }\n    catch (Throwable $e) {\n      if ($i === $tries - 1) throw $e;\n      usleep((2 ** $i) * 100000);\n    }\n  }\n}`, js: `const sleep = ms => new Promise(r => setTimeout(r, ms));\nasync function retry(fn, tries = 3, base = 200) {\n  for (let i = 0; i < tries; i++) {\n    try { return await fn(); }\n    catch (e) {\n      if (i === tries - 1) throw e;\n      const jitter = Math.random() * base;\n      await sleep(2 ** i * base + jitter);\n    }\n  }\n}`, big: "Directly relevant to your queue/webhook work — say so", x: "2^attempt × base + jitter. Jitter avoids thundering herd. Relevant to queues/webhooks — say so." },
];
